                this.player.invincibilityTimer = 2.0; // 2 seconds invincibility
                this.screenShake = 12;
                audio.playerHit();

                if (this.player.lives <= 0) {
                    this.state = 'GAME_OVER';
                    audio.gameOver();
                    this.saveLeaderboard();
                }
            }

            collectPowerUp(pu) {
                audio.powerup();
                if (pu.type === 'P') {
                    // Plasma cell (+1 life, auto-applied)
                    if (this.player.lives < this.player.maxLives) {
                        this.player.lives++;
                    }
                    this.spawnSplatterParticles(this.player.x, this.player.y, '#39ff14', 15);
                } else {
                    // Add to inventories
                    this.inventory[pu.type]++;
                }
            }

            checkPowerUpDrop(x, y) {
                if (Math.random() < 0.05) {
                    const rand = Math.random();
                    let type = 'P'; // Default Plasma
                    if (rand < 0.25) type = 'T';
                    else if (rand < 0.50) type = 'M';
                    else if (rand < 0.75) type = 'C';
                    
                    this.powerUps.push(new PowerUp(x, y, type));
                }
            }

            checkStageCompletion() {
                // Check breach conditions: pathogens reach defensive Y level 810
                const breached = this.pathogens.some(p => p.y >= 810);
                if (breached) {
                    this.state = 'GAME_OVER';
                    audio.gameOver();
                    this.saveLeaderboard();
                    return;
                }

                // Stage clear condition
                if (this.pathogens.length === 0 && !this.boss && this.state === 'PLAYING') {
                    this.state = 'STAGE_CLEAR';
                    this.stageClearTimer = 2.0; // 2s clear transition delay
                }
            }

            // --- DRAWINGS ---
            drawPlaying() {
                // 1. Draw organic microscopic background grid cells
                this.ctx.fillStyle = '#020207';
                this.ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                this.drawGridGrid();

                // 2. Draw organic barriers
                this.barriers.forEach(b => b.draw(this.ctx));

                // 3. Draw pathogens
                this.pathogens.forEach(p => p.draw(this.ctx));

                // 4. Draw boss if exists
                if (this.boss) {
                    this.boss.draw(this.ctx);
                    if (this.bossWarningTimer > 0) {
                        this.drawBossWarning();
                    }
                    this.drawBossHpBar();
                }

                // 5. Draw powerups
                this.powerUps.forEach(pu => pu.draw(this.ctx));

                // 6. Draw player
                this.player.draw(this.ctx);

                // 7. Draw bullets
                this.bullets.forEach(b => b.draw(this.ctx));

                // 8. Draw waves
                this.waves.forEach(w => w.draw(this.ctx));

                // 9. Draw particles
                this.particles.forEach(p => p.draw(this.ctx));

                // 10. Draw UI panels
                this.drawHUD();
                this.drawBottomControlPanel();
            }

            drawGridGrid() {
                this.ctx.strokeStyle = 'rgba(0, 243, 255, 0.03)';
                this.ctx.lineWidth = 1;
                const gridSpacing = 60;
                
                // Draw vertical grid
                const iterationsX = Array.from({ length: Math.ceil(CANVAS_WIDTH / gridSpacing) });
                iterationsX.forEach((_, i) => {
                    const x = i * gridSpacing;
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, CANVAS_HEIGHT);
                    this.ctx.stroke();
                });

                // Draw horizontal grid
                const iterationsY = Array.from({ length: Math.ceil(CANVAS_HEIGHT / gridSpacing) });
                iterationsY.forEach((_, j) => {
                    const y = j * gridSpacing;
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(CANVAS_WIDTH, y);
                    this.ctx.stroke();
                });
            }

            drawHUD() {
                // Top Glassmorphic bar back
                this.ctx.fillStyle = 'rgba(10, 10, 25, 0.82)';
                this.ctx.strokeStyle = 'rgba(0, 243, 255, 0.2)';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.roundRect(15, 15, CANVAS_WIDTH - 30, 75, 8);
                this.ctx.fill();
                this.ctx.stroke();

                // Logo text
                this.ctx.textAlign = 'left';
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = '900 21px Orbitron';
                this.ctx.fillText('IMMUNITY PROTOCOL', 30, 48);

                // Difficulty Badge
                const dColor = DIFF_CONFIGS[this.selectedDiff].color;
                this.ctx.fillStyle = dColor;
                this.ctx.font = '800 10px Orbitron';
                this.ctx.beginPath();
                this.ctx.roundRect(30, 56, 75, 18, 4);
                this.ctx.fill();
                
                this.ctx.fillStyle = '#000000';
                this.ctx.textAlign = 'center';
                this.ctx.fillText(this.selectedDiff, 67, 69);

                // Score / Stage
                this.ctx.textAlign = 'left';
                this.ctx.fillStyle = '#8b9bb4';
                this.ctx.font = '600 11px Outfit';
                this.ctx.fillText('SCORE', 260, 42);
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = '800 18px Orbitron';
                this.ctx.fillText(this.score, 260, 68);

                this.ctx.fillStyle = '#8b9bb4';
                this.ctx.font = '600 11px Outfit';
                this.ctx.fillText('STAGE', 380, 42);
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = '800 18px Orbitron';
                this.ctx.fillText(this.stage, 380, 68);

                // Lineage Info
                this.ctx.fillStyle = '#8b9bb4';
                this.ctx.font = '600 11px Outfit';
                this.ctx.fillText('LINEAGE', 470, 42);
                this.ctx.fillStyle = this.player.lineage.color;
                this.ctx.font = '700 13px Orbitron';
                this.ctx.fillText(this.player.lineage.id, 470, 65);

                // Life Count (Draw mini cells representing lives)
                this.ctx.fillStyle = '#8b9bb4';
                this.ctx.font = '600 11px Outfit';
                this.ctx.fillText('INTEGRITY (LIVES)', 610, 42);
                
                const maxLivesCount = this.player.maxLives;
                const activeLives = this.player.lives;
                const livesIter = Array.from({ length: maxLivesCount });
                livesIter.forEach((_, idx) => {
                    const lx = 615 + idx * 16;
                    const ly = 62;
                    this.ctx.beginPath();
                    this.ctx.arc(lx, ly, 6, 0, Math.PI * 2);
                    if (idx < activeLives) {
                        this.ctx.fillStyle = this.player.lineage.color;
                        this.ctx.shadowBlur = 4;
                        this.ctx.shadowColor = this.player.lineage.color;
                        this.ctx.fill();
                        this.ctx.shadowBlur = 0;
                    } else {
                        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                        this.ctx.lineWidth = 1.5;
                        this.ctx.stroke();
                    }
                });

                // Complement Charges
                this.ctx.fillStyle = '#ffd700';
                this.ctx.font = '700 11px Orbitron';
                this.ctx.fillText('COMPLEMENT [4]', 750, 42);
                const compIter = Array.from({ length: this.maxComplementCharges });
                compIter.forEach((_, idx) => {
                    const cx = 750 + idx * 18;
                    const cy = 52;
                    this.ctx.save();
                    if (idx < this.complementCharges) {
                        this.ctx.fillStyle = '#ffd700';
                        this.ctx.shadowBlur = 8;
                        this.ctx.shadowColor = '#ffd700';
                        this.ctx.fillRect(cx, cy, 12, 12);
                    } else {
                        this.ctx.strokeStyle = 'rgba(255, 215, 0, 0.2)';
                        this.ctx.lineWidth = 1.5;
                        this.ctx.strokeRect(cx, cy, 12, 12);
                    }
                    this.ctx.restore();
                });
            }

            drawBottomControlPanel() {
                // Bottom control panel
                const panelY = 920;
                this.ctx.fillStyle = 'rgba(10, 10, 25, 0.82)';
                this.ctx.strokeStyle = 'rgba(0, 243, 255, 0.2)';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.roundRect(15, panelY, CANVAS_WIDTH - 30, 65, 8);
                this.ctx.fill();
                this.ctx.stroke();

                // Sound state [M] & Pause state [P]
                this.ctx.textAlign = 'left';
                this.ctx.fillStyle = '#8b9bb4';
                this.ctx.font = '600 12px Outfit';
                this.ctx.fillText('AUDIO [M]: ' + (audio.muted ? 'MUTED' : 'ON'), 35, panelY + 28);
                this.ctx.fillText('PAUSE [P]', 35, panelY + 46);

                // Draw inventory legend & hotkeys
                const legends = [
                    { type: 'T', key: '1', name: 'TRIPLE SHOT [1]', count: this.inventory.T, color: '#ffd700', active: this.activeTimers.tripleShot > 0, timer: this.activeTimers.tripleShot },
                    { type: 'M', key: '2', name: 'RAPID FIRE [2]', count: this.inventory.M, color: '#00f3ff', active: this.activeTimers.rapidFire > 0, timer: this.activeTimers.rapidFire },
                    { type: 'C', key: '3', name: 'STORM [3]', count: this.inventory.C, color: '#ff00ff' },
                    { type: 'P', key: '', name: 'LIFE [+1]', count: 'AUTO', color: '#39ff14' }
                ];

                const legXStart = 200;
                const legSpacing = 155;

                legends.forEach((leg, idx) => {
                    const lx = legXStart + idx * legSpacing;
                    const ly = panelY + 32;

                    // Draw colored small hexagon
                    this.ctx.save();
                    this.ctx.strokeStyle = leg.color;
                    this.ctx.lineWidth = 2;
                    this.ctx.fillStyle = 'rgba(5, 5, 20, 0.85)';
                    this.ctx.beginPath();
                    Array.from({ length: 6 }).forEach((_, i) => {
                        const angle = (i / 6) * Math.PI * 2;
                        this.ctx.lineTo(lx + Math.cos(angle) * 11, ly + Math.sin(angle) * 11);
                    });
                    this.ctx.closePath();
                    this.ctx.fill();
                    this.ctx.stroke();

                    // Letter symbol
                    this.ctx.fillStyle = leg.color;
                    this.ctx.font = '800 9px Outfit';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    const sym = leg.type === 'P' ? '+1' : leg.type;
                    this.ctx.fillText(sym, lx, ly);
                    this.ctx.restore();

                    // Text labels & counts
                    this.ctx.textAlign = 'left';
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = '700 11px Orbitron';
                    this.ctx.fillText(leg.name, lx + 18, ly - 3);

                    this.ctx.fillStyle = '#8b9bb4';
                    this.ctx.font = '600 10px Outfit';
                    const cText = leg.type === 'P' ? 'AUTO' : `Qty: ${leg.count}`;
                    this.ctx.fillText(cText, lx + 18, ly + 9);

                    // If active, draw countdown text
                    if (leg.active && leg.timer > 0) {
                        this.ctx.fillStyle = leg.color;
                        this.ctx.font = '800 10px Orbitron';
                        this.ctx.fillText(leg.timer.toFixed(1) + 's', lx + 90, ly + 3);
                    }
                });

                // Gold Complement panel label
                this.ctx.fillStyle = '#ffd700';
                this.ctx.font = '700 10px Orbitron';
                this.ctx.textAlign = 'right';
                this.ctx.fillText(`Complement: ${this.complementCharges}/4 [4]`, CANVAS_WIDTH - 35, panelY + 36);
                this.ctx.textAlign = 'left';
            }

            drawBossWarning() {
                this.ctx.save();
                this.ctx.fillStyle = 'rgba(255, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                
                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = '#ff3333';
                this.ctx.shadowBlur = 10;
                this.ctx.shadowColor = '#ff3333';
                this.ctx.font = '900 48px Orbitron';
                this.ctx.fillText('PATHOGENIC MUTATION DETECTED', CANVAS_WIDTH / 2, 440);
                this.ctx.font = '600 20px Outfit';
                this.ctx.fillStyle = '#ffffff';
                this.ctx.fillText('MUTAGEN CELL SPAWNING', CANVAS_WIDTH / 2, 490);
                this.ctx.restore();
            }

            drawBossHpBar() {
                if (!this.boss) return;
                const barWidth = 600;
                const barHeight = 14;
                const bx = (CANVAS_WIDTH - barWidth) / 2;
                const by = 110;

                this.ctx.save();
                
                // Draw HP bar frame
                this.ctx.fillStyle = 'rgba(10, 10, 25, 0.8)';
                this.ctx.strokeStyle = 'rgba(255, 0, 255, 0.4)';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.roundRect(bx, by, barWidth, barHeight, 4);
                this.ctx.fill();
                this.ctx.stroke();

                // Draw segmented fill in thirds
                const fillRatio = Math.max(0, this.boss.hp / this.boss.maxHp);
                const thirdRatio = 1 / 3;
                
                const fills = Array.from({ length: 3 });
                fills.forEach((_, i) => {
                    const startRatio = i * thirdRatio;
                    if (fillRatio > startRatio) {
                        const currentSegmentFill = Math.min(thirdRatio, fillRatio - startRatio);
                        const segmentW = currentSegmentFill * barWidth;
                        const segmentX = bx + startRatio * barWidth;
                        
                        this.ctx.fillStyle = '#ff00ff';
                        if (fillRatio < 0.34) this.ctx.fillStyle = '#ff3333'; // Low HP warning color
                        
                        this.ctx.beginPath();
                        this.ctx.rect(segmentX + 1, by + 1.5, segmentW - 2, barHeight - 3);
                        this.ctx.fill();
                    }
                });

                // Label
                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = '800 10px Orbitron';
                this.ctx.fillText(`MUTAGEN CELL HOSTILE HP: ${this.boss.hp} / ${this.boss.maxHp}`, CANVAS_WIDTH / 2, by - 8);

                this.ctx.restore();
            }

            // --- MENU SCREENS & OVERLAYS ---
            drawMenu() {
                this.clickRegions = [];

                // Microscopic grid background
                this.ctx.fillStyle = '#020207';
                this.ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                this.drawGridGrid();

                // Title Banner
                this.ctx.textAlign = 'center';
                this.ctx.shadowBlur = 25;
                this.ctx.shadowColor = '#00f3ff';
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = '900 64px Orbitron';
                this.ctx.fillText('IMMUNITY', CANVAS_WIDTH / 2, 280);
                
                this.ctx.shadowColor = '#ff00ff';
                this.ctx.fillStyle = '#ff00ff';
                this.ctx.fillText('PROTOCOL', CANVAS_WIDTH / 2, 360);
                
                this.ctx.shadowBlur = 0;
                this.ctx.fillStyle = '#8b9bb4';
                this.ctx.font = '600 18px Outfit';
                this.ctx.fillText('Tactical Pathogen Neutralization and Host Defense', CANVAS_WIDTH / 2, 410);

                // Play / Selection options
                const startBtnX = (CANVAS_WIDTH - 280) / 2;
                const startBtnY = 560;
                
                this.drawNeonButton(startBtnX, startBtnY, 280, 55, 'START SYSTEM', '#00f3ff', () => {
                    this.state = 'LINEAGE_SELECT';
                    audio.hit();
                });

                // Draw Leaderboard
                this.drawLeaderboardOverlay(CANVAS_WIDTH / 2, 700);
            }
             drawLineageSelector() {
                this.clickRegions = [];
                
                this.ctx.fillStyle = '#020207';
                this.ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                this.drawGridGrid();

                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = '900 32px Orbitron';
                this.ctx.fillText('SELECT PLAYABLE CELL LINEAGE', CANVAS_WIDTH / 2, 100);

                // Draw current high score
                this.ctx.font = '700 13px Orbitron';
                this.ctx.fillStyle = '#ffd700';
                this.ctx.fillText(`CURRENT HIGH SCORE: ${this.highScore.toLocaleString()} PTS`, CANVAS_WIDTH / 2, 135);

                // Draw Difficulty choice
                this.ctx.font = '800 13px Orbitron';
                this.ctx.fillStyle = '#8b9bb4';
                this.ctx.fillText('DIFFICULTY SYSTEM:', CANVAS_WIDTH / 2, 160);

                const diffs = ['EASY', 'NORMAL', 'HARD'];
                const dWidth = 110;
                const dHeight = 35;
                const dSpacing = 135;
                const dStartX = (CANVAS_WIDTH - (3 * dWidth + 2 * 25)) / 2;

                diffs.forEach((diff, idx) => {
                    const dx = dStartX + idx * dSpacing;
                    const dy = 180;
                    const isSelected = this.selectedDiff === diff;
                    const config = DIFF_CONFIGS[diff];

                    this.ctx.save();
                    this.ctx.fillStyle = isSelected ? config.color : 'rgba(10, 10, 25, 0.8)';
                    this.ctx.strokeStyle = config.color;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.roundRect(dx, dy, dWidth, dHeight, 6);
                    this.ctx.fill();
                    this.ctx.stroke();

                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillStyle = isSelected ? '#000000' : '#ffffff';
                    this.ctx.font = '800 12px Orbitron';
                    this.ctx.fillText(diff, dx + dWidth / 2, dy + dHeight / 2);
                    this.ctx.restore();

                    this.registerRegion(dx, dy, dWidth, dHeight, () => {
                        this.selectedDiff = diff;
                        audio.hit();
                    });
                });

                // Lineage cards list layout
                const cardWidth = 240;
                const cardHeight = 360;
                const cardSpacing = 270;
                const startX = (CANVAS_WIDTH - (3 * cardWidth + 2 * 30)) / 2;
                const cardY = 280;

                const unlockThresholds = {
                    'MACROPHAGE': 0,
                    'NATURAL_KILLER': 5000,
                    'NEUTROPHIL': 15000
                };

                LINEAGES.forEach((lin, idx) => {
                    const cx = startX + idx * cardSpacing;
                    const cy = cardY;
                    const isSelected = this.selectedLineageIndex === idx;
                    const isLocked = this.highScore < (unlockThresholds[lin.id] || 0);

                    this.ctx.save();
                    this.ctx.fillStyle = 'rgba(10, 10, 30, 0.85)';
                    this.ctx.strokeStyle = isSelected ? lin.color : 'rgba(255, 255, 255, 0.1)';
                    this.ctx.lineWidth = isSelected ? 3 : 1.5;
                    
                    if (isSelected) {
                        this.ctx.shadowBlur = 15;
                        this.ctx.shadowColor = lin.color;
                    }
                    
                    this.ctx.beginPath();
                    this.ctx.roundRect(cx, cy, cardWidth, cardHeight, 10);
                    this.ctx.fill();
                    this.ctx.stroke();
                    this.ctx.shadowBlur = 0;

                    // If locked, fade the cell drawing
                    if (isLocked) {
                        this.ctx.globalAlpha = 0.35;
                    }

                    // Draw Nucleus visualization
                    const mockPulse = performance.now() / 250;
                    lin.drawNucleus(this.ctx, cx + cardWidth/2, cy + 90, 48, mockPulse);

                    // Outer shell
                    this.ctx.strokeStyle = lin.color;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.arc(cx + cardWidth/2, cy + 90, 48, 0, Math.PI * 2);
                    this.ctx.stroke();

                    // Lineage Name
                    this.ctx.textAlign = 'center';
                    this.ctx.fillStyle = lin.color;
                    this.ctx.font = '900 16px Orbitron';
                    this.ctx.fillText(lin.name, cx + cardWidth / 2, cy + 180);

                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = '600 11px Outfit';
                    this.ctx.fillText(lin.subname, cx + cardWidth / 2, cy + 200);

                    // Stats lines
                    this.ctx.textAlign = 'left';
                    this.ctx.fillStyle = '#8b9bb4';
                    this.ctx.font = '600 11px Outfit';
                    
                    const drawStatLine = (label, value, yOffset) => {
                        this.ctx.fillStyle = '#8b9bb4';
                        this.ctx.fillText(label, cx + 30, cy + yOffset);
                        this.ctx.fillStyle = '#ffffff';
                        this.ctx.fillText(value, cx + 160, cy + yOffset);
                    };

                    drawStatLine('MAX INTEGRITY:', lin.maxLives + ' HP', 235);
                    drawStatLine('SPEED:', lin.speed + ' px/s', 255);
                    const fireRateText = lin.id === 'NATURAL_KILLER' ? '3 bullets / 0.3s' : (lin.id === 'NEUTROPHIL' ? '1 bullet / 0.23s' : '1 bullet / 0.28s');
                    drawStatLine('FIRE RATE:', fireRateText, 275);
                    
                    this.ctx.textAlign = 'center';
                    this.ctx.fillStyle = '#ffd700';
                    this.ctx.font = '700 10px Orbitron';
                    this.ctx.fillText(lin.id === 'NATURAL_KILLER' ? 'PIERCING WEAPON' : (lin.id === 'NEUTROPHIL' ? 'RAPID SPEED' : 'BALANCED ANTIBODIES'), cx + cardWidth/2, cy + 305);

                    // Restore globalAlpha so the locked banner draws cleanly
                    this.ctx.globalAlpha = 1.0;

                    if (isLocked) {
                        // Draw locking overlay
                        this.ctx.fillStyle = 'rgba(10, 10, 25, 0.7)';
                        this.ctx.beginPath();
                        this.ctx.roundRect(cx + 15, cy + 60, cardWidth - 30, 110, 6);
                        this.ctx.fill();

                        this.ctx.fillStyle = '#ff3333';
                        this.ctx.font = '900 14px Orbitron';
                        this.ctx.fillText('🔒 LOCKED', cx + cardWidth/2, cy + 105);
                        this.ctx.fillStyle = '#ffffff';
                        this.ctx.font = '800 10px Orbitron';
                        this.ctx.fillText(`${unlockThresholds[lin.id].toLocaleString()} PTS REQ`, cx + cardWidth/2, cy + 130);
                    }

                    // Interactive click select regions
                    this.registerRegion(cx, cy, cardWidth, cardHeight, () => {
                        if (!isLocked) {
                            this.selectedLineageIndex = idx;
                            audio.hit();
                        } else {
                            // play a error-feedback sound (low rumble hit)
                            audio.playerHit();
                        }
                    });

                    this.ctx.restore();
                });

                // Start button bottom
                const btnX = (CANVAS_WIDTH - 250) / 2;
                const btnY = 700;
                this.drawNeonButton(btnX, btnY, 250, 50, 'DEPLOY CELL', '#ffd700', () => {
                    this.startNewGame();
                });
            }

            drawNeonButton(x, y, w, h, text, color, callback) {
                this.ctx.save();
                
                // Border glow
                this.ctx.fillStyle = 'rgba(10, 10, 30, 0.85)';
                this.ctx.strokeStyle = color;
                this.ctx.lineWidth = 2.5;
                this.ctx.beginPath();
                this.ctx.roundRect(x, y, w, h, 8);
                this.ctx.fill();
                this.ctx.stroke();

                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = '900 15px Orbitron';
                this.ctx.fillText(text, x + w / 2, y + h / 2 + 1);

                this.ctx.restore();
                this.registerRegion(x, y, w, h, callback);
            }

            drawPauseOverlay() {
                this.ctx.fillStyle = 'rgba(2, 2, 7, 0.7)';
                this.ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = '#00f3ff';
                this.ctx.shadowBlur = 20;
                this.ctx.shadowColor = '#00f3ff';
                this.ctx.font = '900 44px Orbitron';
                this.ctx.fillText('BIOME DEFENSE PAUSED', CANVAS_WIDTH / 2, 450);
                this.ctx.font = '600 16px Outfit';
                this.ctx.fillStyle = '#ffffff';
                this.ctx.fillText('Press [P] to Resume cellular transmission', CANVAS_WIDTH / 2, 500);
            }

            drawStageClearOverlay() {
                this.ctx.save();
                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = '#39ff14';
                this.ctx.shadowBlur = 15;
                this.ctx.shadowColor = '#39ff14';
                this.ctx.font = '900 48px Orbitron';
                this.ctx.fillText('STAGE CLEARED', CANVAS_WIDTH / 2, 450);
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = '600 16px Outfit';
                this.ctx.fillText('Neutralization complete. Preparing next sector...', CANVAS_WIDTH / 2, 490);
                this.ctx.restore();
            }

            drawGameOver() {
                this.clickRegions = [];

                this.ctx.fillStyle = '#020207';
                this.ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                this.drawGridGrid();

                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = '#ff3333';
                this.ctx.shadowBlur = 20;
                this.ctx.shadowColor = '#ff3333';
                this.ctx.font = '900 64px Orbitron';
                this.ctx.fillText('HOST DESTROYED', CANVAS_WIDTH / 2, 220);
                
                this.ctx.shadowBlur = 0;
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = '600 18px Outfit';
                this.ctx.fillText('Cellular integrity collapsed. Pathogenic breach successful.', CANVAS_WIDTH / 2, 270);

                // Run summary stats
                const statY = 320;
                this.ctx.textAlign = 'left';
                this.ctx.font = '600 14px Outfit';
                this.ctx.fillStyle = '#8b9bb4';
                
                const drawGameOverStat = (lbl, val, yOff) => {
                    this.ctx.fillStyle = '#8b9bb4';
                    this.ctx.fillText(lbl, 320, statY + yOff);
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.fillText(val, 520, statY + yOff);
                };

                drawGameOverStat('FINAL SCORE:', this.score, 0);
                drawGameOverStat('SECTORS PURIFIED:', this.stage, 25);
                drawGameOverStat('PATHOGENS LYSED:', this.kills, 50);
                drawGameOverStat('LINEAGE DEPLOYED:', this.player.lineage.name, 75);

                // Leaderboard
                this.drawLeaderboardOverlay(CANVAS_WIDTH / 2, 470);

                // Restart button
                const btnX = (CANVAS_WIDTH - 250) / 2;
                const btnY = 820;
                this.drawNeonButton(btnX, btnY, 250, 52, 'RETURN TO MAIN', '#00f3ff', () => {
                    this.state = 'MENU';
                    audio.hit();
                });
            }

            drawLeaderboardOverlay(cx, cy) {
                this.ctx.save();
                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = '#ffd700';
                this.ctx.font = '800 14px Orbitron';
                this.ctx.fillText('TOP 5 DEFENDER BENCHMARKS', cx, cy);

                const tableY = cy + 25;
                const rowH = 24;

                this.ctx.fillStyle = 'rgba(10, 10, 25, 0.7)';
                this.ctx.strokeStyle = 'rgba(255, 215, 0, 0.2)';
                this.ctx.lineWidth = 1.5;
                this.ctx.beginPath();
                this.ctx.roundRect(cx - 250, tableY, 500, rowH * 6 + 10, 6);
                this.ctx.fill();
                this.ctx.stroke();

                // Table headers
                this.ctx.fillStyle = '#8b9bb4';
                this.ctx.font = '800 10px Orbitron';
                this.ctx.textAlign = 'left';
                this.ctx.fillText('MEDAL', cx - 230, tableY + 20);
                this.ctx.fillText('LINEAGE', cx - 140, tableY + 20);
                this.ctx.fillText('STAGE', cx + 70, tableY + 20);
                this.ctx.fillText('SCORE', cx + 160, tableY + 20);

                // Divider line
                this.ctx.strokeStyle = 'rgba(255, 215, 0, 0.15)';
                this.ctx.beginPath();
                this.ctx.moveTo(cx - 235, tableY + 28);
                this.ctx.lineTo(cx + 235, tableY + 28);
                this.ctx.stroke();

                // Records list
                this.ctx.font = '600 12px Outfit';
                const count = Math.max(5, this.leaderboard.length);
                const loopIter = Array.from({ length: 5 });

                loopIter.forEach((_, idx) => {
                    const rowY = tableY + 46 + idx * rowH;
                    const record = this.leaderboard[idx];

                    // Medal indicators
                    const medalLabels = ['❶ GOLD', '❷ SILVER', '❸ BRONZE', '❹', '❺'];
                    const medalColors = ['#ffd700', '#c0c0c0', '#cd7f32', '#8b9bb4', '#8b9bb4'];
                    
                    this.ctx.fillStyle = medalColors[idx];
                    this.ctx.font = '800 11px Orbitron';
                    this.ctx.fillText(medalLabels[idx], cx - 230, rowY);
                    
                    this.ctx.font = '600 12px Outfit';
                    if (record) {
                        this.ctx.fillStyle = '#ffffff';
                        this.ctx.fillText(record.lineage.substring(0, 15), cx - 140, rowY);
                        this.ctx.fillText(record.stage, cx + 70, rowY);
                        this.ctx.fillText(record.score, cx + 160, rowY);
                    } else {
                        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                        this.ctx.fillText('---', cx - 140, rowY);
                        this.ctx.fillText('---', cx + 70, rowY);
                        this.ctx.fillText('---', cx + 160, rowY);
                    }
                });

                this.ctx.restore();
            }
        }

        // --- LAUNCH ENGINE ---
        const game = new BiomeGame();
        game.init();

    </script>
