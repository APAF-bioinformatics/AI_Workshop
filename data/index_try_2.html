<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

/* ---------- Responsive scaling to viewport ---------- */
function fit() {
  const pad = 24;
  const aw = window.innerWidth - pad;
  const ah = window.innerHeight - pad;
  const s = Math.min(aw / W, ah / H);
  canvas.style.width = (W * s) + "px";
  canvas.style.height = (H * s) + "px";
}
window.addEventListener("resize", fit);
fit();

/* ---------- Math helpers ---------- */
const TAU = Math.PI * 2;
const rand = (a = 1, b) => b == null ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b));
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const dist2 = (x1, y1, x2, y2) => (x2 - x1) ** 2 + (y2 - y1) ** 2;

/* ---------- Safe Storage helper ---------- */
const storage = {
  get(key, fallback) {
    try { return localStorage.getItem(key) || fallback; } catch { return fallback; }
  },
  set(key, val) {
    try { localStorage.setItem(key, val); } catch {}
  }
};

/* ---------- Input ---------- */
const keys = Object.create(null);
const keyPressed = Object.create(null);
addEventListener("keydown", e => {
  if (!keys[e.code]) keyPressed[e.code] = true;
  keys[e.code] = true;
  if (["Space","ArrowLeft","ArrowRight","ArrowUp","ArrowDown","ShiftLeft","ShiftRight"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup", e => { keys[e.code] = false; });

/* ---------- Audio (procedural, WebAudio) ---------- */
const Audio = (() => {
  let ctxA = null;
  let muted = false;
  let analyser = null;
  let masterGain = null;
  let noiseBuffer = null;

  const init = () => {
    if (ctxA) return;
    ctxA = new (window.AudioContext || window.webkitAudioContext)();
    
    // Cache 2 seconds of white noise buffer
    const bufSize = ctxA.sampleRate * 2.0;
    noiseBuffer = ctxA.createBuffer(1, bufSize, ctxA.sampleRate);
    const d = noiseBuffer.getChannelData(0);
    Array.from({ length: bufSize }).forEach((_, i) => {
      d[i] = Math.random() * 2 - 1;
    });

    analyser = ctxA.createAnalyser();
    analyser.fftSize = 1024;

    masterGain = ctxA.createGain();
    masterGain.gain.setValueAtTime(muted ? 0 : 0.8, ctxA.currentTime);

    analyser.connect(masterGain);
    masterGain.connect(ctxA.destination);

    if (ctxA.state === "suspended") ctxA.resume();
  };

  const env = (gain, t0, atk, dec, peak = 1) => {
    gain.gain.cancelScheduledValues(t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(peak, t0 + atk);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + atk + dec);
  };

  const tone = (freq, dur, type = "sine", vol = 0.25, slideTo = null) => {
    if (!ctxA || muted) return;
    const t = ctxA.currentTime;
    const o = ctxA.createOscillator();
    const g = ctxA.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo != null) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    o.connect(g); g.connect(analyser);
    env(g, t, 0.005, dur, vol);
    o.start(t); o.stop(t + dur + 0.05);
  };

  const noise = (dur, vol = 0.3, filterFreq = 1200, filterType = "lowpass") => {
    if (!ctxA || muted) return;
    const t = ctxA.currentTime;
    const src = ctxA.createBufferSource();
    src.buffer = noiseBuffer;
    
    const filt = ctxA.createBiquadFilter();
    filt.type = filterType;
    filt.frequency.setValueAtTime(filterFreq, t);
    
    const g = ctxA.createGain();
    src.connect(filt); filt.connect(g); g.connect(analyser);
    env(g, t, 0.005, dur, vol);
    src.start(t); src.stop(t + dur + 0.05);
  };

  return {
    init,
    toggle: () => {
      muted = !muted;
      if (masterGain && ctxA) {
        masterGain.gain.setValueAtTime(muted ? 0 : 0.8, ctxA.currentTime);
      }
      return muted;
    },
    isMuted: () => muted,
    getAnalyser: () => analyser,
    shoot: () => tone(880, 0.08, "square", 0.06, 1400),
    hit: () => { tone(220, 0.06, "triangle", 0.18, 110); noise(0.08, 0.08, 800); },
    lyse: () => { noise(0.35, 0.22, 1500); tone(160, 0.4, "sawtooth", 0.12, 60); },
    powerup: () => {
      if (!ctxA || muted) return;
      const t = ctxA.currentTime;
      const notes = [523, 784, 1047];
      const delays = [0, 0.07, 0.15];
      const vols = [0.18, 0.2, 0.18];
      notes.forEach((freq, idx) => {
        const time = t + delays[idx];
        const o = ctxA.createOscillator();
        const g = ctxA.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(freq, time);
        o.connect(g); g.connect(analyser);
        env(g, time, 0.005, 0.1, vols[idx]);
        o.start(time); o.stop(time + 0.15);
      });
    },
    levelUp: () => {
      if (!ctxA || muted) return;
      const t = ctxA.currentTime;
      const notes = [440, 660, 880];
      const delays = [0, 0.11, 0.22];
      notes.forEach((freq, idx) => {
        const time = t + delays[idx];
        const o = ctxA.createOscillator();
        const g = ctxA.createGain();
        o.type = "triangle";
        o.frequency.setValueAtTime(freq, time);
        o.connect(g); g.connect(analyser);
        env(g, time, 0.005, 0.12, 0.22);
        o.start(time); o.stop(time + 0.2);
      });
    },
    playerHit: () => { noise(0.5, 0.35, 600); tone(110, 0.5, "sawtooth", 0.2, 40); },
    gameOver: () => {
      if (!ctxA || muted) return;
      const t = ctxA.currentTime;
      tone(220, 0.5, "sawtooth", 0.25, 60);
      setTimeout(() => tone(165, 0.7, "sawtooth", 0.25, 50), 200);
    },
    bossWarn: () => {
      Array.from({ length: 4 }).forEach((_, i) => {
        setTimeout(() => tone(200, 0.15, "square", 0.22), i * 200);
      });
    },
    complement: () => {
      if (!ctxA || muted) return;
      const t = ctxA.currentTime;
      const notes = [440, 660, 880];
      const sweeps = [1320, 1760, 2200];
      const delays = [0, 0.07, 0.16];
      const durs = [0.16, 0.18, 0.30];
      notes.forEach((freq, idx) => {
        const time = t + delays[idx];
        const o = ctxA.createOscillator();
        const g = ctxA.createGain();
        o.type = "triangle";
        o.frequency.setValueAtTime(freq, time);
        o.frequency.exponentialRampToValueAtTime(sweeps[idx], time + durs[idx]);
        o.connect(g); g.connect(analyser);
        env(g, time, 0.005, durs[idx], 0.22);
        o.start(time); o.stop(time + durs[idx] + 0.05);
      });
      noise(0.4, 0.09, 4500, "highpass");
    },
    bossSweep: () => { tone(330, 0.5, "sawtooth", 0.18, 110); noise(0.4, 0.05, 600); },
    bossSummon: () => {
      if (!ctxA || muted) return;
      const t = ctxA.currentTime;
      tone(140, 0.5, "square", 0.22, 70);
      Array.from({ length: 3 }).forEach((_, i) => {
        setTimeout(() => tone(220 + i * 60, 0.12, "triangle", 0.16), 120 + i * 80);
      });
    },
    unlock: () => {
      if (!ctxA || muted) return;
      const t = ctxA.currentTime;
      const notes = [523, 659, 784, 1047];
      const delays = [0, 0.1, 0.2, 0.32];
      notes.forEach((freq, idx) => {
        const time = t + delays[idx];
        const o = ctxA.createOscillator();
        const g = ctxA.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(freq, time);
        o.connect(g); g.connect(analyser);
        env(g, time, 0.005, 0.12, 0.2);
        o.start(time); o.stop(time + 0.25);
      });
    },
  };
})();

const VARIANT_ORDER = ["macrophage", "neutrophil", "nk"];

/* ---------- Meta progression (persistent across runs) ---------- */
const Meta = {
  totalKills: 0,
  peakStage: 1,
  selectedVariant: "macrophage",
  load() {
    try {
      const d = JSON.parse(storage.get("ip_meta_v2", "{}"));
      this.totalKills = d.totalKills | 0;
      this.peakStage = Math.max(1, d.peakStage | 0);
      this.selectedVariant = VARIANTS[d.selectedVariant] ? d.selectedVariant : "macrophage";
      if (!this.isUnlocked(this.selectedVariant)) this.selectedVariant = "macrophage";
    } catch { /* ignore */ }
  },
  save() {
    storage.set("ip_meta_v2", JSON.stringify({
      totalKills: this.totalKills,
      peakStage: this.peakStage,
      selectedVariant: this.selectedVariant,
    }));
  },
  isUnlocked(key) { return VARIANTS[key] && this.totalKills >= VARIANTS[key].unlockKills; },
  recordKill() {
    const before = this.totalKills;
    this.totalKills++;
    VARIANT_ORDER.forEach(k => {
      const v = VARIANTS[k];
      if (before < v.unlockKills && this.totalKills >= v.unlockKills) {
        game.flashMessage("LINEAGE UNLOCKED: " + v.name, C.gold);
        Audio.unlock();
      }
    });
  },
  recordStage(stage) { if (stage > this.peakStage) this.peakStage = stage; },
};

/* ---------- Background — drifting cells & microscope feel ---------- */
const bg = {
  cells: [],
  init() {
    this.cells = [];
    Array.from({ length: 28 }).forEach(() => {
      this.cells.push({
        x: rand(0, W), y: rand(0, H),
        r: rand(14, 38), v: rand(6, 18),
        rot: rand(0, TAU), spin: rand(-0.3, 0.3),
        type: Math.random() < 0.7 ? "rbc" : "platelet",
        alpha: rand(0.06, 0.16),
      });
    });
  },
  update(dt) {
    this.cells.forEach(c => {
      c.y += c.v * dt;
      c.rot += c.spin * dt;
      if (c.y - c.r > H) { c.y = -c.r; c.x = rand(0, W); }
    });
  },
  draw() {
    const g = ctx.createRadialGradient(W/2, H*0.4, 60, W/2, H*0.5, H*0.9);
    g.addColorStop(0, "#0a1228");
    g.addColorStop(0.6, "#04081a");
    g.addColorStop(1, "#020308");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalAlpha = 0.04;
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 1;
    Array.from({ length: Math.floor(W / 60) + 1 }).forEach((_, i) => {
      const x = i * 60;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    });
    Array.from({ length: Math.floor(H / 60) + 1 }).forEach((_, j) => {
      const y = j * 60;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    });
    ctx.restore();

    this.cells.forEach(c => {
      ctx.save();
      ctx.globalAlpha = c.alpha;
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      if (c.type === "rbc") {
        const grd = ctx.createRadialGradient(0, 0, c.r * 0.1, 0, 0, c.r);
        grd.addColorStop(0, "#5a1525");
        grd.addColorStop(0.55, C.rbc);
        grd.addColorStop(1, "#3a0e1a");
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.ellipse(0, 0, c.r, c.r * 0.85, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.beginPath(); ctx.ellipse(0, 0, c.r * 0.4, c.r * 0.35, 0, 0, TAU); ctx.fill();
      } else {
        ctx.fillStyle = "rgba(200,210,230,0.7)";
        ctx.beginPath();
        const n = 7;
        Array.from({ length: n + 1 }).forEach((_, i) => {
          const a = (i / n) * TAU;
          const rr = c.r * 0.4 + Math.sin(i * 1.7) * c.r * 0.08;
          const px = Math.cos(a) * rr;
          const py = Math.sin(a) * rr;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        ctx.fill();
      }
      ctx.restore();
    });

    const vg = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.75);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.7)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }
};

/* ---------- Particles ---------- */
let particles = [];
function emitParticles(opts) {
  const n = opts.n ?? 12;
  Array.from({ length: n }).forEach((_, i) => {
    const a = (opts.angle ?? rand(0, TAU)) + rand(-(opts.spread ?? Math.PI), opts.spread ?? Math.PI);
    const s = rand(opts.speedMin ?? 30, opts.speedMax ?? 220);
    particles.push({
      x: opts.x, y: opts.y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: opts.life ?? rand(0.4, 0.9),
      age: 0,
      size: opts.size ?? rand(1.5, 3.5),
      color: opts.color ?? "#fff",
      gravity: opts.gravity ?? 0,
      drag: opts.drag ?? 1.5,
      glow: opts.glow ?? true,
      shape: opts.shape ?? "dot",
    });
  });
}
function updateParticles(dt) {
  particles.forEach(p => {
    p.age += dt;
    p.vx -= p.vx * p.drag * dt;
    p.vy -= p.vy * p.drag * dt;
    p.vy += p.gravity * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  });
  particles = particles.filter(p => p.age < p.life);
}
function drawParticles() {
  ctx.save();
  particles.forEach(p => {
    const t = 1 - p.age / p.life;
    ctx.globalAlpha = t;
    if (p.glow) { ctx.shadowBlur = 12; ctx.shadowColor = p.color; }
    ctx.fillStyle = p.color;
    if (p.shape === "dot") {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * t, 0, TAU); ctx.fill();
    } else if (p.shape === "frag") {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.age * 6);
      ctx.fillRect(-p.size * t, -p.size * t * 0.4, p.size * t * 2, p.size * t * 0.8);
      ctx.restore();
    }
  });
  ctx.restore();
}

/* ---------- Screen shake ---------- */
let shakeT = 0, shakeMag = 0;
function shake(mag = 8, time = 0.25) { shakeMag = Math.max(shakeMag, mag); shakeT = Math.max(shakeT, time); }

/* ---------- Player (variant-aware immune cell) ---------- */
class Player {
  constructor(variantKey) {
    const v = VARIANTS[variantKey] || VARIANTS.macrophage;
    this.variantKey = v.key;
    this.variant = v;
    this.x = W / 2;
    this.y = H - 110;
    this.r = 26;
    this.speed = v.speed;
    this.cooldown = 0;
    this.baseFireRate = v.fireRate;
    this.fireRate = v.fireRate;
    this.lives = v.startLives;
    this.maxLives = v.maxLives;
    this.invulnMax = v.invulnTime;
    this.invuln = v.invulnTime;
    this.tri = 0;
    this.rapid = 0;
    this.dead = false;
    this.respawnT = 0;
    this.time = 0;
    this.complement = 2;
    this.complementMax = 4;
    this.complementProgress = 0;
    this.complementPerCharge = 30;
  }
  reset() {
    this.x = W / 2;
    this.invuln = this.invulnMax;
    this.dead = false;
    this.respawnT = 0;
  }
  update(dt) {
    this.time += dt;
    if (this.dead) {
      this.respawnT -= dt;
      if (this.respawnT <= 0 && this.lives > 0) this.reset();
      return;
    }
    let vx = 0;
    if (keys.ArrowLeft || keys.KeyA) vx -= 1;
    if (keys.ArrowRight || keys.KeyD) vx += 1;
    this.x = clamp(this.x + vx * this.speed * dt, this.r + 10, W - this.r - 10);

    if (this.invuln > 0) this.invuln -= dt;
    if (this.tri > 0) this.tri -= dt;
    if (this.rapid > 0) this.rapid -= dt;
    this.fireRate = this.rapid > 0 ? (this.baseFireRate * 0.45) : this.baseFireRate;

    this.cooldown -= dt;
    if (keys.Space && this.cooldown <= 0) {
      this.shoot();
      this.cooldown = this.fireRate;
    }

    if (keyPressed.ShiftLeft || keyPressed.ShiftRight) {
      this.fireComplement();
    }
  }
  shoot() {
    Audio.shoot();
    const v = this.variant;
    const y0 = this.y - this.r - 6;
    const mk = (x, y, vx, vy) => new Bullet(x, y, vx, vy, false, v.bulletColor, v.bulletDamage, v.bulletPierce, v.bulletShape);
    const vy = v.bulletVy;
    if (this.tri > 0) {
      bullets.push(mk(this.x, y0, 0, vy));
      bullets.push(mk(this.x - 10, y0 + 4, -180, vy * 0.94));
      bullets.push(mk(this.x + 10, y0 + 4,  180, vy * 0.94));
    } else {
      bullets.push(mk(this.x, y0, 0, vy));
    }
    emitParticles({ x: this.x, y: y0, n: 3, angle: -Math.PI/2, spread: 0.4, speedMin: 40, speedMax: 90, life: 0.18, size: 1.4, color: v.bulletColor });
  }
  fireComplement() {
    if (this.complement <= 0) return;
    this.complement--;
    complementBlasts.push(new ComplementBlast(this.x, this.y));
    Audio.complement();
    shake(10, 0.3);
    Array.from({ length: 30 }).forEach((_, i) => {
      emitParticles({ x: this.x, y: this.y, n: 1, speedMin: 40, speedMax: 220, life: rand(0.4, 0.9), size: rand(1.5, 3), color: i % 2 ? C.gold : C.goldSoft });
    });
  }
  awardKill() {
    this.complementProgress++;
    if (this.complementProgress >= this.complementPerCharge) {
      this.complementProgress = 0;
      if (this.complement < this.complementMax) {
        this.complement++;
        game.flashMessage("+1 COMPLEMENT CHARGE", C.gold);
        Audio.powerup();
      }
    }
  }
  hit() {
    if (this.invuln > 0 || this.dead) return false;
    this.lives--;
    this.dead = true;
    this.respawnT = 1.4;
    Audio.playerHit();
    shake(14, 0.4);
    Array.from({ length: 50 }).forEach((_, i) => {
      emitParticles({ x: this.x, y: this.y, n: 1, speedMin: 60, speedMax: 320, life: rand(0.5, 1.1), size: rand(1.5, 3), color: i % 3 === 0 ? this.variant.bulletColor : C.white, shape: i % 4 === 0 ? "frag" : "dot" });
    });
    return true;
  }
  draw() {
    if (this.dead) return;
    const t = this.time;
    const x = this.x, y = this.y, r = this.r;
    const v = this.variant;

    ctx.save();
    const haloGrd = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * 2.4);
    haloGrd.addColorStop(0, v.haloColor);
    haloGrd.addColorStop(0.5, "rgba(77, 255, 230, 0.10)");
    haloGrd.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = haloGrd;
    ctx.beginPath(); ctx.arc(x, y, r * 2.4, 0, TAU); ctx.fill();

    if (this.invuln > 0 && Math.floor(this.invuln * 18) % 2 === 0) ctx.globalAlpha = 0.45;

    ctx.beginPath();
    const points = 28;
    Array.from({ length: points + 1 }).forEach((_, i) => {
      const a = (i / points) * TAU;
      const wob = Math.sin(a * 4 + t * 2.2) * 2.4 + Math.sin(a * 7 - t * 1.4) * 1.1;
      const podo = Math.max(0, Math.cos(a * 3 + t)) * 3;
      const rr = r + wob + podo;
      const px = x + Math.cos(a) * rr;
      const py = y + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.closePath();
    const cellGrd = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.1);
    cellGrd.addColorStop(0,    v.bodyTintInner);
    cellGrd.addColorStop(0.55, v.bodyTintMid);
    cellGrd.addColorStop(1,    v.bodyTintOuter);
    ctx.fillStyle = cellGrd;
    ctx.shadowBlur = 18; ctx.shadowColor = v.haloColor;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(120,170,220,0.7)";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    if (v.grains) {
      ctx.fillStyle = "rgba(255,255,255,0.65)";
      Array.from({ length: 9 }).forEach((_, i) => {
        const a = i / 9 * TAU + t * 0.5;
        const rr = r * 0.62;
        const ox = x + Math.cos(a) * rr;
        const oy = y + Math.sin(a) * rr;
        ctx.beginPath(); ctx.arc(ox, oy, 1.7, 0, TAU); ctx.fill();
      });
    } else {
      Array.from({ length: 5 }).forEach((_, i) => {
        const a = i / 5 * TAU + t * 0.4;
        const rr = r * 0.55;
        const ox = x + Math.cos(a) * rr * 0.6;
        const oy = y + Math.sin(a) * rr * 0.6;
        ctx.fillStyle = "rgba(100,140,200,0.35)";
        ctx.beginPath(); ctx.ellipse(ox, oy, 3.2, 1.4, a, 0, TAU); ctx.fill();
      });
    }

    if (v.nucleusLobes <= 1) {
      const nx = x + Math.sin(t * 0.8) * 1.6;
      const ny = y + Math.cos(t * 0.6) * 1.6;
      const nucGrd = ctx.createRadialGradient(nx - 3, ny - 3, 0, nx, ny, r * 0.42);
      nucGrd.addColorStop(0, v.nucleusGlow);
      nucGrd.addColorStop(0.8, v.nucleusColor);
      nucGrd.addColorStop(1, "#1e2f5a");
      ctx.fillStyle = nucGrd;
      ctx.beginPath(); ctx.arc(nx, ny, r * 0.42, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(20,30,60,0.7)";
      Array.from({ length: 4 }).forEach((_, i) => {
        const a = i * 1.7 + t * 0.5;
        ctx.beginPath(); ctx.arc(nx + Math.cos(a) * r * 0.18, ny + Math.sin(a) * r * 0.18, 1.3, 0, TAU); ctx.fill();
      });
    } else {
      const lobes = v.nucleusLobes;
      Array.from({ length: lobes }).forEach((_, i) => {
        const a = i / lobes * TAU + t * 0.25;
        const lr = r * 0.20;
        const lx = x + Math.cos(a) * r * 0.22;
        const ly = y + Math.sin(a) * r * 0.22;
        const nucGrd = ctx.createRadialGradient(lx - 1.5, ly - 1.5, 0, lx, ly, lr);
        nucGrd.addColorStop(0, v.nucleusGlow);
        nucGrd.addColorStop(0.8, v.nucleusColor);
        nucGrd.addColorStop(1, "#3a2208");
        ctx.fillStyle = nucGrd;
        ctx.beginPath(); ctx.arc(lx, ly, lr, 0, TAU); ctx.fill();
      });
      ctx.strokeStyle = v.nucleusColor;
      ctx.lineWidth = 1.6;
      Array.from({ length: lobes }).forEach((_, i) => {
        const a1 = i / lobes * TAU + t * 0.25;
        const a2 = ((i + 1) % lobes) / lobes * TAU + t * 0.25;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a1) * r * 0.22, y + Math.sin(a1) * r * 0.22);
        ctx.lineTo(x + Math.cos(a2) * r * 0.22, y + Math.sin(a2) * r * 0.22);
        ctx.stroke();
      });
    }

    if (this.tri > 0)   drawPowerRing(x, y, r * 1.55, C.gold, t, this.tri);
    if (this.rapid > 0) drawPowerRing(x, y, r * 1.85, C.cyanSoft, t * 1.4, this.rapid);
    ctx.restore();
  }
}
function drawPowerRing(x, y, r, color, t, life) {
  ctx.save();
  ctx.globalAlpha = clamp(life > 2 ? 0.7 : 0.7 * (life / 2), 0.15, 0.7);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.shadowBlur = 8; ctx.shadowColor = color;
  ctx.setLineDash([6, 6]);
  ctx.lineDashOffset = -t * 30;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.restore();
}

/* ---------- Bullets ---------- */
class Bullet {
  constructor(x, y, vx, vy, hostile = false, color = C.cyan, damage = 1, pierce = 0, shape = "antibody") {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.r = hostile ? 4 : 3.5;
    this.hostile = hostile;
    this.color = color;
    this.damage = damage;
    this.pierce = pierce;
    this.hitsLeft = pierce;
    this.hitSet = null;
    this.shape = shape;
    this.life = 3;
    this.t = 0;
    this.dead = false;
  }
  hasHit(e) { return this.hitSet != null && this.hitSet.has(e); }
  registerHit(e) {
    if (this.pierce <= 0) { this.dead = true; return; }
    if (!this.hitSet) this.hitSet = new Set();
    this.hitSet.add(e);
    this.hitsLeft--;
    if (this.hitsLeft < 0) this.dead = true;
  }
  update(dt) {
    this.t += dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
    if (this.y < -20 || this.y > H + 20 || this.x < -20 || this.x > W + 20 || this.life <= 0) this.dead = true;
    if (Math.random() < 0.6) {
      emitParticles({ x: this.x, y: this.y, n: 1, speedMin: 0, speedMax: 10, life: 0.25, size: this.hostile ? 1.4 : 1.2, color: this.color });
    }
  }
  draw() {
    ctx.save();
    ctx.shadowBlur = 14; ctx.shadowColor = this.color;
    if (this.hostile) {
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.arc(this.x, this.y - 3, this.r * 0.6, 0, TAU); ctx.fill();
    } else {
      ctx.translate(this.x, this.y);
      ctx.rotate(Math.atan2(this.vy, this.vx) + Math.PI / 2);
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2.2;
      ctx.lineCap = "round";
      if (this.shape === "granule") {
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.ellipse(0, 0, 2.4, 5.2, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.arc(0, 0, 1.4, 0, TAU); ctx.fill();
      } else if (this.shape === "perforin") {
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.beginPath(); ctx.arc(0, 0, 1.4, 0, TAU); ctx.fill();
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.2;
        ctx.globalAlpha = 0.5;
        ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(0, 10); ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(0, 6); ctx.lineTo(0, -1);
        ctx.moveTo(0, -1); ctx.lineTo(-5, -7);
        ctx.moveTo(0, -1); ctx.lineTo(5, -7);
        ctx.stroke();
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(0, 6, 1.6, 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
  }
}

/* ---------- Complement blast (manual screen-clear) ---------- */
let complementBlasts = [];
class ComplementBlast {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.r = 24;
    this.maxR = 720;
    this.lifeTime = 1.1;
    this.t = 0;
    this.dead = false;
    this.damaged = new Set();
    this.proteins = [];
    Array.from({ length: 12 }).forEach((_, i) => {
      this.proteins.push({ angle: i / 12 * TAU + rand(-0.1, 0.1), spin: rand(-0.6, 0.6) });
    });
  }
  update(dt) {
    this.t += dt;
    const k = clamp(this.t / 0.75, 0, 1);
    this.r = lerp(24, this.maxR, 1 - Math.pow(1 - k, 3));
    if (this.t >= this.lifeTime) this.dead = true;

    const band = 36;
    enemies.forEach(e => {
      if (e.dead || this.damaged.has(e)) return;
      const d = Math.sqrt(dist2(this.x, this.y, e.x, e.y));
      if (d > this.r - band && d < this.r + band) {
        if (e.kind === ENEMY_KIND.BOSS) {
          Array.from({ length: 4 }).forEach(() => e.hit());
        } else {
          Array.from({ length: e.hp }).forEach(() => e.hit());
        }
        this.damaged.add(e);
      }
    });
    bullets.forEach(b => {
      if (!b.hostile || b.dead) return;
      const d = Math.sqrt(dist2(this.x, this.y, b.x, b.y));
      if (d > this.r - band && d < this.r + band) {
        b.dead = true;
        emitParticles({ x: b.x, y: b.y, n: 3, speedMin: 30, speedMax: 100, life: 0.3, size: 1.4, color: C.gold });
      }
    });
  }
  draw() {
    const a = 1 - this.t / this.lifeTime;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalAlpha = a * 0.95;
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 4;
    ctx.shadowBlur = 28; ctx.shadowColor = C.gold;
    ctx.beginPath(); ctx.arc(0, 0, this.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = a * 0.5;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, this.r - 18, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, this.r + 18, 0, TAU); ctx.stroke();
    ctx.globalAlpha = a;
    this.proteins.forEach(p => {
      const ang = p.angle + this.t * p.spin * 2;
      const px = Math.cos(ang) * this.r;
      const py = Math.sin(ang) * this.r;
      ctx.fillStyle = C.goldSoft;
      ctx.beginPath(); ctx.arc(px, py, 5, 0, TAU); ctx.fill();
      ctx.fillStyle = C.gold;
      ctx.beginPath(); ctx.arc(px, py, 2.6, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(40,20,0,0.6)";
      ctx.beginPath(); ctx.arc(px, py, 0.9, 0, TAU); ctx.fill();
    });
    ctx.restore();
  }
}

/* ---------- Enemies ---------- */
const ENEMY_KIND = { VIRUS: "virus", BACTERIUM: "bacterium", SPIKE: "spike", BOSS: "boss" };

class Enemy {
  constructor(kind, gx, gy) {
    this.kind = kind;
    this.gx = gx; this.gy = gy;
    this.x = 0; this.y = 0;
    this.targetX = 0; this.targetY = 0;
    this.dead = false;
    this.flash = 0;
    this.t = rand(0, TAU);
    this.fireT = rand(2, 7);
    this.summoned = false;
    this.controller = null;
    switch (kind) {
      case ENEMY_KIND.VIRUS:     this.hp = 1; this.r = 18; this.score = 20; this.color = C.red; break;
      case ENEMY_KIND.BACTERIUM: this.hp = 2; this.r = 22; this.score = 40; this.color = C.green; break;
      case ENEMY_KIND.SPIKE:     this.hp = 3; this.r = 22; this.score = 70; this.color = C.amber; break;
      case ENEMY_KIND.BOSS:      this.hp = 60; this.r = 90; this.score = 1000; this.color = C.magenta; break;
    }
    this.maxHp = this.hp;
  }
  hit() {
    this.hp--;
    this.flash = 0.18;
    Audio.hit();
    emitParticles({ x: this.x, y: this.y, n: 6, speedMin: 60, speedMax: 180, life: 0.4, size: 2, color: this.color });
    if (this.hp <= 0) this.kill();
  }
  kill() {
    if (this.dead) return;
    this.dead = true;
    Audio.lyse();
    Array.from({ length: 28 }).forEach((_, i) => {
      emitParticles({ x: this.x, y: this.y, n: 1, speedMin: 60, speedMax: 260, life: rand(0.45, 0.9), size: rand(1.5, 3.2), color: i % 3 === 0 ? this.color : "#ffd9d9", shape: i % 5 === 0 ? "frag" : "dot" });
    });
    shake(this.kind === ENEMY_KIND.BOSS ? 22 : 5, this.kind === ENEMY_KIND.BOSS ? 0.6 : 0.15);
    const dropChance = this.kind === ENEMY_KIND.BOSS ? 1.0
                     : this.kind === ENEMY_KIND.SPIKE ? 0.18
                     : this.kind === ENEMY_KIND.BACTERIUM ? 0.08
                     : 0.04;
    if (Math.random() < dropChance) {
      const kinds = ["tri","rapid","life","storm"];
      const weights = this.kind === ENEMY_KIND.BOSS ? [0.4, 0.4, 0.1, 0.1] : [0.4, 0.35, 0.05, 0.2];
      let r = Math.random(), acc = 0, pick = kinds[0];
      kinds.some((k, idx) => {
        acc += weights[idx];
        if (r <= acc) { pick = k; return true; }
        return false;
      });
      powerups.push(new PowerUp(this.x, this.y, pick));
    }
  }
  update(dt) {
    this.t += dt;
    if (this.flash > 0) this.flash -= dt;

    if (this.kind === ENEMY_KIND.BOSS) {
      if (!this.controller) this.controller = new BossController(this);
      this.controller.update(dt);
    }

    this.x = lerp(this.x, this.targetX, 1 - Math.pow(0.0001, dt));
    this.y = lerp(this.y, this.targetY, 1 - Math.pow(0.0001, dt));

    if (this.kind !== ENEMY_KIND.BOSS) {
      this.fireT -= dt;
      if (this.fireT <= 0) {
        this.fireT = rand(3.5, 9) * (1 / (1 + game.level * 0.08));
        if (Math.random() < game.enemyFireProb) this.shoot();
      }
    }
  }
  shoot() {
    const speed = 220 + game.level * 8;
    const color = this.kind === ENEMY_KIND.BACTERIUM ? C.green
                : this.kind === ENEMY_KIND.SPIKE ? C.amber
                : C.red;
    bullets.push(new Bullet(this.x, this.y + this.r * 0.6, 0, speed, true, color));
  }
  draw() {
    const x = this.x, y = this.y;
    ctx.save();
    if (this.flash > 0) {
      ctx.shadowBlur = 24; ctx.shadowColor = "#fff";
      ctx.globalCompositeOperation = "lighter";
    } else {
      ctx.shadowBlur = 14; ctx.shadowColor = this.color;
    }
    switch (this.kind) {
      case ENEMY_KIND.VIRUS:     drawVirus(x, y, this.r, this.color, this.t); break;
      case ENEMY_KIND.BACTERIUM: drawBacterium(x, y, this.r, this.color, this.t); break;
      case ENEMY_KIND.SPIKE:     drawSpikeVirus(x, y, this.r, this.color, this.t); break;
      case ENEMY_KIND.BOSS:      drawBoss(x, y, this.r, this.color, this.t, this.hp / this.maxHp, this.controller); break;
    }
    ctx.restore();
  }
}

function drawVirus(x, y, r, color, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.sin(t * 0.4) * 0.1);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.6;
  ctx.lineCap = "round";
  Array.from({ length: 8 }).forEach((_, i) => {
    const a = (i / 8) * TAU + t * 0.2;
    const r1 = r * 0.85, r2 = r * 1.25 + Math.sin(t * 2 + i) * 1.2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
    ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(Math.cos(a) * r2, Math.sin(a) * r2, 1.6, 0, TAU); ctx.fill();
  });
  ctx.beginPath();
  Array.from({ length: 6 }).forEach((_, i) => {
    const a = (i / 6) * TAU + Math.PI / 6;
    const px = Math.cos(a) * r * 0.85;
    const py = Math.sin(a) * r * 0.85;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.closePath();
  const grd = ctx.createRadialGradient(-r*0.3, -r*0.3, 0, 0, 0, r);
  grd.addColorStop(0, "#ffb0c4"); grd.addColorStop(0.5, color); grd.addColorStop(1, "#5a0c1f");
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 0.8;
  Array.from({ length: 6 }).forEach((_, i) => {
    const a = (i / 6) * TAU + Math.PI / 6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * r * 0.85, Math.sin(a) * r * 0.85); ctx.stroke();
  });
  ctx.fillStyle = "rgba(255,220,230,0.85)";
  ctx.beginPath(); ctx.arc(Math.sin(t*2)*r*0.15, Math.cos(t*1.6)*r*0.12, r*0.18, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawBacterium(x, y, r, color, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.sin(t * 0.6) * 0.15);
  ctx.strokeStyle = color;
  ctx.globalAlpha = 0.75;
  ctx.lineWidth = 1.4;
  [-1, 0, 1].forEach(f => {
    ctx.beginPath();
    ctx.moveTo(-r * 0.9, f * 4);
    Array.from({ length: 19 }).forEach((_, i) => {
      const px = -r * 0.9 - i * 2.2;
      const py = f * 4 + Math.sin(i * 0.5 + t * 4 + f) * 4;
      ctx.lineTo(px, py);
    });
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.ellipse(0, 0, r * 1.1, r * 0.65, 0, 0, TAU);
  const grd = ctx.createRadialGradient(-r*0.3, -r*0.3, 0, 0, 0, r);
  grd.addColorStop(0, "#d8ff9d"); grd.addColorStop(0.5, color); grd.addColorStop(1, "#2c5a17");
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = "rgba(20,40,10,0.6)";
  Array.from({ length: 3 }).forEach((_, i) => {
    const a = i / 3 * TAU + t * 0.3;
    ctx.beginPath(); ctx.ellipse(Math.cos(a) * r * 0.45, Math.sin(a) * r * 0.25, 3.5, 1.8, a, 0, TAU); ctx.fill();
  });
  ctx.strokeStyle = "rgba(126,255,90,0.5)"; ctx.lineWidth = 0.8;
  Array.from({ length: 6 }).forEach((_, i) => {
    const a = (i / 6) * TAU;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 1.05, Math.sin(a) * r * 0.6);
    ctx.lineTo(Math.cos(a) * r * 1.35, Math.sin(a) * r * 0.85);
    ctx.stroke();
  });
  ctx.restore();
}

function drawSpikeVirus(x, y, r, color, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(t * 0.5);
  const spikes = 14;
  Array.from({ length: spikes }).forEach((_, i) => {
    const a = (i / spikes) * TAU;
    const sl = r * 0.6 + Math.sin(t * 2 + i) * 1.5;
    ctx.save();
    ctx.rotate(a);
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -r * 0.7); ctx.lineTo(0, -(r * 0.7 + sl)); ctx.stroke();
    ctx.fillStyle = "#fff1c2";
    ctx.beginPath(); ctx.arc(0, -(r * 0.7 + sl) - 2, 3.4, 0, TAU); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(0, -(r * 0.7 + sl) - 2, 2, 0, TAU); ctx.fill();
    ctx.restore();
  });
  ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, TAU);
  const grd = ctx.createRadialGradient(-r*0.25, -r*0.3, 0, 0, 0, r * 0.72);
  grd.addColorStop(0, "#ffd8a8"); grd.addColorStop(0.5, color); grd.addColorStop(1, "#5a2207");
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  Array.from({ length: 6 }).forEach((_, i) => {
    const a = i * 1.04 + t * 0.4;
    ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.3, Math.sin(a) * r * 0.3, r * 0.07, 0, TAU); ctx.fill();
  });
  ctx.restore();
}

function drawBoss(x, y, r, color, t, hpFrac, controller) {
  ctx.save();
  ctx.translate(x, y);

  let charging = controller && (controller.state === BOSS_STATE.CHARGE_UP);
  let chargeFrac = charging ? clamp(controller.stateT / controller.nextStateT, 0, 1) : 0;

  const halo = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 1.8);
  halo.addColorStop(0, charging ? "rgba(255, 209, 102, 0.55)" : "rgba(217,70,239,0.4)");
  halo.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.8 + chargeFrac * 30, 0, TAU); ctx.fill();

  ctx.strokeStyle = charging ? C.gold : color;
  ctx.globalAlpha = 0.6;
  ctx.lineWidth = 2;
  Array.from({ length: 8 }).forEach((_, i) => {
    const a = (i / 8) * TAU + t * 0.2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.9, Math.sin(a) * r * 0.9);
    ctx.bezierCurveTo(
      Math.cos(a) * r * 1.2 + Math.sin(t*3+i) * 8, Math.sin(a) * r * 1.2 + Math.cos(t*2+i) * 8,
      Math.cos(a) * r * 1.6 + Math.sin(t*2+i) * 10, Math.sin(a) * r * 1.6 + Math.cos(t*1.5+i) * 10,
      Math.cos(a) * r * 1.9, Math.sin(a) * r * 1.9
    );
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  ctx.beginPath();
  const pts = 36;
  Array.from({ length: pts + 1 }).forEach((_, i) => {
    const a = (i / pts) * TAU;
    const wob = Math.sin(a * 3 + t * 1.2) * 8 + Math.sin(a * 7 - t * 0.7) * 4;
    const rr = r + wob + (charging ? Math.sin(t * 18) * 3 * chargeFrac : 0);
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.closePath();
  const grd = ctx.createRadialGradient(-r*0.4, -r*0.4, 0, 0, 0, r);
  grd.addColorStop(0, "#ffb0fc"); grd.addColorStop(0.5, color); grd.addColorStop(1, "#3a0846");
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1.4; ctx.stroke();

  Array.from({ length: 4 }).forEach((_, i) => {
    const a = i * Math.PI / 2 + t * 0.15;
    const nx = Math.cos(a) * r * 0.35, ny = Math.sin(a) * r * 0.35;
    const nucGrd = ctx.createRadialGradient(nx - 4, ny - 4, 0, nx, ny, r * 0.22);
    nucGrd.addColorStop(0, "#fff");
    nucGrd.addColorStop(0.7, "#a04bd0");
    nucGrd.addColorStop(1, "#2a0a3a");
    ctx.fillStyle = nucGrd;
    ctx.beginPath(); ctx.arc(nx, ny, r * 0.22, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.beginPath(); ctx.arc(nx + 2, ny - 1, r * 0.05, 0, TAU); ctx.fill();
  });
  const eye = ctx.createRadialGradient(0, 0, 1, 0, 0, r * 0.18);
  eye.addColorStop(0, "#ffe7ff"); eye.addColorStop(0.5, charging ? C.gold : "#d946ef"); eye.addColorStop(1, "#1f0029");
  ctx.fillStyle = eye;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.18, 0, TAU); ctx.fill();

  ctx.restore();

  const bw = 200, bh = 6;
  ctx.save();
  ctx.translate(x - bw/2, y - r - 36);
  ctx.fillStyle = "rgba(20,8,30,0.85)";
  ctx.fillRect(-2, -2, bw + 4, bh + 4);
  ctx.fillStyle = "rgba(80,40,100,0.7)";
  ctx.fillRect(0, 0, bw, bh);
  ctx.fillStyle = C.magenta;
  ctx.shadowBlur = 8; ctx.shadowColor = C.magenta;
  ctx.fillRect(0, 0, bw * hpFrac, bh);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillRect(bw / 3 - 0.5, -3, 1, bh + 6);
  ctx.fillRect(bw * 2 / 3 - 0.5, -3, 1, bh + 6);
  ctx.fillStyle = C.white;
  ctx.font = "bold 10px ui-monospace";
  ctx.textAlign = "left";
  ctx.fillText("MUTAGEN CELL", 0, -8);
  ctx.textAlign = "right";
  const label = controller ? bossStateLabel(controller.state) : "";
  ctx.fillStyle = charging ? C.gold : "rgba(232,239,255,0.6)";
  ctx.fillText(label, bw, -8);
  ctx.restore();
}

function bossStateLabel(s) {
  switch (s) {
    case BOSS_STATE.ENTRY:         return "BREACH";
    case BOSS_STATE.DRIFT:         return "PATROL";
    case BOSS_STATE.CHARGE_UP:     return "CHARGING";
    case BOSS_STATE.RADIAL_BURST:  return "BURST";
    case BOSS_STATE.SWEEP_BEAM:    return "SWEEPING";
    case BOSS_STATE.SUMMON:        return "SUMMONING";
    case BOSS_STATE.CHARGE_ATTACK: return "PURSUING";
    default: return "";
  }
}

/* ---------- Boss attack-pattern state machine ---------- */
const BOSS_STATE = {
  ENTRY: "ENTRY",
  DRIFT: "DRIFT",
  CHARGE_UP: "CHARGE_UP",
  RADIAL_BURST: "RADIAL_BURST",
  SWEEP_BEAM: "SWEEP_BEAM",
  SUMMON: "SUMMON",
  CHARGE_ATTACK: "CHARGE_ATTACK",
};

class BossController {
  constructor(boss) {
    this.boss = boss;
    this.state = BOSS_STATE.ENTRY;
    this.stateT = 0;
    this.nextStateT = 1.5;
    this.bobT = rand(0, TAU);
    this.sweepDir = 1;
    this.sweepX = W / 2;
    this.lastSweepFireT = -1;
    this.aimX = W / 2;
    this.driftFireT = 0;
    this.previousAttack = null;
  }
  phase() {
    const f = this.boss.hp / this.boss.maxHp;
    if (f > 0.66) return 1;
    if (f > 0.33) return 2;
    return 3;
  }
  update(dt) {
    this.stateT += dt;
    this.bobT += dt;
    const b = this.boss;
    const phase = this.phase();

    switch (this.state) {
      case BOSS_STATE.ENTRY:
        b.targetX = W / 2;
        b.targetY = 180;
        break;
      case BOSS_STATE.DRIFT:
        b.targetX = W/2 + Math.sin(this.bobT * 0.7) * (W * 0.32);
        b.targetY = 180 + Math.sin(this.bobT * 0.5) * 24;
        this.driftFireT -= dt;
        if (this.driftFireT <= 0) {
          this.driftFireT = phase === 3 ? 0.6 : phase === 2 ? 0.9 : 1.3;
          const sp = 240 + game.level * 6;
          [-1, 0, 1].forEach(i => {
            const a = Math.PI / 2 + i * 0.18;
            bullets.push(new Bullet(b.x + i * 18, b.y + b.r * 0.5, Math.cos(a) * sp, Math.sin(a) * sp, true, C.magenta));
          });
        }
        break;
      case BOSS_STATE.CHARGE_UP:
        if (Math.random() < 0.7) {
          emitParticles({
            x: b.x + rand(-b.r * 0.7, b.r * 0.7),
            y: b.y + rand(-b.r * 0.7, b.r * 0.7),
            n: 1, speedMin: 0, speedMax: 30, life: 0.5, size: 2.4, color: C.gold,
          });
        }
        break;
      case BOSS_STATE.RADIAL_BURST:
        break;
      case BOSS_STATE.SWEEP_BEAM: {
        this.sweepX += this.sweepDir * 240 * dt;
        if (this.sweepX > W - 120) this.sweepDir = -1;
        if (this.sweepX < 120) this.sweepDir = 1;
        b.targetX = this.sweepX;
        b.targetY = 200;
        if (this.stateT - this.lastSweepFireT > 0.10) {
          this.lastSweepFireT = this.stateT;
          const sp = 320;
          [-1, 0, 1].forEach(i => {
            const a = Math.PI / 2 + i * 0.12;
            bullets.push(new Bullet(b.x + i * 8, b.y + b.r * 0.6, Math.cos(a) * sp, Math.sin(a) * sp, true, C.magenta));
          });
        }
        break;
      }
      case BOSS_STATE.SUMMON:
        b.targetX = W / 2;
        b.targetY = 200;
        break;
      case BOSS_STATE.CHARGE_ATTACK: {
        if (player && !player.dead) this.aimX = lerp(this.aimX, player.x, 0.06);
        b.targetX = this.aimX;
        b.targetY = lerp(b.targetY, 360, 0.05);
        if (Math.random() < 0.3) {
          bullets.push(new Bullet(b.x + rand(-b.r * 0.5, b.r * 0.5), b.y + b.r, rand(-40, 40), 280, true, C.magenta));
        }
        break;
      }
    }

    if (this.stateT >= this.nextStateT) this.chooseNext();
  }
  enter(state) {
    this.state = state;
    this.stateT = 0;
    const phase = this.phase();
    const b = this.boss;
    switch (state) {
      case BOSS_STATE.DRIFT:
        this.nextStateT = phase === 3 ? rand(1.8, 2.8) : phase === 2 ? rand(2.2, 3.4) : rand(3.0, 4.2);
        this.driftFireT = 0.6;
        break;
      case BOSS_STATE.CHARGE_UP:
        this.nextStateT = phase === 3 ? 0.8 : 1.0;
        Audio.bossWarn();
        break;
      case BOSS_STATE.RADIAL_BURST: {
        this.nextStateT = 0.6;
        const count = phase === 3 ? 28 : phase === 2 ? 22 : 16;
        const sp = 240;
        Array.from({ length: count }).forEach((_, i) => {
          const a = (i / count) * TAU + rand(-0.04, 0.04);
          bullets.push(new Bullet(b.x, b.y, Math.cos(a) * sp, Math.sin(a) * sp, true, C.magenta));
        });
        if (phase === 3) {
          const sp2 = 160;
          Array.from({ length: count }).forEach((_, i) => {
            const a = (i / count) * TAU + Math.PI / count;
            bullets.push(new Bullet(b.x, b.y, Math.cos(a) * sp2, Math.sin(a) * sp2, true, C.magenta));
          });
        }
        Audio.lyse();
        shake(10, 0.25);
        break;
      }
      case BOSS_STATE.SWEEP_BEAM:
        this.nextStateT = phase === 3 ? 3.2 : 2.6;
        this.sweepX = b.x;
        this.sweepDir = player && player.x > b.x ? 1 : -1;
        this.lastSweepFireT = -1;
        Audio.bossSweep();
        break;
      case BOSS_STATE.SUMMON: {
        this.nextStateT = 1.5;
        const num = phase === 3 ? 6 : 4;
        Array.from({ length: num }).forEach((_, i) => {
          const a = (i / num) * TAU + rand(-0.1, 0.1);
          const sx = b.x + Math.cos(a) * 110;
          const sy = b.y + Math.sin(a) * 110;
          const e = new Enemy(ENEMY_KIND.VIRUS, 0, 0);
          e.x = sx; e.y = sy;
          e.targetX = sx; e.targetY = sy + 60;
          e.summoned = true;
          enemies.push(e);
          emitParticles({ x: sx, y: sy, n: 10, speedMin: 30, speedMax: 100, life: 0.5, size: 2, color: C.magenta });
        });
        Audio.bossSummon();
        break;
      }
      case BOSS_STATE.CHARGE_ATTACK:
        this.nextStateT = 2.2;
        this.aimX = player ? player.x : W / 2;
        Audio.bossWarn();
        break;
    }
  }
  chooseNext() {
    if (this.state === BOSS_STATE.CHARGE_UP) { this.enter(BOSS_STATE.RADIAL_BURST); return; }
    if (this.state !== BOSS_STATE.DRIFT) { this.enter(BOSS_STATE.DRIFT); return; }

    const phase = this.phase();
    let attacks;
    if (phase === 1) {
      attacks = [{ s: BOSS_STATE.CHARGE_UP, w: 1.0 }];
    } else if (phase === 2) {
      attacks = [
        { s: BOSS_STATE.CHARGE_UP, w: 0.4 },
        { s: BOSS_STATE.SWEEP_BEAM, w: 0.35 },
        { s: BOSS_STATE.SUMMON, w: 0.25 },
      ];
    } else {
      attacks = [
        { s: BOSS_STATE.CHARGE_UP, w: 0.28 },
        { s: BOSS_STATE.SWEEP_BEAM, w: 0.25 },
        { s: BOSS_STATE.CHARGE_ATTACK, w: 0.27 },
        { s: BOSS_STATE.SUMMON, w: 0.2 },
      ];
    }
    if (this.previousAttack && attacks.length > 1) {
      attacks = attacks.map(a => a.s === this.previousAttack ? { s: a.s, w: a.w * 0.25 } : a);
    }
    const total = attacks.reduce((s, a) => s + a.w, 0);
    let r = Math.random() * total, pick = attacks[0].s;
    attacks.some(a => {
      r -= a.w;
      if (r <= 0) { pick = a.s; return true; }
      return false;
    });
    this.previousAttack = pick;
    this.enter(pick);
  }
}

/* ---------- Tissue Barriers ---------- */
class Barrier {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.cellW = 5; this.cellH = 5;
    this.cols = 10; this.rows = 5;
    this.grid = Array.from({length: this.rows}, (_, j) =>
      Array.from({length: this.cols}, (_, i) => {
        if (j >= 3 && i >= 3 && i <= 6) return 0;
        return 2;
      })
    );
  }
  hitTest(bx, by) {
    const localX = bx - (this.x - this.cols * this.cellW / 2);
    const localY = by - (this.y - this.rows * this.cellH / 2);
    const ci = Math.floor(localX / this.cellW);
    const ri = Math.floor(localY / this.cellH);
    if (ri < 0 || ri >= this.rows || ci < 0 || ci >= this.cols) return false;
    if (this.grid[ri][ci] > 0) {
      this.grid[ri][ci]--;
      const splash = [[-1,0],[1,0],[0,-1],[0,1]];
      splash.forEach(([dx, dy]) => {
        if (Math.random() < 0.35) {
          const r2 = ri + dy, c2 = ci + dx;
          if (r2 >= 0 && r2 < this.rows && c2 >= 0 && c2 < this.cols && this.grid[r2][c2] > 0) {
            this.grid[r2][c2]--;
          }
        }
      });
      emitParticles({ x: bx, y: by, n: 5, speedMin: 40, speedMax: 140, life: 0.3, size: 1.6, color: "#9ad6ff" });
      return true;
    }
    return false;
  }
  draw() {
    const ox = this.x - this.cols * this.cellW / 2;
    const oy = this.y - this.rows * this.cellH / 2;
    this.grid.forEach((row, j) => {
      row.forEach((v, i) => {
        if (v <= 0) return;
        ctx.fillStyle = v === 2 ? "rgba(120,200,255,0.65)" : "rgba(120,200,255,0.3)";
        ctx.fillRect(ox + i * this.cellW, oy + j * this.cellH, this.cellW - 0.5, this.cellH - 0.5);
      });
    });
  }
}

/* ---------- Power-ups ---------- */
let powerups = [];
class PowerUp {
  constructor(x, y, kind) {
    this.x = x; this.y = y; this.kind = kind;
    this.vy = 90;
    this.r = 14;
    this.t = 0;
    this.dead = false;
  }
  update(dt) {
    this.t += dt;
    this.y += this.vy * dt;
    this.x += Math.sin(this.t * 2) * 30 * dt;
    if (this.y > H + 30) this.dead = true;
  }
  apply(player) {
    Audio.powerup();
    switch (this.kind) {
      case "tri":   player.tri = Math.max(player.tri, 12); game.flashMessage("T-HELPER ACTIVE", C.gold); break;
      case "rapid": player.rapid = Math.max(player.rapid, 12); game.flashMessage("MEMORY CELL ACTIVE", C.cyanSoft); break;
      case "life":  player.lives = Math.min(player.maxLives, player.lives + 1); game.flashMessage("PLASMA CELL +1", C.green); break;
      case "storm": game.cytokineStorm(); break;
    }
  }
  color() {
    return this.kind === "tri" ? C.gold
         : this.kind === "rapid" ? C.cyanSoft
         : this.kind === "life" ? C.green
         : C.magenta;
  }
  label() {
    return this.kind === "tri" ? "T"
         : this.kind === "rapid" ? "M"
         : this.kind === "life" ? "+1"
         : "C";
  }
  draw() {
    const x = this.x, y = this.y, t = this.t;
    const col = this.color();
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t * 0.6);
    const halo = ctx.createRadialGradient(0, 0, 2, 0, 0, this.r * 2.2);
    halo.addColorStop(0, col);
    halo.addColorStop(0.4, "rgba(255,255,255,0)");
    ctx.fillStyle = halo;
    ctx.globalAlpha = 0.45;
    ctx.beginPath(); ctx.arc(0, 0, this.r * 2.2, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    Array.from({ length: 6 }).forEach((_, i) => {
      const a = (i / 6) * TAU + Math.PI / 6;
      const px = Math.cos(a) * this.r, py = Math.sin(a) * this.r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.closePath();
    ctx.fillStyle = "rgba(8,12,30,0.85)";
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.6;
    ctx.shadowBlur = 12; ctx.shadowColor = col;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.rotate(-t * 0.6);
    ctx.fillStyle = col;
    ctx.font = "bold 12px 'Outfit', sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(this.label(), 0, 1);
    ctx.restore();
  }
}

/* ---------- Game state ---------- */
let bullets = [];
let enemies = [];
let barriers = [];
let player;

const game = {
  state: "MENU",
  level: 1,
  score: 0,
  highScore: +storage.get("ip_high", "0"),
  pathogensKilled: 0,
  formation: { dx: 1, speed: 28, descend: 18 },
  fireProbBase: 0.42,
  enemyFireProb: 0.42,
  introT: 0,
  messageT: 0, messageStr: "", messageColor: C.cyan,
  t: 0,
  menuVariantIdx: 0,

  reset() {
    bullets.length = 0;
    enemies.length = 0;
    barriers.length = 0;
    powerups.length = 0;
    particles.length = 0;
    complementBlasts.length = 0;
    player = new Player(Meta.selectedVariant);
    this.level = 1;
    this.score = 0;
    this.pathogensKilled = 0;
    this.startLevel();
  },

  startLevel() {
    bullets.length = 0;
    enemies.length = 0;
    powerups.length = 0;
    complementBlasts.length = 0;
    Meta.recordStage(this.level);
    Meta.save();
    this.buildBarriers();
    this.buildFormation();
    this.formation.dx = 1;
    this.formation.speed = 28 + this.level * 4;
    this.formation.descend = 16 + this.level * 1.5;
    this.enemyFireProb = clamp(this.fireProbBase + this.level * 0.04, 0.42, 0.95);
    this.state = "LEVEL_INTRO";
    this.introT = 2.0;
    Audio.levelUp();
    if (this.isBossLevel()) Audio.bossWarn();
  },

  isBossLevel() { return this.level % 5 === 0; },

  buildBarriers() {
    const count = 4;
    const margin = 100;
    const usable = W - margin * 2;
    Array.from({ length: count }).forEach((_, i) => {
      const x = margin + (i + 0.5) * (usable / count);
      barriers.push(new Barrier(x, H - 200));
    });
  },

  buildFormation() {
    if (this.isBossLevel()) {
      const boss = new Enemy(ENEMY_KIND.BOSS, 0, 0);
      boss.x = W / 2; boss.y = -120;
      boss.targetX = W / 2; boss.targetY = 180;
      enemies.push(boss);

      const cols = 8, rows = 2;
      const xStep = 70, yStep = 56;
      const xStart = W/2 - (cols - 1) * xStep / 2;
      const yStart = 380;
      Array.from({ length: rows }).forEach((_, r) => {
        Array.from({ length: cols }).forEach((_, c) => {
          const e = new Enemy(ENEMY_KIND.VIRUS, c, r);
          e.x = xStart + c * xStep; e.y = -80 - r * 30;
          e.targetX = xStart + c * xStep; e.targetY = yStart + r * yStep;
          enemies.push(e);
        });
      });
      return;
    }
    const cols = Math.min(11, 6 + Math.floor(this.level / 2));
    const rows = 4 + Math.floor(this.level / 3);
    const xStep = 56, yStep = 50;
    const xStart = W/2 - (cols - 1) * xStep / 2;
    const yStart = 110;
    Array.from({ length: rows }).forEach((_, r) => {
      Array.from({ length: cols }).forEach((_, c) => {
        let kind = ENEMY_KIND.VIRUS;
        if (r === 0) kind = (this.level >= 3 ? ENEMY_KIND.SPIKE : ENEMY_KIND.BACTERIUM);
        else if (r === 1) kind = (this.level >= 4 ? ENEMY_KIND.SPIKE : ENEMY_KIND.BACTERIUM);
        else if (r === 2) kind = ENEMY_KIND.BACTERIUM;
        else kind = ENEMY_KIND.VIRUS;
        if (Math.random() < 0.06 * this.level && this.level >= 2) {
          const choices = [ENEMY_KIND.VIRUS, ENEMY_KIND.BACTERIUM, ENEMY_KIND.SPIKE];
          kind = choices[randi(0, choices.length)];
        }
        const e = new Enemy(kind, c, r);
        e.x = xStart + c * xStep; e.y = -40 - r * 30;
        e.targetX = xStart + c * xStep; e.targetY = yStart + r * yStep;
        enemies.push(e);
      });
    });
  },

  flashMessage(s, color = C.cyan) {
    this.messageStr = s; this.messageColor = color; this.messageT = 1.6;
  },

  cytokineStorm() {
    this.flashMessage("CYTOKINE STORM", C.magenta);
    shake(20, 0.5);
    const live = enemies.filter(e => !e.dead);
    live.forEach(e => {
      if (e.kind === ENEMY_KIND.BOSS) {
        Array.from({ length: 12 }).forEach(() => e.hit());
      } else {
        Array.from({ length: e.hp }).forEach(() => e.hit());
      }
    });
  },

  update(dt) {
    this.t += dt;
    bg.update(dt);
    updateParticles(dt);

    if (this.state === "MENU") {
      this.handleMenuInput();
      if (keyPressed.Space || keyPressed.Enter) { Audio.init(); this.reset(); this.state = "LEVEL_INTRO"; this.introT = 2.0; }
      return;
    }
    if (this.state === "GAME_OVER") {
      if (keyPressed.Space || keyPressed.Enter) { this.state = "MENU"; }
      return;
    }
    if (this.state === "WIN") {
      if (keyPressed.Space || keyPressed.Enter) { this.state = "MENU"; }
      return;
    }
    if (this.state === "PAUSED") {
      if (keyPressed.KeyP) this.state = "PLAYING";
      return;
    }
    if (this.state === "LEVEL_INTRO") {
      this.introT -= dt;
      player.update(dt * 0.6);
      if (this.introT <= 0) this.state = "PLAYING";
      return;
    }

    if (keyPressed.KeyP) { this.state = "PAUSED"; return; }
    if (this.messageT > 0) this.messageT -= dt;

    player.update(dt);
    this.stepFormation(dt);
    enemies.forEach(e => e.update(dt));

    // Cull dead enemies and award progression
    const deadEnemies = enemies.filter(e => e.dead);
    deadEnemies.forEach(e => {
      this.score += e.score;
      this.pathogensKilled++;
      player.awardKill();
      Meta.recordKill();
    });
    enemies = enemies.filter(e => !e.dead);

    bullets.forEach(b => b.update(dt));

    // Player bullets vs barriers and pathogens
    bullets.forEach(b => {
      if (b.hostile || b.dead) return;
      barriers.forEach(br => {
        if (Math.abs(b.x - br.x) < 30 && Math.abs(b.y - br.y) < 18) {
          if (br.hitTest(b.x, b.y)) { b.dead = true; }
        }
      });
      if (b.dead) return;
      enemies.forEach(e => {
        if (e.dead || b.hasHit(e) || b.dead) return;
        if (dist2(b.x, b.y, e.x, e.y) < (e.r + b.r) ** 2) {
          Array.from({ length: b.damage }).forEach(() => {
            if (!e.dead) e.hit();
          });
          b.registerHit(e);
        }
      });
    });

    // Enemy bullets vs barriers and player
    bullets.forEach(b => {
      if (!b.hostile || b.dead) return;
      barriers.forEach(br => {
        if (Math.abs(b.x - br.x) < 30 && Math.abs(b.y - br.y) < 18) {
          if (br.hitTest(b.x, b.y)) { b.dead = true; }
        }
      });
      if (b.dead) return;
      if (!player.dead && dist2(b.x, b.y, player.x, player.y) < (player.r * 0.85 + b.r) ** 2) {
        if (player.hit()) {
          b.dead = true;
          if (player.lives <= 0) this.gameOver();
        }
      }
    });

    bullets = bullets.filter(b => !b.dead);

    // Pathogen contact damage or boundary breach
    enemies.forEach(e => {
      if (!player.dead && dist2(e.x, e.y, player.x, player.y) < (e.r + player.r) ** 2) {
        if (player.hit() && player.lives <= 0) this.gameOver();
        if (e.kind !== ENEMY_KIND.BOSS) e.kill();
      }
      if (e.y - e.r > H - 60) {
        this.gameOver();
      }
    });

    // Power-up interaction
    powerups.forEach(p => {
      p.update(dt);
      if (!p.dead && !player.dead && dist2(p.x, p.y, player.x, player.y) < (p.r + player.r) ** 2) {
        p.apply(player);
        p.dead = true;
      }
    });
    powerups = powerups.filter(p => !p.dead);

    // Complement blasts
    complementBlasts.forEach(c => c.update(dt));
    complementBlasts = complementBlasts.filter(c => !c.dead);

    if (enemies.length === 0) {
      this.level++;
      if (this.level > 30) { this.state = "WIN"; Meta.save(); return; }
      this.startLevel();
    }
  },

  stepFormation(dt) {
    let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
    let nonBossCount = 0;
    enemies.forEach(e => {
      if (e.kind === ENEMY_KIND.BOSS || e.summoned) return;
      nonBossCount++;
      const lx = e.targetX, ly = e.targetY;
      if (lx - e.r < minX) minX = lx - e.r;
      if (lx + e.r > maxX) maxX = lx + e.r;
      if (ly + e.r > maxY) maxY = ly + e.r;
    });
    if (nonBossCount === 0) return;

    const total = (game.isBossLevel() ? 16 : (4 + Math.floor(game.level / 3)) * Math.min(11, 6 + Math.floor(game.level / 2)));
    const aliveFactor = 1 + (1 - nonBossCount / total) * 2.2;
    const dx = this.formation.dx * this.formation.speed * aliveFactor * dt;

    let willHitWall = false;
    if (this.formation.dx > 0 && maxX + dx > W - 24) willHitWall = true;
    if (this.formation.dx < 0 && minX + dx < 24) willHitWall = true;

    if (willHitWall) {
      this.formation.dx *= -1;
      enemies.forEach(e => {
        if (e.kind === ENEMY_KIND.BOSS || e.summoned) return;
        e.targetY += this.formation.descend;
      });
    } else {
      enemies.forEach(e => {
        if (e.kind === ENEMY_KIND.BOSS || e.summoned) return;
        e.targetX += dx;
      });
    }
  },

  handleMenuInput() {
    if (keyPressed.ArrowLeft || keyPressed.KeyA) {
      this.cycleVariant(-1);
    } else if (keyPressed.ArrowRight || keyPressed.KeyD) {
      this.cycleVariant(1);
    }
  },
  cycleVariant(dir) {
    const n = VARIANT_ORDER.length;
    let idx = VARIANT_ORDER.indexOf(Meta.selectedVariant);
    if (idx < 0) idx = 0;
    Array.from({ length: n }).some(() => {
      idx = (idx + dir + n) % n;
      const key = VARIANT_ORDER[idx];
      if (Meta.isUnlocked(key)) {
        Meta.selectedVariant = key;
        Meta.save();
        Audio.init();
        Audio.powerup();
        return true;
      }
      return false;
    });
  },

  gameOver() {
    if (this.state === "GAME_OVER") return;
    this.state = "GAME_OVER";
    Audio.gameOver();
    shake(28, 0.7);
    if (this.score > this.highScore) {
      this.highScore = this.score;
      storage.set("ip_high", this.highScore + "");
    }
    Meta.save();
  },

  draw() {
    bg.draw();
    if (this.state === "MENU") { drawMenu(); return; }
    barriers.forEach(br => br.draw());
    enemies.forEach(e => e.draw());
    powerups.forEach(p => p.draw());
    bullets.forEach(b => b.draw());
    player.draw();
    complementBlasts.forEach(c => c.draw());
    drawParticles();
    drawHUD();
    drawEKG(); // Subtle overlay bio-monitor wave at the bottom

    if (this.state === "LEVEL_INTRO") drawLevelIntro();
    if (this.state === "PAUSED") drawPause();
    if (this.state === "GAME_OVER") drawGameOver();
    if (this.state === "WIN") drawWin();
    if (this.messageT > 0) drawFlash();
  },
};

    ctx.fillText(b.label, bx + 6, by - 4);

function drawMiniCell(x, y, r, alive, variant) {
  ctx.save();
  if (alive) {
    const g = ctx.createRadialGradient(x - 2, y - 2, 0, x, y, r);
    g.addColorStop(0, variant.bodyTintInner);
    g.addColorStop(1, variant.bodyTintOuter);
    ctx.fillStyle = g;
    ctx.shadowBlur = 6; ctx.shadowColor = variant.haloColor;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = variant.nucleusColor;
    ctx.beginPath(); ctx.arc(x + 1, y + 1, r * 0.4, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = "rgba(232,239,255,0.15)";
    ctx.lineWidth = 1; ctx.setLineDash([2,2]);
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

/* ---------- EKG Live Audio Visualizer Waveform ---------- */
function drawEKG() {
  const analyser = Audio.getAnalyser();
  if (!analyser) return;

  const bufLen = analyser.frequencyBinCount;
  const data = new Uint8Array(bufLen);
  analyser.getByteTimeDomainData(data);

  ctx.save();
  ctx.strokeStyle = player.dead ? "rgba(255, 56, 104, 0.18)" : "rgba(77, 255, 230, 0.13)";
  ctx.lineWidth = 1.6;
  ctx.shadowBlur = 6;
  ctx.shadowColor = player.dead ? "#ff3868" : "#4dffe6";
  ctx.lineJoin = "round";
  ctx.beginPath();

  const startX = 60;
  const endX = W - 60;
  const width = endX - startX;
  const sliceWidth = width / bufLen;
  let x = startX;
  const centerY = H - 75;

  data.forEach((val, i) => {
    const v = val / 128.0;
    const y = centerY + (v - 1.0) * 36;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    x += sliceWidth;
  });

  ctx.stroke();
  ctx.restore();
}

/* ---------- Menu (with variant selector) ---------- */
function drawCellPreview(cx, cy, r, variant, t) {
  ctx.save();
  ctx.translate(cx, cy);
  const halo = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 2.4);
  halo.addColorStop(0, variant.haloColor);
  halo.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(0, 0, r * 2.4, 0, TAU); ctx.fill();

  ctx.beginPath();
  const points = 28;
  Array.from({ length: points + 1 }).forEach((_, i) => {
    const a = (i / points) * TAU;
    const wob = Math.sin(a * 4 + t * 1.5) * 5 + Math.sin(a * 7 - t) * 2.4;
    const podo = Math.max(0, Math.cos(a * 3 + t)) * 5;
    const rr = r + wob + podo;
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.closePath();
  const grd = ctx.createRadialGradient(-r*0.3, -r*0.3, 0, 0, 0, r);
  grd.addColorStop(0, variant.bodyTintInner); grd.addColorStop(0.55, variant.bodyTintMid); grd.addColorStop(1, variant.bodyTintOuter);
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle = "rgba(120,170,220,0.8)"; ctx.lineWidth = 1.4; ctx.stroke();

  if (variant.grains) {
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    Array.from({ length: 14 }).forEach((_, i) => {
      const a = i / 14 * TAU + t * 0.4;
      const rr = r * 0.62;
      ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 2.4, 0, TAU); ctx.fill();
    });
  }

  if (variant.nucleusLobes <= 1) {
    const nucGrd = ctx.createRadialGradient(-r*0.1, -r*0.15, 0, 0, 0, r * 0.42);
    nucGrd.addColorStop(0, variant.nucleusGlow);
    nucGrd.addColorStop(0.8, variant.nucleusColor);
    nucGrd.addColorStop(1, "#1e2f5a");
    ctx.fillStyle = nucGrd;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0, TAU); ctx.fill();
  } else {
    const lobes = variant.nucleusLobes;
    Array.from({ length: lobes }).forEach((_, i) => {
      const a = i / lobes * TAU + t * 0.25;
      const lr = r * 0.20;
      const lx = Math.cos(a) * r * 0.22;
      const ly = Math.sin(a) * r * 0.22;
      const nucGrd = ctx.createRadialGradient(lx - 1.5, ly - 1.5, 0, lx, ly, lr);
      nucGrd.addColorStop(0, variant.nucleusGlow);
      nucGrd.addColorStop(0.8, variant.nucleusColor);
      nucGrd.addColorStop(1, "#3a2208");
      ctx.fillStyle = nucGrd;
      ctx.beginPath(); ctx.arc(lx, ly, lr, 0, TAU); ctx.fill();
    });
    ctx.strokeStyle = variant.nucleusColor;
    ctx.lineWidth = 1.6;
    Array.from({ length: lobes }).forEach((_, i) => {
      const a1 = i / lobes * TAU + t * 0.25;
      const a2 = ((i + 1) % lobes) / lobes * TAU + t * 0.25;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a1) * r * 0.22, Math.sin(a1) * r * 0.22);
      ctx.lineTo(Math.cos(a2) * r * 0.22, Math.sin(a2) * r * 0.22);
      ctx.stroke();
    });
  }
  ctx.restore();
}

function drawMenu() {
  const t = game.t;
  const selected = VARIANTS[Meta.selectedVariant];

  drawCellPreview(W / 2, H * 0.32, 110, selected, t);

  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = C.cyan;
  ctx.shadowBlur = 18; ctx.shadowColor = C.cyan;
  ctx.font = "bold 64px 'Outfit', sans-serif";
  ctx.fillText("IMMUNITY", W/2, H * 0.55);
  ctx.fillText("PROTOCOL", W/2, H * 0.55 + 64);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(232,239,255,0.5)";
  ctx.font = "12px 'JetBrains Mono', monospace";
  ctx.fillText("// HOST DEFENSE SUBROUTINE v3.2", W/2, H * 0.55 + 110);
  ctx.restore();

  const sy = H * 0.74;
  const idx = VARIANT_ORDER.indexOf(Meta.selectedVariant);
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const bw = 520, bh = 86;
  const bx = W/2 - bw/2, byb = sy - bh/2;
  ctx.fillStyle = "rgba(3, 8, 22, 0.75)";
  ctx.fillRect(bx, byb, bw, bh);
  ctx.strokeStyle = "rgba(77, 255, 230, 0.35)";
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, byb + 0.5, bw - 1, bh - 1);

  const arrowBlink = (Math.floor(t * 1.8) % 2 === 0);
  ctx.fillStyle = arrowBlink ? C.cyan : "rgba(77, 255, 230, 0.45)";
  ctx.font = "bold 22px 'Outfit', sans-serif";
  ctx.fillText("‹", bx + 26, sy);
  ctx.fillText("›", bx + bw - 26, sy);

  ctx.fillStyle = C.gold;
  ctx.shadowBlur = 10; ctx.shadowColor = C.gold;
  ctx.font = "bold 22px 'Outfit', sans-serif";
  ctx.fillText(selected.name, W/2, sy - 14);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(232,239,255,0.7)";
  ctx.font = "11px 'Outfit', sans-serif";
  ctx.fillText(selected.desc, W/2, sy + 12);

  const dotY = sy + 32;
  const startX = W/2 - (VARIANT_ORDER.length - 1) * 14 / 2;
  VARIANT_ORDER.forEach((k, i) => {
    const unlocked = Meta.isUnlocked(k);
    ctx.fillStyle = i === idx
      ? C.cyan
      : unlocked ? "rgba(232,239,255,0.5)" : "rgba(232,239,255,0.2)";
    ctx.beginPath(); ctx.arc(startX + i * 14, dotY, 3, 0, TAU); ctx.fill();
  });

  const locked = VARIANT_ORDER.filter(k => !Meta.isUnlocked(k));
  if (locked.length) {
    ctx.font = "10px 'JetBrains Mono', monospace";
    ctx.fillStyle = "rgba(232,239,255,0.4)";
    const nextLock = locked
      .map(k => VARIANTS[k])
      .sort((a, b) => a.unlockKills - b.unlockKills)[0];
    if (nextLock) {
      const remaining = Math.max(0, nextLock.unlockKills - Meta.totalKills);
      ctx.fillText("NEXT: " + nextLock.name + " — " + remaining + " more pathogens to neutralize", W/2, byb + bh + 18);
    }
  }
  ctx.restore();

  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const blink = (Math.floor(t * 1.6) % 2 === 0);
  ctx.font = "bold 16px 'Outfit', sans-serif";
  ctx.fillStyle = blink ? C.white : "rgba(232,239,255,0.35)";
  ctx.fillText("PRESS SPACE TO INITIATE", W/2, H * 0.86);

  ctx.font = "11px 'JetBrains Mono', monospace";
  ctx.fillStyle = "rgba(232,239,255,0.45)";
  ctx.fillText("← →  cycle lineage   /   SPACE  start", W/2, H * 0.90);
  ctx.fillText("in mission:   A D move   SPACE fire   SHIFT complement   P pause   M mute", W/2, H * 0.90 + 16);

  ctx.fillStyle = "rgba(232,239,255,0.4)";
  ctx.font = "10px 'JetBrains Mono', monospace";
  ctx.fillText("TOTAL NEUTRALIZED · " + Meta.totalKills + "      PEAK STAGE · " + String(Meta.peakStage).padStart(2, "0"), W/2, H - 28);
  ctx.restore();
}

function drawPause() {
  ctx.save();
  ctx.fillStyle = "rgba(3,8,22,0.7)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = C.cyan;
  ctx.shadowBlur = 14; ctx.shadowColor = C.cyan;
  ctx.font = "bold 48px 'Outfit', sans-serif";
  ctx.fillText("// PAUSED", W/2, H/2 - 10);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(232,239,255,0.55)";
  ctx.font = "12px 'JetBrains Mono', monospace";
  ctx.fillText("PRESS P TO RESUME", W/2, H/2 + 40);
  ctx.restore();
}

function drawGameOver() {
  ctx.save();
  ctx.fillStyle = "rgba(3,8,22,0.78)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = C.red;
  ctx.shadowBlur = 18; ctx.shadowColor = C.red;
  ctx.font = "bold 56px 'Outfit', sans-serif";
  ctx.fillText("HOST COMPROMISED", W/2, H/2 - 90);
  ctx.shadowBlur = 0;

  ctx.fillStyle = "rgba(232,239,255,0.85)";
  ctx.font = "16px 'Outfit', sans-serif";
  ctx.fillText("immune response insufficient — pathogen load critical", W/2, H/2 - 45);

  ctx.font = "bold 14px 'JetBrains Mono', monospace";
  ctx.textAlign = "left";
  const sx = W/2 - 160, sy = H/2 - 5;
  ctx.fillStyle = "rgba(232,239,255,0.45)";
  ctx.fillText("FINAL SCORE", sx, sy);
  ctx.fillText("STAGE REACHED", sx, sy + 28);
  ctx.fillText("RUN NEUTRALIZED", sx, sy + 56);
  ctx.fillText("LIFETIME NEUTRALIZED", sx, sy + 84);
  ctx.fillText("PERSONAL BEST", sx, sy + 112);
  ctx.textAlign = "right";
  ctx.fillStyle = C.cyan;
  ctx.shadowBlur = 6; ctx.shadowColor = C.cyan;
  ctx.fillText(String(game.score), sx + 320, sy);
  ctx.fillText(String(game.level).padStart(2, "0"), sx + 320, sy + 28);
  ctx.fillText(String(game.pathogensKilled), sx + 320, sy + 56);
  ctx.fillStyle = C.green;
  ctx.shadowColor = C.green;
  ctx.fillText(String(Meta.totalKills), sx + 320, sy + 84);
  ctx.fillStyle = C.gold;
  ctx.shadowColor = C.gold;
  ctx.fillText(String(game.highScore), sx + 320, sy + 112);
  ctx.shadowBlur = 0;

  const blink = (Math.floor(game.t * 1.6) % 2 === 0);
  ctx.textAlign = "center";
  ctx.font = "bold 14px 'Outfit', sans-serif";
  ctx.fillStyle = blink ? C.white : "rgba(232,239,255,0.35)";
  ctx.fillText("PRESS SPACE TO RETURN TO LINEAGE SELECT", W/2, H/2 + 180);
  ctx.restore();
}

function drawWin() {
  ctx.save();
  ctx.fillStyle = "rgba(3,8,22,0.78)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = C.green;
  ctx.shadowBlur = 18; ctx.shadowColor = C.green;
  ctx.font = "bold 56px 'Outfit', sans-serif";
  ctx.fillText("INFECTION CLEARED", W/2, H/2 - 40);
  ctx.shadowBlur = 0;
  ctx.fillStyle = C.white;
  ctx.font = "14px 'Outfit', sans-serif";
  ctx.fillText("the host immune memory has been encoded.", W/2, H/2 + 10);
  ctx.fillStyle = C.cyan;
  ctx.font = "bold 16px 'Outfit', sans-serif";
  ctx.fillText("FINAL SCORE: " + game.score, W/2, H/2 + 50);
  ctx.fillStyle = "rgba(232,239,255,0.5)";
  ctx.font = "12px 'JetBrains Mono', monospace";
  ctx.fillText("press SPACE to return", W/2, H/2 + 100);
  ctx.restore();
}

function drawFlash() {
  ctx.save();
  const a = clamp(game.messageT / 1.6, 0, 1);
  ctx.globalAlpha = a;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = game.messageColor;
  ctx.shadowBlur = 16; ctx.shadowColor = game.messageColor;
  ctx.font = "bold 28px 'Outfit', sans-serif";
  ctx.fillText(game.messageStr, W/2, H/2 - 160);
  ctx.restore();
}

/* ---------- Main loop ---------- */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  if (dt > 0.05) dt = 0.05;
  last = now;

  if (keyPressed.KeyM) { const m = Audio.toggle(); game.flashMessage(m ? "AUDIO MUTED" : "AUDIO ON", C.cyan); }

  let sx = 0, sy = 0;
  if (shakeT > 0) {
    shakeT -= dt;
    const k = Math.max(0, shakeT / 0.7);
    sx = (Math.random() * 2 - 1) * shakeMag * k;
    sy = (Math.random() * 2 - 1) * shakeMag * k;
    if (shakeT <= 0) shakeMag = 0;
  }

  ctx.save();
  ctx.setTransform(1, 0, 0, 1, sx, sy);
  game.update(dt);
  game.draw();
  ctx.restore();

  Object.keys(keyPressed).forEach(k => keyPressed[k] = false);

  requestAnimationFrame(frame);
}

/* ---------- Boot ---------- */
Meta.load();
bg.init();
player = new Player(Meta.selectedVariant);
requestAnimationFrame((t) => { last = t; frame(t); });
</script>
