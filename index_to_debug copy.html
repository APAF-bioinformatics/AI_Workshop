                this.ctx.fillStyle = '#ffd700';
                this.ctx.fillText(`CURRENT HIGH SCORE: ${this.highScore.toLocaleString()} PTS`, CANVAS_WIDTH / 2, 135);

                // Draw Difficulty choice
                this.ctx.font = '800 13px Orbitron';
                this.ctx.fillStyle = '#8b9bb4';
                this.ctx.fillText('DIFFICULTY SYSTEM:', CANVAS_WIDTH / 2, 160);

                const diffs = ['EASY', 'NORMAL', 'HARD'];
                const dWidth = 110;
                const dHeight = 35;
                const dSpacing = 135;
                const dStartX = (CANVAS_WIDTH - (3 * dWidth + 2 * 25)) / 2;

                diffs.forEach((diff, idx) => {
                    const dx = dStartX + idx * dSpacing;
                    const dy = 180;
                    const isSelected = this.selectedDiff === diff;
                    const config = DIFF_CONFIGS[diff];

                    this.ctx.save();
                    this.ctx.fillStyle = isSelected ? config.color : 'rgba(10, 10, 25, 0.8)';
                    this.ctx.strokeStyle = config.color;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.roundRect(dx, dy, dWidth, dHeight, 6);
                    this.ctx.fill();
                    this.ctx.stroke();

                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillStyle = isSelected ? '#000000' : '#ffffff';
                    this.ctx.font = '800 12px Orbitron';
                    this.ctx.fillText(diff, dx + dWidth / 2, dy + dHeight / 2);
                    this.ctx.restore();

                    this.registerRegion(dx, dy, dWidth, dHeight, () => {
                        this.selectedDiff = diff;
                        audio.hit();
                    });
                });

                // Lineage cards list layout
                const cardWidth = 240;
                const cardHeight = 360;
                const cardSpacing = 270;
                const startX = (CANVAS_WIDTH - (3 * cardWidth + 2 * 30)) / 2;
                const cardY = 280;

                const unlockThresholds = {
                    'MACROPHAGE': 0,
                    'NATURAL_KILLER': 5000,
                    'NEUTROPHIL': 15000
                };

                LINEAGES.forEach((lin, idx) => {
                    const cx = startX + idx * cardSpacing;
                    const cy = cardY;
                    const isSelected = this.selectedLineageIndex === idx;
                    const isLocked = this.highScore < (unlockThresholds[lin.id] || 0);

                    this.ctx.save();
                    this.ctx.fillStyle = 'rgba(10, 10, 30, 0.85)';
                    this.ctx.strokeStyle = isSelected ? lin.color : 'rgba(255, 255, 255, 0.1)';
                    this.ctx.lineWidth = isSelected ? 3 : 1.5;
                    
                    if (isSelected) {
                        this.ctx.shadowBlur = 15;
                        this.ctx.shadowColor = lin.color;
                    }
                    
                    this.ctx.beginPath();
                    this.ctx.roundRect(cx, cy, cardWidth, cardHeight, 10);
                    this.ctx.fill();
                    this.ctx.stroke();
                    this.ctx.shadowBlur = 0;

                    // If locked, fade the cell drawing
                    if (isLocked) {
                        this.ctx.globalAlpha = 0.35;
                    }

                    // Draw Nucleus visualization
                    const mockPulse = performance.now() / 250;
                    lin.drawNucleus(this.ctx, cx + cardWidth/2, cy + 90, 48, mockPulse);

                    // Outer shell
                    this.ctx.strokeStyle = lin.color;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.arc(cx + cardWidth/2, cy + 90, 48, 0, Math.PI * 2);
                    this.ctx.stroke();

                    // Lineage Name
                    this.ctx.textAlign = 'center';
                    this.ctx.fillStyle = lin.color;
                    this.ctx.font = '900 16px Orbitron';
                    this.ctx.fillText(lin.name, cx + cardWidth / 2, cy + 180);

                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = '600 11px Outfit';
                    this.ctx.fillText(lin.subname, cx + cardWidth / 2, cy + 200);

                    // Stats lines
                    this.ctx.textAlign = 'left';
                    this.ctx.fillStyle = '#8b9bb4';
                    this.ctx.font = '600 11px Outfit';
                    
                    const drawStatLine = (label, value, yOffset) => {
                        this.ctx.fillStyle = '#8b9bb4';
                        this.ctx.fillText(label, cx + 30, cy + yOffset);
                        this.ctx.fillStyle = '#ffffff';
                        this.ctx.fillText(value, cx + 160, cy + yOffset);
                    };

                    drawStatLine('MAX INTEGRITY:', lin.maxLives + ' HP', 235);
                    drawStatLine('SPEED:', lin.speed + ' px/s', 255);
                    const fireRateText = lin.id === 'NATURAL_KILLER' ? '3 bullets / 0.3s' : (lin.id === 'NEUTROPHIL' ? '1 bullet / 0.23s' : '1 bullet / 0.28s');
                    drawStatLine('FIRE RATE:', fireRateText, 275);
                    
                    this.ctx.textAlign = 'center';
                    this.ctx.fillStyle = '#ffd700';
                    this.ctx.font = '700 10px Orbitron';
                    this.ctx.fillText(lin.id === 'NATURAL_KILLER' ? 'PIERCING WEAPON' : (lin.id === 'NEUTROPHIL' ? 'RAPID SPEED' : 'BALANCED ANTIBODIES'), cx + cardWidth/2, cy + 305);

                    // Restore globalAlpha so the locked banner draws cleanly
                    this.ctx.globalAlpha = 1.0;

                    if (isLocked) {
                        // Draw locking overlay
                        this.ctx.fillStyle = 'rgba(10, 10, 25, 0.7)';
                        this.ctx.beginPath();
                        this.ctx.roundRect(cx + 15, cy + 60, cardWidth - 30, 110, 6);
                        this.ctx.fill();

                        this.ctx.fillStyle = '#ff3333';
                        this.ctx.font = '900 14px Orbitron';
                        this.ctx.fillText('🔒 LOCKED', cx + cardWidth/2, cy + 105);
                        this.ctx.fillStyle = '#ffffff';
                        this.ctx.font = '800 10px Orbitron';
                        this.ctx.fillText(`${unlockThresholds[lin.id].toLocaleString()} PTS REQ`, cx + cardWidth/2, cy + 130);
                    }

                    // Interactive click select regions
                    this.registerRegion(cx, cy, cardWidth, cardHeight, () => {
                        if (!isLocked) {
                            this.selectedLineageIndex = idx;
                            audio.hit();
                        } else {
                            // play a error-feedback sound (low rumble hit)
                            audio.playerHit();
                        }
                    });

                    this.ctx.restore();
                });

                // Start button bottom
                const btnX = (CANVAS_WIDTH - 250) / 2;
                const btnY = 700;
                this.drawNeonButton(btnX, btnY, 250, 50, 'DEPLOY CELL', '#ffd700', () => {
                    this.startNewGame();
                });
            }

                this.ctx.save();
                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = '#ffd700';
                this.ctx.font = '800 14px Orbitron';
                this.ctx.fillText('TOP 5 DEFENDER BENCHMARKS', cx, cy);

                const tableY = cy + 25;
                const rowH = 24;

                this.ctx.fillStyle = 'rgba(10, 10, 25, 0.7)';
                this.ctx.strokeStyle = 'rgba(255, 215, 0, 0.2)';
                this.ctx.lineWidth = 1.5;
                this.ctx.beginPath();
                this.ctx.roundRect(cx - 250, tableY, 500, rowH * 6 + 10, 6);
                this.ctx.fill();
                this.ctx.stroke();

                // Table headers
                this.ctx.fillStyle = '#8b9bb4';
                this.ctx.font = '800 10px Orbitron';
                this.ctx.textAlign = 'left';
                this.ctx.fillText('MEDAL', cx - 230, tableY + 20);
                this.ctx.fillText('LINEAGE', cx - 140, tableY + 20);
                this.ctx.fillText('STAGE', cx + 70, tableY + 20);
                this.ctx.fillText('SCORE', cx + 160, tableY + 20);

                // Divider line
                this.ctx.strokeStyle = 'rgba(255, 215, 0, 0.15)';
                this.ctx.beginPath();
                this.ctx.moveTo(cx - 235, tableY + 28);
                this.ctx.lineTo(cx + 235, tableY + 28);
                this.ctx.stroke();

                // Records list
                this.ctx.font = '600 12px Outfit';
                const count = Math.max(5, this.leaderboard.length);
                const loopIter = Array.from({ length: 5 });

                loopIter.forEach((_, idx) => {
                    const rowY = tableY + 46 + idx * rowH;
                    const record = this.leaderboard[idx];

                    // Medal indicators
                    const medalLabels = ['❶ GOLD', '❷ SILVER', '❸ BRONZE', '❹', '❺'];
                    const medalColors = ['#ffd700', '#c0c0c0', '#cd7f32', '#8b9bb4', '#8b9bb4'];
                    
                    this.ctx.fillStyle = medalColors[idx];
                    this.ctx.font = '800 11px Orbitron';
                    this.ctx.fillText(medalLabels[idx], cx - 230, rowY);
                    
                    this.ctx.font = '600 12px Outfit';
                    if (record) {
                        this.ctx.fillStyle = '#ffffff';
                        this.ctx.fillText(record.lineage.substring(0, 15), cx - 140, rowY);
                        this.ctx.fillText(record.stage, cx + 70, rowY);
                        this.ctx.fillText(record.score, cx + 160, rowY);
                    } else {
                        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                        this.ctx.fillText('---', cx - 140, rowY);
                        this.ctx.fillText('---', cx + 70, rowY);
                        this.ctx.fillText('---', cx + 160, rowY);
                    }
                });

                this.ctx.restore();
            }
        }

        // --- LAUNCH ENGINE ---
        const game = new BiomeGame();
        game.init();

    </script>
