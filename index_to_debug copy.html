<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immunity Protocol - Biome Defense</title>
    <!-- Modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #03030c;
            --panel-bg: rgba(10, 10, 25, 0.85);
            --border-glow: #00f3ff;
            --accent-gold: #ffd700;
            --accent-magenta: #ff00ff;
            --accent-yellow: #ffff00;
            --accent-green: #39ff14;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.05) 0%, transparent 40%);
        }

        /* Responsive centered container */
        .game-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            padding: 10px;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 9 / 10;
            background: #020208;
            border: 2px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            box-shadow: 
                0 0 20px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(0, 243, 255, 0.15);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        canvas.boss-active {
            border-color: rgba(255, 0, 255, 0.5);
            box-shadow: 
                0 0 20px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(255, 0, 255, 0.2);
        }

        /* Accessible instructions */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>
    <h1 class="sr-only">Immunity Protocol - Biome Defense</h1>
    
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="900" height="1000" tabindex="1"></canvas>
    </div>

    <script>
        // --- CONSTANTS & CONFIGURATION ---
        const CANVAS_WIDTH = 900;
        const CANVAS_HEIGHT = 1000;

        const DIFF_CONFIGS = {
            EASY: { name: 'EASY', speedMult: 0.7, fireMult: 0.7, hpMult: 0.8, scoreMult: 0.8, color: '#39ff14' },
            NORMAL: { name: 'NORMAL', speedMult: 1.0, fireMult: 1.0, hpMult: 1.0, scoreMult: 1.0, color: '#00f3ff' },
            HARD: { name: 'HARD', speedMult: 1.35, fireMult: 1.3, hpMult: 1.3, scoreMult: 1.5, color: '#ff3333' }
        };

        // --- PROCEDURAL AUDIO SYNTHESIZER ---
        class AudioManager {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.noiseBuffer = null;
            }

            init() {
                if (this.ctx) return;
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContextClass();
                this.createNoiseBuffer();
            }

            createNoiseBuffer() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 2;
                this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = this.noiseBuffer.getChannelData(0);
                // Safe non-imperative array mapping using Float32Array
                data.forEach((_, i) => {
                    data[i] = Math.random() * 2 - 1;
                });
            }

            playNoise(duration, filterFreq, type = 'lowpass', volume = 0.3) {
                if (!this.ctx || this.muted) return null;
                
                const noiseNode = this.ctx.createBufferSource();
                noiseNode.buffer = this.noiseBuffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = type;
                filter.frequency.setValueAtTime(filterFreq, this.ctx.currentTime);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

                noiseNode.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noiseNode.start();
                noiseNode.stop(this.ctx.currentTime + duration);
                return noiseNode;
            }

            shoot() {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1600, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            hit() {
                if (!this.ctx || this.muted) return;
                // Triangle sweep
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.12);

                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);

                // Quick noise burst
                this.playNoise(0.08, 1200, 'bandpass', 0.15);
            }

            lyse() {
                if (!this.ctx || this.muted) return;
                // Sawtooth sweep down
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(380, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.35);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);

                // High intensity white noise burst
                this.playNoise(0.4, 600, 'lowpass', 0.25);
            }

            powerup() {
                if (!this.ctx || this.muted) return;
                const now = this.ctx.currentTime;
                // C major triad arpeggio: C5 (523Hz), E5 (659Hz), G5 (784Hz), C6 (1046Hz)
                const freqs = [523.25, 659.25, 783.99, 1046.50];
                freqs.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                    
                    gain.gain.setValueAtTime(0.0, now);
                    gain.gain.setValueAtTime(0.08, now + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.18);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.2);
                });
            }

            levelUp() {
                if (!this.ctx || this.muted) return;
                const now = this.ctx.currentTime;
                const freqs = [440, 554.37, 659.25]; // A4, C#5, E5 rising
                freqs.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    
                    gain.gain.setValueAtTime(0.0, now);
                    gain.gain.setValueAtTime(0.12, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.3);
                });
            }

            playerHit() {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(80, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(20, this.ctx.currentTime + 0.45);

                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.5);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);

                // Low-pass filtered noise rumble
                this.playNoise(0.5, 200, 'lowpass', 0.45);
            }

            gameOver() {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 1.4);

                gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 1.5);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 1.5);
            }

            bossWarn() {
                if (!this.ctx || this.muted) return;
                const now = this.ctx.currentTime;
                // Repeating alert alarm alternating frequencies
                const iterations = Array.from({ length: 6 });
                iterations.forEach((_, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = 'square';
                    const freq = (i % 2 === 0) ? 440 : 550;
                    osc.frequency.setValueAtTime(freq, now + i * 0.25);
                    
                    gain.gain.setValueAtTime(0.0, now);
                    gain.gain.setValueAtTime(0.12, now + i * 0.25);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.25 + 0.22);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now + i * 0.25);
                    osc.stop(now + i * 0.25 + 0.25);
                });
            }

            complement() {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1400, this.ctx.currentTime + 0.5);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.6);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.6);

                // High-frequency sweep noise
                this.playNoise(0.6, 3000, 'highpass', 0.25);
            }

            bossSweep() {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(65, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.8);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.8);

                // Sweep noise
                this.playNoise(0.8, 500, 'bandpass', 0.3);
            }
        }

        const audio = new AudioManager();

        // --- LINEAGE DEFINITIONS ---
        const LINEAGES = [
            {
                id: 'MACROPHAGE',
                name: 'MACROPHAGE',
                subname: 'Balanced Phagocyte',
                color: '#00f3ff', // Cyan
                maxLives: 5,
                startLives: 3,
                speed: 360,
                fireCooldown: 0.28,
                desc: 'Cyan. Starts with 3 lives. Balanced speed, fires custom Y-shaped antibody bullets. Shifting single-lobed nucleus.',
                bulletType: 'antibody',
                drawNucleus: (ctx, x, y, size, pulse) => {
                    ctx.fillStyle = 'rgba(0, 243, 255, 0.4)';
                    ctx.beginPath();
                    const nx = x + Math.cos(pulse) * (size * 0.15);
                    const ny = y + Math.sin(pulse) * (size * 0.15);
                    ctx.arc(nx, ny, size * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                }
            },
            {
                id: 'NATURAL_KILLER',
                name: 'NATURAL KILLER',
                subname: 'High Fire Power',
                color: '#ff00ff', // Magenta
                maxLives: 4,
                startLives: 3,
                speed: 320,
                fireCooldown: 0.30,
                desc: 'Magenta. Projects massive ring perforins. Bullet pierce max 3 targets. Multi-lobes nucleus.',
                bulletType: 'perforin',
                drawNucleus: (ctx, x, y, size, pulse) => {
                    ctx.fillStyle = 'rgba(255, 0, 255, 0.4)';
                    const lobes = [
                        { dx: -0.2, dy: -0.15 },
                        { dx: 0.2, dy: -0.1 },
                        { dx: 0.05, dy: 0.2 }
                    ];
                    lobes.forEach(lobe => {
                        ctx.beginPath();
                        const nx = x + (lobe.dx * size) + Math.cos(pulse + lobe.dx * 10) * (size * 0.05);
                        const ny = y + (lobe.dy * size) + Math.sin(pulse + lobe.dy * 10) * (size * 0.05);
                        ctx.arc(nx, ny, size * 0.2, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
            },
            {
                id: 'NEUTROPHIL',
                name: 'NEUTROPHIL',
                subname: 'High Speed Responder',
                color: '#ffff00', // Yellow
                maxLives: 3,
                startLives: 3,
                speed: 470,
                fireCooldown: 0.23,
                desc: 'Yellow. Granulocyte. Fast movement, fires highly rapid streams of yellow granule dots. Lobulated nucleus.',
                bulletType: 'granule',
                drawNucleus: (ctx, x, y, size, pulse) => {
                    ctx.fillStyle = 'rgba(255, 255, 0, 0.35)';
                    ctx.beginPath();
                    const nx1 = x - size * 0.15 + Math.cos(pulse) * 3;
                    const ny1 = y + Math.sin(pulse) * 3;
                    const nx2 = x + size * 0.15 + Math.cos(pulse + Math.PI) * 3;
                    const ny2 = y + Math.sin(pulse + Math.PI) * 3;
                    ctx.arc(nx1, ny1, size * 0.22, 0, Math.PI * 2);
                    ctx.arc(nx2, ny2, size * 0.22, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Connection path
                    ctx.strokeStyle = 'rgba(255, 255, 0, 0.35)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(nx1, ny1);
                    ctx.lineTo(nx2, ny2);
                    ctx.stroke();
                }
            }
        ];

        // --- ENTITY CLASSES ---
        class PlayerCell {
            constructor(lineage) {
                this.lineage = lineage;
                this.x = CANVAS_WIDTH / 2;
                this.y = 860;
                this.size = 32;
                this.vx = 0;
                this.lives = lineage.startLives;
                this.maxLives = lineage.maxLives;
                this.speed = lineage.speed;
                this.fireTimer = 0;
                this.invincibilityTimer = 0;
                this.pulse = 0;
                this.targetDir = 0; // Smoothed movement direction axis
            }

            update(dt, keys, tripleShotActive, rapidFireActive) {
                this.pulse += dt * 4;
                
                // Keyboard controls
                let moveDir = 0;
                if (keys['ArrowLeft'] || keys['KeyA'] || keys['a']) moveDir = -1;
                if (keys['ArrowRight'] || keys['KeyD'] || keys['d']) moveDir = 1;

                // Interpolate input direction for butter-smooth acceleration curves
                this.targetDir += (moveDir - this.targetDir) * dt * 15.0;

                // Physics (Friction and Snappy acceleration)
                const friction = 10.0;
                const accel = this.speed * friction * 1.5;
                const targetAccel = this.targetDir * accel;

                // Analytical solution for velocity update to prevent numerical instability at variable dt
                const decay = Math.exp(-friction * dt);
                this.vx = this.vx * decay + (targetAccel / friction) * (1 - decay);
                this.x += this.vx * dt;

                // Screen constraint
                const limit = this.size + 15;
                if (this.x < limit) {
                    this.x = limit;
                    this.vx = 0;
                }
                if (this.x > CANVAS_WIDTH - limit) {
                    this.x = CANVAS_WIDTH - limit;
                    this.vx = 0;
                }

                // Invincibility cooldown
                if (this.invincibilityTimer > 0) {
                    this.invincibilityTimer -= dt;
                }

                // Fire cooldown timer
                if (this.fireTimer > 0) {
                    const cooldownMult = rapidFireActive ? 0.55 : 1.0;
                    this.fireTimer -= dt;
                }
            }

            draw(ctx) {
                ctx.save();
                
                // Invincibility flashing effect
                if (this.invincibilityTimer > 0 && Math.floor(this.invincibilityTimer * 10) % 2 === 0) {
                    ctx.restore();
                    return;
                }

                // Outer membrane glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.lineage.color;
                
                // Draw outer cytoplasm
                ctx.strokeStyle = this.lineage.color;
                ctx.lineWidth = 3;
                ctx.fillStyle = 'rgba(10, 10, 30, 0.7)';
                ctx.beginPath();
                // Create an organic wobbly cell shape
                const numPoints = 12;
                Array.from({ length: numPoints }).forEach((_, i) => {
                    const angle = (i / numPoints) * Math.PI * 2;
                    const wobble = Math.sin(this.pulse + angle * 3) * 2;
                    const r = this.size + wobble;
                    const px = this.x + Math.cos(angle) * r;
                    const py = this.y + Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Clear shadow for interior
                ctx.shadowBlur = 0;

                // Draw lineage specific nucleus
                this.lineage.drawNucleus(ctx, this.x, this.y, this.size, this.pulse);

                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, vx, vy, isEnemy, bulletType, color, pierceMax = 1) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.isEnemy = isEnemy;
                this.bulletType = bulletType; // 'antibody', 'perforin', 'granule', 'standard'
                this.color = color;
                this.size = isEnemy ? 6 : (bulletType === 'perforin' ? 18 : (bulletType === 'granule' ? 5 : 8));
                this.pierceCount = 0;
                this.pierceMax = pierceMax;
                this.damagedIds = []; // Stores IDs of hit enemies to prevent double damage

                // Fluid physics variables
                this.age = 0;
                if (!this.isEnemy) {
                    this.driftAmp = 18 + Math.random() * 14;  // 18-32px
                    this.driftFreq = 4 + Math.random() * 3;   // 4-7 Hz
                } else {
                    this.driftAmp = 12 + Math.random() * 10;  // 12-22px
                    this.driftFreq = 3 + Math.random() * 3;   // 3-6 Hz
                }
                this.driftPhase = Math.random() * Math.PI * 2;
                this.isHoming = false; // Set to true for Overlord enraged mode homing shots
            }

            update(dt, playerX, playerY) {
                this.age += dt;

                if (this.isHoming && playerX !== undefined && playerY !== undefined) {
                    const dx = playerX - this.x;
                    const dy = playerY - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > 5) {
                        const targetVx = (dx / dist) * 280;
                        const targetVy = (dy / dist) * 280;
                        this.vx += (targetVx - this.vx) * dt * 3.5;
                        this.vy += (targetVy - this.vy) * dt * 3.5;
                    }
                }

                const lateralDrift = this.isHoming ? 0 : (this.driftAmp * Math.cos(this.age * this.driftFreq + this.driftPhase) * dt);
                this.x += this.vx * dt + lateralDrift;
                this.y += this.vy * dt;
            }

            draw(ctx) {
                ctx.save();
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;

                if (this.bulletType === 'antibody') {
                    // Y-shaped antibody bullet
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + 6);
                    ctx.lineTo(this.x, this.y - 2);
                    ctx.moveTo(this.x, this.y - 2);
                    ctx.lineTo(this.x - 5, this.y - 8);
                    ctx.moveTo(this.x, this.y - 2);
                    ctx.lineTo(this.x + 5, this.y - 8);
                    ctx.stroke();
                } else if (this.bulletType === 'perforin') {
                    // Magenta expanding ring perforin
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (this.bulletType === 'granule') {
                    // Yellow small dot
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Standard circle pathogen/enemy bullets
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        class Pathogen {
            constructor(id, type, x, y, difficultyHpMult, entryIndex = 0, colIndex = 0) {
                this.id = id;
                this.type = type;
                this.homeX = x;
                this.homeY = y;
                this.entryIndex = entryIndex;
                this.colIndex = colIndex;
                this.isSwooping = false;
                this.hasArrived = false;
                this.swoopProgress = 0;

                // Determine start position offscreen
                // Even columns (colIndex % 2 === 0): top-left
                // Odd columns (colIndex % 2 === 1): top-right
                if (colIndex % 2 === 0) {
                    this.startPos = { x: -50, y: -50 };
                } else {
                    this.startPos = { x: CANVAS_WIDTH + 50, y: -50 };
                }

                // Control point for Quadratic Bezier (looping low near center-bottom)
                this.controlPos = { x: CANVAS_WIDTH / 2, y: CANVAS_HEIGHT - 100 };

                // Initial position is start position
                this.x = this.startPos.x;
                this.y = this.startPos.y;

                let baseHp = 1;
                this.size = 20;
                this.color = '#ff3333';

                if (type === 'parvovirus') {
                    this.size = 14;
                    this.color = '#9d4edd';
                    baseHp = 1;
                } else if (type === 'poliovirus') {
                    this.size = 16;
                    this.color = '#ff007f';
                    baseHp = 1;
                } else if (type === 'mycoplasma') {
                    this.size = 15;
                    this.color = '#ccff33';
                    baseHp = 1;
                } else if (type === 'e_coli') {
                    this.size = 22;
                    this.color = '#39ff14';
                    baseHp = 2;
                } else if (type === 'sars_cov_2') {
                    this.size = 24;
                    this.color = '#ff7b00';
                    baseHp = 3;
                } else if (type === 'influenza') {
                    this.size = 21;
                    this.color = '#ff4d4d';
                    baseHp = 2;
                } else if (type === 'candida') {
                    this.size = 25;
                    this.color = '#eaf4f4';
                    baseHp = 3;
                } else if (type === 'cryptococcus') {
                    this.size = 32;
                    this.color = '#3c096c';
                    baseHp = 5;
                } else if (type === 'bacteriophage_t4') {
                    this.size = 26;
                    this.color = '#06d6a0';
                    baseHp = 3;
                } else if (type === 'haloquadratum') {
                    this.size = 23;
                    this.color = '#ff0054';
                    baseHp = 2;
                } else if (type === 'mimivirus') {
                    this.size = 38;
                    this.color = '#4361ee';
                    baseHp = 8;
                } else {
                    if (type === 'virus') {
                        this.size = 20;
                        this.color = '#ff3333';
                        baseHp = 1;
                    } else if (type === 'bacterium') {
                        this.size = 22;
                        this.color = '#39ff14';
                        baseHp = 2;
                    } else {
                        this.size = 25;
                        this.color = '#ffaa00';
                        baseHp = 3;
                    }
                }

                this.maxHp = Math.ceil(baseHp * difficultyHpMult);
                this.hp = this.maxHp;
                this.pulse = Math.random() * 10;
            }

            update(dt, moveX, moveY) {
                this.x += moveX;
                this.y += moveY;
                this.pulse += dt * 5;
            }

            draw(ctx) {
                ctx.save();
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;

                if (this.type === 'parvovirus') {
                    ctx.save();
                    ctx.translate(this.x + Math.sin(this.pulse * 24) * 1.5, this.y + Math.cos(this.pulse * 24) * 1.5);
                    ctx.strokeStyle = '#9d4edd';
                    ctx.fillStyle = 'rgba(157, 78, 237, 0.15)';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    Array.from({ length: 6 }).forEach((_, i) => {
                        const angle = (i / 6) * Math.PI * 2 + this.pulse * 0.1;
                        const px = Math.cos(angle) * this.size;
                        const py = Math.sin(angle) * this.size;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    });
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#c77dff';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } 
                else if (this.type === 'poliovirus') {
                    ctx.save();
                    const scale = 1.0 + Math.sin(this.pulse * 8) * 0.08;
                    ctx.translate(this.x, this.y);
                    ctx.scale(scale, scale);
                    ctx.strokeStyle = '#ff007f';
                    ctx.fillStyle = 'rgba(255, 0, 127, 0.12)';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    Array.from({ length: 12 }).forEach((_, i) => {
                        const angle = (i / 12) * Math.PI * 2;
                        const px = Math.cos(angle) * this.size;
                        const py = Math.sin(angle) * this.size;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    });
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
                else if (this.type === 'mycoplasma') {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.strokeStyle = '#ccff33';
                    ctx.fillStyle = 'rgba(204, 255, 51, 0.12)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    const numLobe = 10;
                    Array.from({ length: numLobe }).forEach((_, i) => {
                        const angle = (i / numLobe) * Math.PI * 2;
                        const rMult = 1.0 + Math.sin(this.pulse * 4 + i * 3) * 0.18;
                        const px = Math.cos(angle) * this.size * rMult;
                        const py = Math.sin(angle) * this.size * rMult;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    });
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
                else if (this.type === 'e_coli') {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(Math.PI / 12 * Math.sin(this.pulse * 2));
                    ctx.strokeStyle = '#39ff14';
                    ctx.fillStyle = 'rgba(57, 255, 20, 0.15)';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(-this.size * 0.35, 0, this.size * 0.45, Math.PI/2, -Math.PI/2);
                    ctx.lineTo(this.size * 0.35, -this.size * 0.45);
                    ctx.arc(this.size * 0.35, 0, this.size * 0.45, -Math.PI/2, Math.PI/2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // Flags tails
                    ctx.strokeStyle = 'rgba(57, 255, 20, 0.7)';
                    ctx.lineWidth = 1.5;
                    Array.from({ length: 3 }).forEach((_, i) => {
                        const yOff = -this.size * 0.2 + i * (this.size * 0.2);
                        ctx.beginPath();
                        ctx.moveTo(-this.size * 0.75, yOff);
                        const wave1 = Math.sin(this.pulse * 10 + i) * 6;
                        const wave2 = Math.cos(this.pulse * 12 + i) * 4;
                        ctx.bezierCurveTo(
                            -this.size * 1.1, yOff + wave1,
                            -this.size * 1.4, yOff + wave2,
                            -this.size * 1.8, yOff + wave1
                        );
                        ctx.stroke();
                    });
                    ctx.restore();
                }
                else if (this.type === 'sars_cov_2') {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.strokeStyle = '#ff7b00';
                    ctx.fillStyle = 'rgba(255, 123, 0, 0.14)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.85, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    const numSpikes = 12;
                    ctx.strokeStyle = '#ff9e00';
                    ctx.lineWidth = 2;
                    Array.from({ length: numSpikes }).forEach((_, i) => {
                        const angle = (i / numSpikes) * Math.PI * 2 + this.pulse * 0.1;
                        const baseDist = this.size * 0.85;
                        const peakDist = this.size * 1.25 + Math.sin(this.pulse * 8 + i) * 2;
                        const sx = Math.cos(angle) * baseDist;
                        const sy = Math.sin(angle) * baseDist;
                        const ex = Math.cos(angle) * peakDist;
                        const ey = Math.sin(angle) * peakDist;
                        ctx.beginPath();
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(ex, ey);
                        ctx.stroke();
                    });
                    ctx.restore();
                }
                else if (this.type === 'influenza') {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.strokeStyle = '#ff4d4d';
                    ctx.fillStyle = 'rgba(255, 77, 77, 0.15)';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    const numPoints = 16;
                    Array.from({ length: numPoints }).forEach((_, i) => {
                        const angle = (i / numPoints) * Math.PI * 2;
                        const wVal = Math.sin(this.pulse * 3 + angle * 4) * 2.5;
                        const r = this.size + wVal;
                        const px = Math.cos(angle) * r;
                        const py = Math.sin(angle) * r;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    });
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
                else if (this.type === 'candida') {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.strokeStyle = '#eaf4f4';
                    ctx.fillStyle = 'rgba(234, 244, 244, 0.16)';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 1.0, this.size * 0.8, -Math.PI / 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.save();
                    ctx.translate(this.size * 0.85, -this.size * 0.55);
                    ctx.rotate(Math.PI/4);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 0.5, this.size * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                    ctx.restore();
                }
                else if (this.type === 'cryptococcus') {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.strokeStyle = 'rgba(157, 78, 237, 0.28)';
                    ctx.fillStyle = 'rgba(90, 24, 154, 0.05)';
                    ctx.lineWidth = 3.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 1.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.strokeStyle = '#3c096c';
                    ctx.fillStyle = 'rgba(60, 9, 108, 0.35)';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.75, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
                else if (this.type === 'bacteriophage_t4') {
                    ctx.save();
                    ctx.translate(this.x, this.y - 8 + Math.sin(this.pulse * 5) * 2);
                    ctx.strokeStyle = '#06d6a0';
                    ctx.fillStyle = 'rgba(6, 214, 160, 0.15)';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    const hSize = this.size * 0.55;
                    Array.from({ length: 6 }).forEach((_, i) => {
                        const angle = (i / 6) * Math.PI * 2 - Math.PI/6;
                        const px = Math.cos(angle) * hSize;
                        const py = Math.sin(angle) * hSize - hSize;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    });
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, this.size * 0.7);
                    ctx.stroke();
                    ctx.restore();
                }
                else if (this.type === 'haloquadratum') {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.pulse * 0.4);
                    ctx.strokeStyle = '#ff0054';
                    ctx.fillStyle = 'rgba(255, 0, 84, 0.15)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    const half = this.size * 0.9;
                    ctx.rect(-half, -half, half * 2, half * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
                else if (this.type === 'mimivirus') {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.strokeStyle = '#4361ee';
                    ctx.fillStyle = 'rgba(6, 12, 40, 0.9)';
                    ctx.lineWidth = 3.5;
                    ctx.beginPath();
                    Array.from({ length: 8 }).forEach((_, i) => {
                        const angle = (i / 8) * Math.PI * 2 + this.pulse * 0.05;
                        const px = Math.cos(angle) * this.size * 0.8;
                        const py = Math.sin(angle) * this.size * 0.8;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    });
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
                else {
                    if (this.type === 'virus') {
                        ctx.fillStyle = 'rgba(255, 51, 51, 0.2)';
                        ctx.strokeStyle = '#ff3333';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size * 0.7, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();

                        const numSpikes = 8;
                        Array.from({ length: numSpikes }).forEach((_, i) => {
                            const angle = (i / numSpikes) * Math.PI * 2;
                            const spikeLen = this.size * 1.1 + Math.sin(this.pulse + i) * 3;
                            ctx.beginPath();
                            ctx.moveTo(this.x, this.y);
                            ctx.lineTo(this.x + Math.cos(angle) * spikeLen, this.y + Math.sin(angle) * spikeLen);
                            ctx.stroke();
                        });
                    } 
                    else if (this.type === 'bacterium') {
                        ctx.strokeStyle = '#39ff14';
                        ctx.fillStyle = 'rgba(57, 255, 20, 0.2)';
                        ctx.lineWidth = 2.5;
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.beginPath();
                        ctx.arc(-8, 0, 10, Math.PI/2, -Math.PI/2);
                        ctx.lineTo(8, -10);
                        ctx.arc(8, 0, 10, -Math.PI/2, Math.PI/2);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                        ctx.restore();
                    } 
                    else {
                        ctx.fillStyle = 'rgba(255, 170, 0, 0.25)';
                        ctx.strokeStyle = '#ffaa00';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size * 0.7, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    }
                }

                ctx.restore();
            }
        }

        class MutagenBoss {
            constructor(difficultyHpMult) {
                this.x = CANVAS_WIDTH / 2;
                this.y = -150; // Entry offscreen
                this.targetY = 220;
                this.size = 60;
                this.maxHp = Math.ceil(60 * difficultyHpMult);
                this.hp = this.maxHp;
                
                // FSM states: 'ENTRY', 'PATROL', 'CHARGE_UP', 'RADIAL_BURST', 'CHARGE_ATTACK', 'SWEEP_BEAM', 'SUMMON'
                this.state = 'ENTRY';
                this.stateTimer = 0;
                this.patrolDir = 1;
                this.pulse = 0;
                this.patrolSpeed = 160;
                this.color = '#ff00ff';
                this.glowVal = 0;
                this.swoopSpeed = 500;
                this.swoopProgress = 0;
                this.lockedPlayerX = 0;
                this.sweepDir = 1;
            }

            update(dt, playerX, speedMult) {
                this.pulse += dt * 6;
                this.stateTimer += dt;

                switch(this.state) {
                    case 'ENTRY':
                        // Move down from top center
                        this.y += 180 * dt;
                        if (this.y >= this.targetY) {
                            this.y = this.targetY;
                            this.state = 'PATROL';
                            this.stateTimer = 0;
                        }
                        break;

                    case 'PATROL':
                        // Drift sideways
                        this.x += this.patrolSpeed * this.patrolDir * speedMult * dt;
                        if (this.x > CANVAS_WIDTH - this.size - 40) {
                            this.x = CANVAS_WIDTH - this.size - 40;
                            this.patrolDir = -1;
                        }
                        if (this.x < this.size + 40) {
                            this.x = this.size + 40;
                            this.patrolDir = 1;
                        }

                        // Transition logic: transition to attack modes randomly after 3.5s
                        if (this.stateTimer > 3.5) {
                            this.stateTimer = 0;
                            const randVal = Math.random();
                            if (randVal < 0.25) {
                                this.state = 'CHARGE_UP';
                                audio.bossWarn();
                            } else if (randVal < 0.50) {
                                this.state = 'CHARGE_ATTACK';
                                this.lockedPlayerX = playerX;
                                this.swoopProgress = 0;
                            } else if (randVal < 0.75) {
                                this.state = 'SWEEP_BEAM';
                                this.sweepDir = this.x > CANVAS_WIDTH / 2 ? -1 : 1;
                            } else {
                                this.state = 'SUMMON';
                            }
                        }
                        break;

                    case 'CHARGE_UP':
                        // Glow intense gold for 1.8s
                        this.glowVal = Math.sin(this.stateTimer * 15) * 20 + 20;
                        if (this.stateTimer >= 1.8) {
                            this.state = 'RADIAL_BURST';
                            this.stateTimer = 0;
                        }
                        break;

                    case 'RADIAL_BURST':
                        // Handled in main game script: resets to PATROL
                        this.state = 'PATROL';
                        this.stateTimer = 0;
                        this.glowVal = 0;
                        break;

                    case 'CHARGE_ATTACK':
                        // Locks player position and swoops vertically for 1.2s
                        // Move boss down to player level
                        const duration = 1.2;
                        const t = this.stateTimer / duration;
                        if (t <= 0.5) {
                            // Swoop down towards player (t: 0 to 0.5)
                            const p = t / 0.5; // normalized 0 to 1
                            this.y = this.targetY + (860 - this.targetY) * p;
                            // Move horizontally to player locked coordinate
                            this.x = this.x + (this.lockedPlayerX - this.x) * p * 0.1;
                        } else if (t < 1.0) {
                            // Swoop back up (t: 0.5 to 1.0)
                            const p = (t - 0.5) / 0.5; // normalized 0 to 1
                            this.y = 860 - (860 - this.targetY) * p;
                        } else {
                            this.y = this.targetY;
                            this.state = 'PATROL';
                            this.stateTimer = 0;
                        }
                        break;

                    case 'SWEEP_BEAM':
                        this.x += 300 * this.sweepDir * speedMult * dt;
                        if (this.x > CANVAS_WIDTH - this.size - 40) {
                            this.x = CANVAS_WIDTH - this.size - 40;
                            this.sweepDir = -1;
                        }
                        if (this.x < this.size + 40) {
                            this.x = this.size + 40;
                            this.sweepDir = 1;
                        }
                        if (this.stateTimer >= 3.5) {
                            this.state = 'PATROL';
                            this.stateTimer = 0;
                        }
                        break;

                    case 'SUMMON':
                        // Handled in main game script: summons minions, then PATROL
                        this.state = 'PATROL';
                        this.stateTimer = 0;
                        break;
                }
            }

            draw(ctx) {
                ctx.save();
                
                // Color glows based on state
                let renderColor = '#ff00ff'; // default magenta
                if (this.state === 'CHARGE_UP') {
                    renderColor = '#ffd700'; // gold
                } else if (this.state === 'CHARGE_ATTACK') {
                    renderColor = '#ff3333'; // violent red
                } else if (this.state === 'SWEEP_BEAM') {
                    renderColor = '#00ffff'; // cyan sweep glow
                } else if (this.state === 'SUMMON') {
                    renderColor = '#ff00ff'; // magenta summon
                }

                ctx.shadowBlur = 18 + this.glowVal;
                ctx.shadowColor = renderColor;
                ctx.strokeStyle = renderColor;
                ctx.fillStyle = 'rgba(10, 5, 20, 0.85)';
                ctx.lineWidth = 4;

                // Draw organic segmented boss cell with inner structures
                ctx.beginPath();
                const points = 18;
                Array.from({ length: points }).forEach((_, i) => {
                    const angle = (i / points) * Math.PI * 2;
                    const wobble = Math.sin(this.pulse + angle * 4) * 5;
                    const r = this.size + wobble;
                    const px = this.x + Math.cos(angle) * r;
                    const py = this.y + Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Draw segmented nucleus center
                ctx.fillStyle = 'rgba(255, 0, 255, 0.25)';
                if (this.state === 'CHARGE_UP') ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
                const nucleusPositions = [
                    { dx: -12, dy: -8, size: 16 },
                    { dx: 14, dy: -12, size: 14 },
                    { dx: 4, dy: 16, size: 18 }
                ];
                nucleusPositions.forEach(n => {
                    ctx.beginPath();
                    const nx = this.x + n.dx + Math.cos(this.pulse * 0.8 + n.dx) * 3;
                    const ny = this.y + n.dy + Math.sin(this.pulse * 0.8 + n.dy) * 3;
                    ctx.arc(nx, ny, n.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Connecting nuclear links
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(this.x - 12, this.y - 8);
                ctx.lineTo(this.x + 14, this.y - 12);
                ctx.lineTo(this.x + 4, this.y + 16);
                ctx.closePath();
                ctx.stroke();

                ctx.restore();
            }
        }

        class ShieldNode {
            constructor(boss, index, hpMult) {
                this.boss = boss;
                this.index = index; // 0, 1, 2, 3
                this.angle = (index / 4) * Math.PI * 2;
                this.radius = 115;
                this.size = 18;
                this.maxHp = Math.ceil(10 * hpMult);
                this.hp = this.maxHp;
                this.x = boss.x + Math.cos(this.angle) * this.radius;
                this.y = boss.y + Math.sin(this.angle) * this.radius;
                this.color = '#00f2fe'; // Cyan energy shield
                this.pulse = 0;
            }

            update(dt) {
                this.pulse += dt * 10;
                this.angle += dt * 1.5; // rotate at 1.5 rad/s
                this.x = this.boss.x + Math.cos(this.angle) * this.radius;
                this.y = this.boss.y + Math.sin(this.angle) * this.radius;
            }

            draw(ctx) {
                if (this.hp <= 0) return;
                ctx.save();
                ctx.shadowBlur = 10 + Math.sin(this.pulse) * 4;
                ctx.shadowColor = this.color;
                ctx.strokeStyle = this.color;
                ctx.fillStyle = 'rgba(0, 242, 254, 0.2)';
                ctx.lineWidth = 3;

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Draw small core
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class BioCarrierOverlord {
            constructor(difficultyHpMult) {
                this.x = CANVAS_WIDTH / 2;
                this.y = -180; // Entry offscreen
                this.targetY = 220;
                this.size = 70;
                this.maxHp = Math.ceil(90 * difficultyHpMult);
                this.hp = this.maxHp;
                this.difficultyHpMult = difficultyHpMult;

                // FSM states: 'ENTRY', 'PATROL', 'CHARGE_UP', 'RADIAL_BURST', 'CHARGE_ATTACK', 'SWEEP_BEAM', 'SUMMON'
                this.state = 'ENTRY';
                this.stateTimer = 0;
                this.patrolDir = 1;
                this.pulse = 0;
                this.patrolSpeed = 140; // baseline speed
                this.color = '#00f2fe'; // Shielded color
                this.glowVal = 0;
                this.swoopProgress = 0;
                this.lockedPlayerX = 0;
                this.sweepDir = 1;

                this.shieldNodes = Array.from({ length: 4 }).map((_, i) => new ShieldNode(this, i, difficultyHpMult));
                this.phase = 1; // 1 = Shielded, 2 = Enraged
                this.enrageBannerTimer = 0;
                this.isOverlord = true;
            }

            update(dt, playerX, speedMult) {
                this.pulse += dt * 6;
                this.stateTimer += dt;
                
                if (this.enrageBannerTimer > 0) {
                    this.enrageBannerTimer -= dt;
                }

                // Update shield nodes if in phase 1
                if (this.phase === 1) {
                    this.shieldNodes.forEach(node => node.update(dt));
                    this.shieldNodes = this.shieldNodes.filter(node => node.hp > 0);
                    
                    if (this.shieldNodes.length === 0) {
                        this.phase = 2;
                        this.color = '#ff007f'; // enraged deep pink/magenta
                        this.patrolSpeed = 196; // 40% speed boost from 140
                        this.enrageBannerTimer = 2.5;
                        this.glowVal = 25;
                    }
                }

                switch(this.state) {
                    case 'ENTRY':
                        this.y += 180 * dt;
                        if (this.y >= this.targetY) {
                            this.y = this.targetY;
                            this.state = 'PATROL';
                            this.stateTimer = 0;
                        }
                        break;

                    case 'PATROL':
                        this.x += this.patrolSpeed * this.patrolDir * speedMult * dt;
                        if (this.x > CANVAS_WIDTH - this.size - 40) {
                            this.x = CANVAS_WIDTH - this.size - 40;
                            this.patrolDir = -1;
                        }
                        if (this.x < this.size + 40) {
                            this.x = this.size + 40;
                            this.patrolDir = 1;
                        }

                        // Short patrol in enraged phase
                        const patrolLimit = this.phase === 1 ? 4.0 : 2.5;
                        if (this.stateTimer > patrolLimit) {
                            this.stateTimer = 0;
                            const randVal = Math.random();
                            if (randVal < 0.3) {
                                this.state = 'CHARGE_UP';
                                audio.bossWarn();
                            } else if (randVal < 0.6) {
                                this.state = 'CHARGE_ATTACK';
                                this.lockedPlayerX = playerX;
                                this.swoopProgress = 0;
                            } else if (randVal < 0.8) {
                                this.state = 'SWEEP_BEAM';
                                this.sweepDir = this.x > CANVAS_WIDTH / 2 ? -1 : 1;
                            } else {
                                this.state = 'SUMMON';
                            }
                        }
                        break;

                    case 'CHARGE_UP':
                        this.glowVal = Math.sin(this.stateTimer * 15) * 20 + 20;
                        if (this.stateTimer >= 1.5) {
                            this.state = 'RADIAL_BURST';
                            this.stateTimer = 0;
                        }
                        break;

                    case 'RADIAL_BURST':
                        this.state = 'PATROL';
                        this.stateTimer = 0;
                        this.glowVal = 0;
                        break;

                    case 'CHARGE_ATTACK':
                        const duration = 1.2;
                        const t = this.stateTimer / duration;
                        if (t <= 0.5) {
                            const p = t / 0.5;
                            this.y = this.targetY + (860 - this.targetY) * p;
                            this.x = this.x + (this.lockedPlayerX - this.x) * p * 0.1;
                        } else if (t < 1.0) {
                            const p = (t - 0.5) / 0.5;
                            this.y = 860 - (860 - this.targetY) * p;
                        } else {
                            this.y = this.targetY;
                            this.state = 'PATROL';
                            this.stateTimer = 0;
                        }
                        break;
                    
                    case 'SWEEP_BEAM':
                        this.x += 300 * this.sweepDir * speedMult * dt;
                        if (this.x > CANVAS_WIDTH - this.size - 40) {
                            this.x = CANVAS_WIDTH - this.size - 40;
                            this.sweepDir = -1;
                        }
                        if (this.x < this.size + 40) {
                            this.x = this.size + 40;
                            this.sweepDir = 1;
                        }
                        if (this.stateTimer >= 3.5) {
                            this.state = 'PATROL';
                            this.stateTimer = 0;
                        }
                        break;
                    
                    case 'SUMMON':
                        this.state = 'PATROL';
                        this.stateTimer = 0;
                        break;
                }
            }

            draw(ctx) {
                // Draw shield nodes first
                if (this.phase === 1) {
                    this.shieldNodes.forEach(node => node.draw(ctx));
                }

                ctx.save();
                
                let renderColor = this.color;
                if (this.state === 'CHARGE_UP') {
                    renderColor = '#ffd700'; // gold
                } else if (this.state === 'CHARGE_ATTACK') {
                    renderColor = '#ff3333'; // violent red
                } else if (this.state === 'SWEEP_BEAM') {
                    renderColor = '#00ffff'; // cyan sweep glow
                } else if (this.state === 'SUMMON') {
                    renderColor = this.phase === 1 ? '#00f2fe' : '#ff007f';
                }

                ctx.shadowBlur = 20 + this.glowVal;
                ctx.shadowColor = renderColor;
                ctx.strokeStyle = renderColor;
                ctx.fillStyle = 'rgba(10, 5, 25, 0.9)';
                ctx.lineWidth = 5;

                ctx.beginPath();
                const points = 24;
                Array.from({ length: points }).forEach((_, i) => {
                    const angle = (i / points) * Math.PI * 2;
                    const wobble = Math.sin(this.pulse + angle * 5) * 6;
                    const r = this.size + wobble;
                    const px = this.x + Math.cos(angle) * r;
                    const py = this.y + Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                if (this.phase === 1) {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(0, 242, 254, 0.4)';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([5, 15]);
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 1.3, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.fillStyle = this.phase === 1 ? 'rgba(0, 242, 254, 0.25)' : 'rgba(255, 0, 127, 0.3)';
                const nucleusPositions = [
                    { dx: -15, dy: -12, size: 20 },
                    { dx: 15, dy: -15, size: 18 },
                    { dx: 0, dy: 18, size: 22 }
                ];
                nucleusPositions.forEach(n => {
                    ctx.beginPath();
                    ctx.arc(this.x + n.dx, this.y + n.dy, n.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Nuclear links
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(this.x - 15, this.y - 12);
                ctx.lineTo(this.x + 15, this.y - 15);
                ctx.lineTo(this.x, this.y + 18);
                ctx.closePath();
                ctx.stroke();

                ctx.restore();
            }
        }

        class BarrierBlock {
            constructor(x, y, size, row = 0, col = 0) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.maxHp = 3;
                this.hp = this.maxHp;
                this.row = row;
                this.col = col;
            }

            draw(ctx) {
                if (this.hp <= 0) return;
                ctx.save();
                const opacity = this.hp / this.maxHp;
                ctx.fillStyle = `rgba(0, 243, 255, ${opacity * 0.85})`;
                ctx.shadowBlur = 4;
                ctx.shadowColor = 'rgba(0, 243, 255, 0.5)';
                
                // Draw rounded microscopic organic cell blocks
                ctx.beginPath();
                ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        class Barrier {
            constructor(startX, y) {
                this.blocks = [];
                const rows = 5;
                const cols = 10;
                const blockSize = 6;
                const padding = 1;

                // Create organic rectangular barrier blocks grid
                const iterationsRows = Array.from({ length: rows });
                const iterationsCols = Array.from({ length: cols });
                
                iterationsRows.forEach((_, r) => {
                    iterationsCols.forEach((_, c) => {
                        const bx = startX + c * (blockSize + padding);
                        const by = y + r * (blockSize + padding);
                        this.blocks.push(new BarrierBlock(bx, by, blockSize, r, c));
                    });
                });
            }

            draw(ctx) {
                // Functional data loop to draw active blocks
                this.blocks.forEach(block => block.draw(ctx));
            }
        }

        class PowerUp {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'T', 'M', 'P', 'C'
                this.size = 14;
                this.vy = 120; // Falling speed px/s
                this.pulse = Math.random() * 5;
                
                // Color configuration
                this.color = '#ffffff';
                if (type === 'T') this.color = '#ffd700'; // Gold Hexagon
                else if (type === 'M') this.color = '#00f3ff'; // Cyan Hexagon
                else if (type === 'P') this.color = '#39ff14'; // Green Hexagon (Extra life)
                else if (type === 'C') this.color = '#ff00ff'; // Magenta Hexagon
            }

            update(dt) {
                this.y += this.vy * dt;
                this.pulse += dt * 4;
            }

            draw(ctx) {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2.5;
                ctx.fillStyle = 'rgba(5, 5, 20, 0.85)';

                // Draw pulsing hexagon shape
                ctx.beginPath();
                const scale = 1 + Math.sin(this.pulse) * 0.08;
                const radius = this.size * scale;
                Array.from({ length: 6 }).forEach((_, i) => {
                    const angle = (i / 6) * Math.PI * 2;
                    const px = this.x + Math.cos(angle) * radius;
                    const py = this.y + Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Draw central letter symbol
                ctx.fillStyle = this.color;
                ctx.font = '800 11px Outfit';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const label = this.type === 'P' ? '+1' : this.type;
                ctx.fillText(label, this.x, this.y + 0.5);

                ctx.restore();
            }
        }

        class ComplementWave {
            constructor(startX, startY) {
                this.x = startX;
                this.y = startY;
                this.radius = 0;
                this.maxRadius = 1100;
                this.speed = 1000; // expansion speed px/s
                this.pathogensHit = []; // Prevents double hits
                this.bossHit = false;
            }

            update(dt) {
                this.radius += this.speed * dt;
            }

            draw(ctx) {
                ctx.save();
                // Golden glowing rings
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.75)';
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#ffd700';
                
                // Double concentric expanding rings
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();

                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.radius - 25), 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();
            }

            isFinished() {
                return this.radius >= this.maxRadius;
            }
        }

        class Particle {
            constructor(x, y, color, options = {}) {
                this.x = x;
                this.y = y;
                this.color = color;
                
                const speed = options.speed !== undefined ? options.speed : (Math.random() * 150 + 100);
                const angle = options.angle !== undefined ? options.angle : (Math.random() * Math.PI * 2);
                
                this.vx = options.vx !== undefined ? options.vx : Math.cos(angle) * speed;
                this.vy = options.vy !== undefined ? options.vy : Math.sin(angle) * speed;
                
                this.size = options.size !== undefined ? options.size : (Math.random() * 4 + 2);
                this.maxLife = options.life !== undefined ? options.life : (0.5 + Math.random() * 0.3);
                this.life = this.maxLife;
                
                this.decay = options.decay !== undefined ? options.decay : 0.96;
                this.gravity = options.gravity !== undefined ? options.gravity : 0;
            }

            update(dt) {
                // Apply gravity
                this.vy += this.gravity * dt;
                
                // Frame-rate independent decay (drag multiplier)
                const drag = Math.pow(this.decay, dt * 60);
                this.vx *= drag;
                this.vy *= drag;
                
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                ctx.save();
                const opacity = Math.max(0, Math.min(1, this.life / this.maxLife));
                ctx.fillStyle = this.color;
                ctx.globalAlpha = opacity;
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- GAME ENGINE STATE & SYSTEM ---
        class BiomeGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                // Game States: 'MENU', 'LINEAGE_SELECT', 'PLAYING', 'STAGE_CLEAR', 'GAME_OVER', 'PAUSED'
                this.state = 'MENU';
                this.selectedDiff = 'NORMAL';
                this.selectedLineageIndex = 0;
                
                this.player = null;
                this.bullets = [];
                this.pathogens = [];
                this.boss = null;
                this.barriers = [];
                this.powerUps = [];
                this.waves = [];
                this.particles = [];
                
                // UI & Statistics
                this.score = 0;
                this.highScore = parseInt(localStorage.getItem('immunity_highscore')) || 0;
                this.stage = 1;
                this.kills = 0;
                this.killsForComplement = 0;
                
                // Active inventory counts
                this.inventory = {
                    T: 0, // Triple shot
                    M: 0, // Rapid fire
                    C: 0  // Cytokine Storm
                };
                
                // Power-up durations remaining
                this.activeTimers = {
                    tripleShot: 0,
                    rapidFire: 0
                };
                
                this.complementCharges = 0;
                this.maxComplementCharges = 4;
                
                // State management helper fields
                this.keys = {};
                this.stageClearTimer = 0;
                this.screenShake = 0;
                this.pathogenDirection = 1;
                this.pathogenDescendTriggered = false;
                this.pathogenSpawnCount = 0;
                this.bossSpawned = false;
                this.bossWarningTimer = 0;
                this.currentCongaLineIndex = 0;
                this.congaLineDelayTimer = 0;
                
                // Leaderboard
                this.leaderboard = JSON.parse(localStorage.getItem('immunity_leaderboard')) || [];
                
                // Audio initialization tracker
                this.audioInitialized = false;

                // Mouse click targets on screens
                this.clickRegions = [];
            }

            init() {
                // Key event listeners
                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    this.handleKeyPress(e);
                });
                
                window.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });
                
                // Canvas click handling
                this.canvas.addEventListener('click', (e) => {
                    this.handleCanvasClick(e);
                });

                // Initial layout frame trigger
                this.lastTime = performance.now();
                this.gameLoop(this.lastTime);
            }

            handleKeyPress(e) {
                // Ensure audio initialized on user interactions
                if (!this.audioInitialized) {
                    audio.init();
                    this.audioInitialized = true;
                }

                if (this.state === 'PLAYING') {
                    if (e.code === 'KeyP' || e.code === 'Keyp') {
                        this.state = 'PAUSED';
                        audio.hit();
                    }
                    if (e.code === 'KeyM' || e.code === 'Keym') {
                        audio.muted = !audio.muted;
                    }
                    // Power-up activation hotkeys
                    if (e.code === 'Digit1') {
                        this.activateTripleShot();
                    }
                    if (e.code === 'Digit2') {
                        this.activateRapidFire();
                    }
                    if (e.code === 'Digit3') {
                        this.activateCytokineStorm();
                    }
                    if (e.code === 'Digit4') {
                        this.activateComplementWave();
                    }
                } 
                else if (this.state === 'PAUSED') {
                    if (e.code === 'KeyP' || e.code === 'Keyp') {
                        this.state = 'PLAYING';
                        this.lastTime = performance.now();
                        audio.hit();
                    }
                }
            }

            handleCanvasClick(e) {
                if (!this.audioInitialized) {
                    audio.init();
                    this.audioInitialized = true;
                }

                // Calculate relative click coordinate matching native resolution
                const rect = this.canvas.getBoundingClientRect();
                const clickX = ((e.clientX - rect.left) / rect.width) * CANVAS_WIDTH;
                const clickY = ((e.clientY - rect.top) / rect.height) * CANVAS_HEIGHT;

                // Process registered click regions for current screen
                this.clickRegions.forEach(region => {
                    if (clickX >= region.x && clickX <= region.x + region.w &&
                        clickY >= region.y && clickY <= region.y + region.h) {
                        region.callback();
                    }
                });
            }

            registerRegion(x, y, w, h, callback) {
                this.clickRegions.push({ x, y, w, h, callback });
            }

            startNewGame() {
                const config = LINEAGES[this.selectedLineageIndex];
                this.player = new PlayerCell(config);
                this.score = 0;
                this.stage = 1;
                this.kills = 0;
                this.killsForComplement = 0;
                
                this.inventory = { T: 0, M: 0, C: 0 };
                this.activeTimers = { tripleShot: 0, rapidFire: 0 };
                this.complementCharges = 0;
                
                this.bullets = [];
                this.pathogens = [];
                this.boss = null;
                this.powerUps = [];
                this.waves = [];
                this.particles = [];
                
                this.bossSpawned = false;
                this.stageClearTimer = 0;
                this.screenShake = 0;
                this.blinkTimer = 0;

                // Initialize drifting background elements
                this.bgDrifters = Array.from({ length: 18 }).map(() => {
                    const types = ['rbc', 'platelet', 'virus', 'bacteria', 'fungi'];
                    const type = types[Math.floor(Math.random() * types.length)];
                    let color = 'rgba(230, 60, 60, 1)';
                    if (type === 'platelet') color = 'rgba(230, 200, 100, 1)';
                    else if (type === 'virus') color = 'rgba(240, 60, 240, 1)';
                    else if (type === 'bacteria') color = 'rgba(60, 220, 60, 1)';
                    else if (type === 'fungi') color = 'rgba(60, 160, 240, 1)';
                    
                    return {
                        x: Math.random() * CANVAS_WIDTH,
                        y: Math.random() * CANVAS_HEIGHT,
                        vy: 15 + Math.random() * 25, // 15 to 40 px/s downward
                        vx: (Math.random() - 0.5) * 8, // slight lateral drift
                        size: 15 + Math.random() * 30, // 15 to 45 px
                        type: type,
                        opacity: 0.12 + Math.random() * 0.14, // 0.12 to 0.26
                        color: color,
                        pulsePhase: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.5
                    };
                });
                
                this.buildBarriers();
                this.spawnPathogens();
                
                this.state = 'PLAYING';
                this.lastTime = performance.now();
                audio.levelUp();
            }

            buildBarriers() {
                this.barriers = [];
                // 4 barriers positioned horizontally above player
                const spacing = 180;
                const startX = 90;
                const list = Array.from({ length: 4 });
                list.forEach((_, i) => {
                    const bx = startX + i * spacing;
