                    this.barriers.push(new Barrier(bx, 730));
                });
            }

            spawnPathogens() {
                this.pathogens = [];
                this.bullets = [];
                this.powerUps = [];
                this.boss = null;
                
                const diffConfig = DIFF_CONFIGS[this.selectedDiff];
                
                // If stage is multiple of 5, we spawn the boss only (multiple of 10 is Overlord)
                if (this.stage % 5 === 0) {
                    if (this.stage % 10 === 0) {
                        this.boss = new BioCarrierOverlord(diffConfig.hpMult);
                    } else {
                        this.boss = new MutagenBoss(diffConfig.hpMult);
                    }
                    this.bossSpawned = true;
                    this.bossWarningTimer = 2.0;
                    this.screenShake = 8; // screen shake on boss warning
                    audio.bossWarn();
                    return;
                }
                
                this.bossSpawned = false;

                // Reset formation variables
                this.formationTime = 0;
                this.formationAngle = 0;
                this.formationCenterX = 450;
                this.formationCenterY = 250;

                // Helper to get pathogen type based on stage and depth (0=outer/top, 1=middle, 2=inner/bottom)
                const getPathogenType = (stage, depth) => {
                    if (stage === 1) {
                        if (depth === 0) return 'parvovirus';
                        if (depth === 1) return 'poliovirus';
                        return 'mycoplasma';
                    }
                    if (stage === 2) {
                        if (depth === 0) return 'mycoplasma';
                        if (depth === 1) return 'poliovirus';
                        return 'e_coli';
                    }
                    if (stage === 3) {
                        if (depth === 0) return 'e_coli';
                        if (depth === 1) return 'influenza';
                        return 'sars_cov_2';
                    }
                    if (stage === 4) {
                        if (depth === 0) return 'influenza';
                        if (depth === 1) return 'candida';
                        return 'cryptococcus';
                    }
                    if (stage === 6) {
                        if (depth === 0) return 'haloquadratum';
                        if (depth === 1) return 'bacteriophage_t4';
                        return 'mimivirus';
                    }
                    // Stage 7+ (Mixed chaotic wave)
                    const pool = ['parvovirus', 'poliovirus', 'mycoplasma', 'e_coli', 'sars_cov_2', 'influenza', 'candida', 'cryptococcus', 'bacteriophage_t4', 'haloquadratum', 'mimivirus'];
                    if (depth === 0) return pool[Math.floor(Math.random() * 4)];
                    if (depth === 1) return pool[3 + Math.floor(Math.random() * 4)];
                    return pool[6 + Math.floor(Math.random() * 5)];
                };

                // 4 rows × 8 columns grid configuration coordinates
                const rows = 4;
                const cols = 8;
                const startX = 140;
                const startY = 110;
                const spacingX = 85;
                const spacingY = 70;
                
                let currentId = 0;
                let entryIndex = 0;

                const iterationsRows = Array.from({ length: rows });
                const iterationsCols = Array.from({ length: cols });

                // Cycle formationType: Stage 1 = grid, Stage 2 = star, Stage 3 = wave, Stage 4 = circles, Stage 5 = boss
                const mod = this.stage % 5;
                const formationType = (mod === 1) ? 'grid' : ((mod === 2) ? 'star' : ((mod === 3) ? 'wave' : 'circles'));
                this.currentFormation = formationType;
                this.currentCongaLineIndex = 0;
                this.congaLineDelayTimer = 0;

                if (formationType === 'circles') {
                    // Concentric Circles: 16 outer, 10 middle, 6 inner = 32 pathogens
                    const circleConfigs = [
                        { radius: 180, count: 16, depth: 0 },
                        { radius: 120, count: 10, depth: 1 },
                        { radius: 60, count: 6, depth: 2 }
                    ];

                    circleConfigs.forEach((config, cIdx) => {
                        const count = config.count;
                        const radius = config.radius;
                        const depth = config.depth;
                        const type = getPathogenType(this.stage, depth);
                        
                        const circlePathogens = Array.from({ length: count }).map((_, j) => {
                            const theta = (j / count) * 2 * Math.PI;
                            const px = 450 + Math.cos(theta) * radius;
                            const py = 250 + Math.sin(theta) * radius;
                            
                            const p = new Pathogen(currentId++, type, px, py, diffConfig.hpMult, entryIndex++, cIdx);
                            p.circleIndex = cIdx;
                            p.baseAngle = theta;
                            p.circleRadius = radius;
                            return p;
                        });
                        
                        // Add to pathogens list
                        this.pathogens.push(...circlePathogens);
                    });
                }
                else if (formationType === 'star') {
                    // 5-pointed star layout
                    const starVertices = Array.from({ length: 10 }).map((_, i) => {
                        const angle = -Math.PI / 2 + i * (Math.PI / 5);
                        const r = (i % 2 === 0) ? 180 : 80;
                        return { x: 450 + Math.cos(angle) * r, y: 250 + Math.sin(angle) * r };
                    });

                    const numPathogens = 32;
                    const totalSegments = 10;
                    Array.from({ length: numPathogens }).forEach((_, pIdx) => {
                        const segmentProgress = (pIdx / numPathogens) * totalSegments;
                        const segIdx = Math.floor(segmentProgress) % totalSegments;
                        const nextSegIdx = (segIdx + 1) % totalSegments;
                        const fraction = segmentProgress - Math.floor(segmentProgress);
                        
                        const v1 = starVertices[segIdx];
                        const v2 = starVertices[nextSegIdx];
                        
                        const px = v1.x + fraction * (v2.x - v1.x);
                        const py = v1.y + fraction * (v2.y - v1.y);
                        
                        const dx = px - 450;
                        const dy = py - 250;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        
                        let depth = 2;
                        if (dist >= 140) depth = 0;
                        else if (dist >= 100) depth = 1;
                        const type = getPathogenType(this.stage, depth);
                        
                        const p = new Pathogen(currentId++, type, px, py, diffConfig.hpMult, entryIndex++, pIdx % 8);
                        p.starOffsetX = dx;
                        p.starOffsetY = dy;
                        this.pathogens.push(p);
                    });
                }
                else {
                    // Wave / Grid layout
                    const columnOrder = [3, 4, 2, 5, 1, 6, 0, 7];
                    columnOrder.forEach((c) => {
                        iterationsRows.forEach((_, r) => {
                            const px = startX + c * spacingX;
                            const py = startY + r * spacingY;
                            
                            let depth = 2;
                            if (r <= 1) depth = 0;
                            else if (r === 2) depth = 1;
                            const type = getPathogenType(this.stage, depth);
                            
                            const p = new Pathogen(currentId++, type, px, py, diffConfig.hpMult, entryIndex++, c);
                            this.pathogens.push(p);
                        });
                    });
                }

                this.pathogenDirection = 1;
                this.pathogenSpawnCount = this.pathogens.length;
            }

            nextStage() {
                this.stage++;
                this.bullets = [];
                this.powerUps = [];
                this.spawnPathogens();
                this.state = 'PLAYING';
                audio.levelUp();
            }

            activateTripleShot() {
                if (this.inventory.T > 0 && this.activeTimers.tripleShot <= 0) {
                    this.inventory.T--;
                    this.activeTimers.tripleShot = 12.0;
                    audio.powerup();
                }
            }

            activateRapidFire() {
                if (this.inventory.M > 0 && this.activeTimers.rapidFire <= 0) {
                    this.inventory.M--;
                    this.activeTimers.rapidFire = 12.0;
                    audio.powerup();
                }
            }

            activateCytokineStorm() {
                if (this.inventory.C > 0) {
                    this.inventory.C--;
                    this.screenShake = 15;
                    audio.lyse();

                    // Apply cytokine damage to all enemies on screen
                    if (this.boss) {
                        if (this.boss.isOverlord && this.boss.phase === 1) {
                            // Damage all shield nodes instead of the body
                            this.boss.shieldNodes.forEach(node => {
                                node.hp -= 10;
                                this.spawnSplatterParticles(node.x, node.y, '#00f2fe', 8, { gravity: 150, decay: 0.94 });
                                if (node.hp <= 0) {
                                    this.score += 200;
                                    audio.lyse();
                                    this.screenShake = Math.max(this.screenShake, 5);
                                    this.spawnSplatterParticles(node.x, node.y, '#00f2fe', 16, { gravity: 200, decay: 0.92, life: 1.0 });
                                }
                            });
                            this.boss.shieldNodes = this.boss.shieldNodes.filter(node => node.hp > 0);
                        } else {
                            this.boss.hp -= 15;
                            const bossColor = this.boss.isOverlord ? '#ff007f' : '#ff00ff';
                            this.spawnSplatterParticles(this.boss.x, this.boss.y, bossColor, 15, { gravity: 150, decay: 0.95 });
                            if (this.boss.hp <= 0) {
                                const points = this.boss.isOverlord ? 1000 : 500;
                                this.score += Math.ceil(points * DIFF_CONFIGS[this.selectedDiff].scoreMult);
                                // Lyse any remaining minions
                                this.pathogens.forEach(p => {
                                    this.spawnSplatterParticles(p.x, p.y, p.color, 12, { gravity: 120, decay: 0.95 });
                                });
                                this.pathogens = [];
                                this.boss = null;
                                audio.lyse();
                            }
                        }
                    } else {
                        // Safe filter modification to prevent iteration crashes during deletion
                        this.pathogens.forEach(p => {
                            if (!p.isSwooping && !p.hasArrived) return;
                            p.hp -= 4;
                            this.spawnSplatterParticles(p.x, p.y, p.color, 8, { gravity: 120, decay: 0.95 });
                        });
                        
                        // Filter out dead pathogens
                        const deadCount = this.pathogens.filter(p => p.hp <= 0).length;
                        if (deadCount > 0) {
                            this.kills += deadCount;
                            this.killsForComplement += deadCount;
                            this.score += Math.ceil(40 * deadCount * DIFF_CONFIGS[this.selectedDiff].scoreMult);
                            this.pathogens = this.pathogens.filter(p => p.hp > 0);
                            
                            this.checkComplementCharges();
                        }
                    }
                }
            }

            activateComplementWave() {
                if (this.complementCharges > 0) {
                    this.complementCharges--;
                    this.waves.push(new ComplementWave(this.player.x, this.player.y));
                    audio.complement();
                }
            }

            checkComplementCharges() {
                if (this.killsForComplement >= 45) {
                    const chargesEarned = Math.floor(this.killsForComplement / 45);
                    this.complementCharges = Math.min(this.maxComplementCharges, this.complementCharges + chargesEarned);
                    this.killsForComplement = this.killsForComplement % 45;
                }
            }

            spawnSplatterParticles(x, y, color, count = 6) {
                const arr = Array.from({ length: count });
                arr.forEach(() => {
                    this.particles.push(new Particle(x, y, color));
                });
            }

            saveLeaderboard() {
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('immunity_highscore', this.highScore);
                }

                const entry = {
                    name: 'LINEAGE ' + this.player.lineage.id.substring(0,3),
                    score: this.score,
                    stage: this.stage,
                    lineage: this.player.lineage.name
                };
                this.leaderboard.push(entry);
                // Sort descending
                this.leaderboard.sort((a, b) => b.score - a.score);
                // Cut top 5
                this.leaderboard = this.leaderboard.slice(0, 5);
                localStorage.setItem('immunity_leaderboard', JSON.stringify(this.leaderboard));
            }

            // --- GAME LOOP PROCESS ---
            gameLoop(timestamp) {
                const dt = Math.min(0.1, (timestamp - this.lastTime) / 1000.0);
                this.lastTime = timestamp;

                this.ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                // Apply screen shake transform if active
                if (this.screenShake > 0) {
                    const dx = (Math.random() - 0.5) * this.screenShake;
                    const dy = (Math.random() - 0.5) * this.screenShake;
                    this.ctx.translate(dx, dy);
                    this.screenShake -= dt * 40;
                }

                switch(this.state) {
                    case 'MENU':
                        this.drawMenu();
                        break;
                    case 'LINEAGE_SELECT':
                        this.drawLineageSelector();
                        break;
                    case 'PLAYING':
                        this.updatePlaying(dt);
                        this.drawPlaying();
                        break;
                    case 'PAUSED':
                        this.drawPlaying();
                        this.drawPauseOverlay();
                        break;
                    case 'STAGE_CLEAR':
                        this.updateStageClear(dt);
                        this.drawPlaying();
                        this.drawStageClearOverlay();
                        break;
                    case 'GAME_OVER':
                        this.drawGameOver();
                        break;
                }

                // Reset screen shake transform
                if (this.screenShake > 0) {
                    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                }

                requestAnimationFrame((t) => this.gameLoop(t));
            }

            // --- UPDATES ---
            updatePlaying(dt) {
                const diffConfig = DIFF_CONFIGS[this.selectedDiff];
                
                // Update player
                this.player.update(dt, this.keys, this.activeTimers.tripleShot > 0, this.activeTimers.rapidFire > 0);

                // Update power-up durations
                if (this.activeTimers.tripleShot > 0) this.activeTimers.tripleShot -= dt;
                if (this.activeTimers.rapidFire > 0) this.activeTimers.rapidFire -= dt;

                // Player firing trigger
                if (this.keys['Space'] || this.keys['KeyF']) {
                    const cd = this.player.lineage.fireCooldown * (this.activeTimers.rapidFire > 0 ? 0.55 : 1.0);
                    if (this.player.fireTimer <= 0) {
                        this.playerShoot();
                        this.player.fireTimer = cd;
                    }
                }

                // Update background drifters
                if (this.bgDrifters) {
                    this.bgDrifters.forEach(d => {
                        d.y += d.vy * dt;
                        d.x += d.vx * dt;
                        d.pulsePhase += dt * 2;
                        if (d.y > CANVAS_HEIGHT + 50) {
                            d.y = -50;
                            d.x = Math.random() * CANVAS_WIDTH;
                        }
                        if (d.x < -50) d.x = CANVAS_WIDTH + 50;
                        if (d.x > CANVAS_WIDTH + 50) d.x = -50;
                    });
                }

                // Update life-loss blink timer
                if (this.blinkTimer > 0) {
                    this.blinkTimer -= dt;
                    if (this.blinkTimer < 0) this.blinkTimer = 0;
                }

                // Update active player bullets
                this.bullets.forEach(bullet => bullet.update(dt, this.player.x, this.player.y));
                this.bullets = this.bullets.filter(b => b.y > -20 && b.y < CANVAS_HEIGHT + 20);

                // Update waves
                this.waves.forEach(wave => wave.update(dt));
                this.waves = this.waves.filter(w => !w.isFinished());

                // Update particles
                this.particles.forEach(p => p.update(dt));
                this.particles = this.particles.filter(p => p.life > 0);

                // Update falling power-ups
                this.powerUps.forEach(pu => pu.update(dt));
                this.powerUps = this.powerUps.filter(pu => pu.y < CANVAS_HEIGHT + 20);

                // Update Boss if spawned
                if (this.boss) {
                    if (this.bossWarningTimer > 0) {
                        this.bossWarningTimer -= dt;
                    } else {
                        const previousBossState = this.boss.state;
                        const previousBossPhase = this.boss.isOverlord ? this.boss.phase : 1;
                        this.boss.update(dt, this.player.x, diffConfig.speedMult);
                        
                        // Check if shield broke
                        if (this.boss.isOverlord && previousBossPhase === 1 && this.boss.phase === 2) {
                            audio.bossWarn();
                            this.screenShake = 20; // Big screen shake
                            this.spawnSplatterParticles(this.boss.x, this.boss.y, '#00f2fe', 30, { gravity: 150, decay: 0.93, life: 1.2 });
                            this.spawnSplatterParticles(this.boss.x, this.boss.y, '#ff007f', 30, { gravity: 200, decay: 0.92, life: 1.0 });
                        }

                        // Shoot triggers or state-based action events
                        if (this.boss.state === 'RADIAL_BURST' && previousBossState !== 'RADIAL_BURST') {
                            this.bossRadialBurst();
                        }
                        
                        // Boss SWEEP_BEAM trigger
                        if (this.boss.state === 'SWEEP_BEAM') {
                            const rate = this.boss.isOverlord ? 0.35 : 0.25;
                            if (Math.random() < rate) {
                                audio.bossSweep();
                                const bulletColor = this.boss.isOverlord ? '#ff007f' : '#ff00ff';
                                const angles = [-Math.PI / 2, -Math.PI / 4, 0, Math.PI / 4, Math.PI / 2];
                                angles.forEach(offsetAngle => {
                                    const angle = Math.PI / 2 + offsetAngle;
                                    const vx = Math.cos(angle) * 320;
                                    const vy = Math.sin(angle) * 320;
                                    this.bullets.push(new Bullet(this.boss.x, this.boss.y + 30, vx, vy, true, 'standard', bulletColor));
                                });
                            }
                        }

                        // Boss SUMMON trigger
                        if (this.boss.state === 'SUMMON' && previousBossState !== 'SUMMON') {
                            audio.bossWarn();
                            const activeMinionsCount = this.pathogens.filter(p => p.isMinion).length;
                            const toSpawn = Math.min(4, 8 - activeMinionsCount);
                            const minionColor = this.boss.isOverlord ? '#ff007f' : '#ff00ff';
                            
                            const spawnList = Array.from({ length: toSpawn });
                            spawnList.forEach((_, idx) => {
                                const homeX = 150 + Math.random() * (CANVAS_WIDTH - 300);
                                const homeY = 120 + Math.random() * 200;
                                
                                const p = new Pathogen('minion_' + Date.now() + '_' + idx, 'virus', homeX, homeY, diffConfig.hpMult, idx, idx);
                                p.isMinion = true;
                                p.color = minionColor;
                                p.startPos = { x: this.boss.x, y: this.boss.y };
                                p.x = this.boss.x;
                                p.y = this.boss.y;
                                p.isSwooping = true;
                                p.swoopProgress = 0;
                                
                                this.pathogens.push(p);
                            });
                        }

                        // Overlord boss periodic shooting
                        if (this.boss.isOverlord) {
                            if (this.boss.state === 'PATROL') {
                                const rate = this.boss.phase === 2 ? 0.06 : 0.02;
                                if (Math.random() < rate * diffConfig.fireMult) {
                                    if (this.boss.phase === 2) {
                                        audio.bossSweep();
                                        const dx = this.player.x - this.boss.x;
                                        const dy = this.player.y - this.boss.y;
                                        const dist = Math.sqrt(dx*dx + dy*dy);
                                        const vx = (dx / dist) * 220;
                                        const vy = (dy / dist) * 220;
                                        const bullet = new Bullet(this.boss.x, this.boss.y + 40, vx, vy, true, 'standard', '#ff007f');
                                        bullet.isHoming = true;
                                        this.bullets.push(bullet);
                                    } else {
                                        this.bossPeriodicShoot();
                                    }
                                }
                            }
                        } else {
                            // MutagenBoss patrol shooting
                            if (this.boss.state === 'PATROL') {
                                if (Math.random() < 0.02 * diffConfig.fireMult) {
                                    this.bossPeriodicShoot();
                                }
                            }
                        }
                    }

                    // Update minion swooping and shooting during boss fights
                    this.updateSwooping(dt);
                    this.pathogenFiring(dt, diffConfig.fireMult);
                } else {
                    // Update swooping pathogens
                    this.updateSwooping(dt);

                    // Keep collective grid movement inactive as long as any pathogen is still swooping or hasn't arrived
                    const allArrived = this.pathogens.every(p => p.hasArrived);
                    if (allArrived) {
                        this.updatePathogenGrid(dt, diffConfig.speedMult);
                        this.pathogenFiring(dt, diffConfig.fireMult);
                    }
                }

                // Process collisions
                this.checkCollisions(dt);

                // Process stage clean completion checks
                this.checkStageCompletion();
            }

            updateStageClear(dt) {
                this.stageClearTimer -= dt;
                
                // Keep processing animations (bullets, waves, particles) but no pathogen/player movements
                this.bullets.forEach(bullet => bullet.update(dt, this.player.x, this.player.y));
                this.waves.forEach(wave => wave.update(dt));
                this.particles.forEach(p => p.update(dt));
                
                if (this.stageClearTimer <= 0) {
                    this.nextStage();
                }
            }

            playerShoot() {
                audio.shoot();
                const bulletColor = this.player.lineage.color;
                const bType = this.player.lineage.bulletType;
                
                // Pierce parameters
                let pierceMax = 1;
                if (this.player.lineage.id === 'NATURAL_KILLER') pierceMax = 3;

                if (this.activeTimers.tripleShot > 0) {
                    // Three bullet spread
                    this.bullets.push(new Bullet(this.player.x, this.player.y - 20, -100, -680, false, bType, bulletColor, pierceMax));
                    this.bullets.push(new Bullet(this.player.x, this.player.y - 20, 0, -700, false, bType, bulletColor, pierceMax));
                    this.bullets.push(new Bullet(this.player.x, this.player.y - 20, 100, -680, false, bType, bulletColor, pierceMax));
                } else {
                    // Standard straight bullet
                    this.bullets.push(new Bullet(this.player.x, this.player.y - 20, 0, -700, false, bType, bulletColor, pierceMax));
                }
            }

            bossRadialBurst() {
                audio.lyse();
                const numBullets = 16;
                const step = (Math.PI * 2) / numBullets;
                const iterations = Array.from({ length: numBullets });
                iterations.forEach((_, i) => {
                    const angle = i * step;
                    const vx = Math.cos(angle) * 320;
                    const vy = Math.sin(angle) * 320;
                    this.bullets.push(new Bullet(this.boss.x, this.boss.y + 10, vx, vy, true, 'standard', '#ff00ff'));
                });
            }

            bossPeriodicShoot() {
                audio.bossSweep();
                // Fire triple vertical downwards spread
                this.bullets.push(new Bullet(this.boss.x, this.boss.y + 40, -80, 320, true, 'standard', '#ff00ff'));
                this.bullets.push(new Bullet(this.boss.x, this.boss.y + 40, 0, 340, true, 'standard', '#ff00ff'));
                this.bullets.push(new Bullet(this.boss.x, this.boss.y + 40, 80, 320, true, 'standard', '#ff00ff'));
            }

            updateSwooping(dt) {
                if (this.pathogens.length === 0) return;

                const diffConfig = DIFF_CONFIGS[this.selectedDiff];
                const fireMult = diffConfig ? diffConfig.fireMult : 1.0;

                // 1. Decrement delay timer if active
                if (this.congaLineDelayTimer > 0) {
                    this.congaLineDelayTimer -= dt;
                }

                // 2. Sort pathogens by entryIndex to process in the correct conga line order
                const sortedPathogens = [...this.pathogens].sort((a, b) => a.entryIndex - b.entryIndex);

                // 3. Check if current active conga line has arrived or is destroyed
                const currentLinePathogens = sortedPathogens.filter(p => Math.floor(p.entryIndex / 4) === this.currentCongaLineIndex);
                if (currentLinePathogens.length > 0 && currentLinePathogens.every(p => p.hasArrived)) {
                    this.congaLineDelayTimer = 0.8;
                    this.currentCongaLineIndex++;
                } else if (currentLinePathogens.length === 0) {
                    const hasLaterPathogens = sortedPathogens.some(p => Math.floor(p.entryIndex / 4) > this.currentCongaLineIndex);
                    if (hasLaterPathogens) {
                        this.congaLineDelayTimer = 0.8;
                        this.currentCongaLineIndex++;
                    }
                }

                // 4. Update swoop flight and queue activation
                let predecessorReady = true;

                sortedPathogens.forEach(p => {
                    const pLineIndex = Math.floor(p.entryIndex / 4);

                    if (p.hasArrived) {
                        if (pLineIndex === this.currentCongaLineIndex) {
                            predecessorReady = true;
                        }
                        return;
                    }

                    if (p.isSwooping) {
                        p.swoopProgress += dt * 0.6; // slower swoop speed (0.6 vs 0.8)
                        if (p.swoopProgress >= 1.0) {
                            p.swoopProgress = 1.0;
                            p.isSwooping = false;
                            p.hasArrived = true;
                            p.x = p.homeX;
                            p.y = p.homeY;
                        } else {
                            const t = p.swoopProgress;
                            const loopCenter = { x: 450, y: 600 };
                            const radius = 100;
                            const loopStartPoint = { x: loopCenter.x, y: loopCenter.y - radius };

                            if (t < 0.4) {
                                const u = t / 0.4;
                                const p0 = p.startPos;
                                const p1 = { x: 450, y: 800 };
                                const p2 = loopStartPoint;
                                p.x = (1 - u) * (1 - u) * p0.x + 2 * (1 - u) * u * p1.x + u * u * p2.x;
                                p.y = (1 - u) * (1 - u) * p0.y + 2 * (1 - u) * u * p1.y + u * u * p2.y;
                            } else if (t < 0.8) {
                                const u = (t - 0.4) / 0.4;
                                const angle = -Math.PI / 2 + u * Math.PI * 2;
                                p.x = loopCenter.x + Math.cos(angle) * radius;
                                p.y = loopCenter.y + Math.sin(angle) * radius;
                            } else {
                                const u = (t - 0.8) / 0.2;
                                p.x = loopStartPoint.x + u * (p.homeX - loopStartPoint.x);
                                p.y = loopStartPoint.y + u * (p.homeY - loopStartPoint.y);
                            }

                            // Galaga-style firing: occasionally shoot downwards during swoop while on-screen
                            if (p.y > 0 && p.y < CANVAS_HEIGHT - 100) {
                                if (Math.random() < 0.007 * fireMult) {
                                    this.pathogenShoot(p);
                                }
                            }
                        }

                        if (pLineIndex === this.currentCongaLineIndex) {
                            predecessorReady = (p.swoopProgress >= 0.20); // wider spacing (0.2 vs 0.08)
                        }
                    } else {
                        if (pLineIndex === this.currentCongaLineIndex && predecessorReady && this.congaLineDelayTimer <= 0) {
                            p.isSwooping = true;
                            p.swoopProgress = 0;
                            predecessorReady = false;
                        } else {
                            p.x = p.startPos.x;
                            p.y = p.startPos.y;
                        }
                    }
                });
            }

            updatePathogenGrid(dt, speedMult) {
                if (this.pathogens.length === 0) return;

                this.formationTime = (this.formationTime || 0) + dt;

                const remainingRatio = this.pathogens.length / this.pathogenSpawnCount;
                const gridSpeed = (65 + (1 - remainingRatio) * 110) * speedMult * this.pathogenDirection;

                let hitBound = false;

                if (this.currentFormation === 'circles') {
                    // Update horizontal center
                    this.formationCenterX = (this.formationCenterX || 450) + gridSpeed * dt;
                    this.formationCenterY = this.formationCenterY || 250;
                    this.formationAngle = (this.formationAngle || 0) + dt * 0.5 * speedMult;

                    // Calculate positions and check screen bounds
                    this.pathogens.forEach(p => {
                        let currentAngle;
                        if (p.circleIndex === 0 || p.circleIndex === 2) {
                            currentAngle = p.baseAngle + this.formationAngle;
                        } else {
                            currentAngle = p.baseAngle - this.formationAngle;
                        }
                        
                        p.x = this.formationCenterX + Math.cos(currentAngle) * p.circleRadius;
                        p.y = this.formationCenterY + Math.sin(currentAngle) * p.circleRadius;
                        p.pulse += dt * 5;

                        // Check horizontal boundary hit
                        if (p.x >= CANVAS_WIDTH - p.size - 25 && this.pathogenDirection > 0) hitBound = true;
                        if (p.x <= p.size + 25 && this.pathogenDirection < 0) hitBound = true;
                    });

                    if (hitBound) {
                        this.pathogenDirection *= -1;
                        this.formationCenterY += 16;
                    }
                }
                else if (this.currentFormation === 'star') {
                    // Update horizontal center
                    this.formationCenterX = (this.formationCenterX || 450) + gridSpeed * dt;
                    this.formationCenterY = this.formationCenterY || 250;
                    
                    const scale = 1.0 + 0.15 * Math.sin(this.formationTime * 2.0);

                    // Calculate positions and check screen bounds
                    this.pathogens.forEach(p => {
                        p.x = this.formationCenterX + p.starOffsetX * scale;
                        p.y = this.formationCenterY + p.starOffsetY * scale;
                        p.pulse += dt * 5;

                        // Check horizontal boundary hit
                        if (p.x >= CANVAS_WIDTH - p.size - 25 && this.pathogenDirection > 0) hitBound = true;
                        if (p.x <= p.size + 25 && this.pathogenDirection < 0) hitBound = true;
                    });

                    if (hitBound) {
                        this.pathogenDirection *= -1;
                        this.formationCenterY += 16;
                    }
                }
                else {
                    // Wave/Normal Grid
                    // Update wave positions (horizontal drift checks bounds based on homeX)
                    this.pathogens.forEach(p => {
                        p.homeX = (p.homeX || p.x) + gridSpeed * dt;
                        p.homeY = p.homeY || p.y;
                        
                        if (p.homeX >= CANVAS_WIDTH - p.size - 25 && this.pathogenDirection > 0) hitBound = true;
                        if (p.homeX <= p.size + 25 && this.pathogenDirection < 0) hitBound = true;
                    });

                    if (hitBound) {
                        this.pathogenDirection *= -1;
                        this.pathogens.forEach(p => {
                            p.homeY = (p.homeY || p.y) + 16;
                        });
                    }

                    // Apply horizontal drift + optional vertical wave undulation
                    this.pathogens.forEach(p => {
                        p.x = p.homeX;
                        if (this.currentFormation === 'wave') {
                            p.y = p.homeY + 40 * Math.sin(this.formationTime * 3.0 + p.colIndex * 0.5);
                        } else {
                            p.y = p.homeY; // Normal Grid
                        }
                        p.pulse += dt * 5;
                    });
                }
            }

            pathogenFiring(dt, fireMult) {
                if (this.pathogens.length === 0) return;

                // Frontline firing logic: Group pathogens by column coordinate (using integer index bins)
                const columnMap = {};
                this.pathogens.forEach(p => {
                    if (!p.isSwooping && !p.hasArrived) return;
                    // bin X coords loosely to identify columns
                    const colIndex = Math.floor(p.x / 40);
                    if (!columnMap[colIndex] || columnMap[colIndex].y < p.y) {
                        columnMap[colIndex] = p; // lowest pathogen is frontline
                    }
                });

                // Convert map values to array list
                const frontlines = Object.values(columnMap);
                
                // Base probability rate of firing
                frontlines.forEach(p => {
                    if (Math.random() < 0.0035 * fireMult) {
                        this.pathogenShoot(p);
                    }
                });
            }

            pathogenShoot(p) {
                if (p.type === 'parvovirus') {
                    this.bullets.push(new Bullet(p.x, p.y + p.size, 0, 340, true, 'standard', '#c77dff'));
                } else if (p.type === 'poliovirus') {
                    this.bullets.push(new Bullet(p.x, p.y + p.size, 0, 260, true, 'standard', '#ff007f'));
                } else if (p.type === 'mycoplasma') {
                    this.bullets.push(new Bullet(p.x, p.y + p.size, 0, 180, true, 'standard', '#ccff33'));
                } else if (p.type === 'e_coli') {
                    this.bullets.push(new Bullet(p.x, p.y + p.size, 0, 320, true, 'standard', '#39ff14'));
                } else if (p.type === 'sars_cov_2') {
                    audio.shoot();
                    this.bullets.push(new Bullet(p.x, p.y + p.size, -60, 250, true, 'standard', '#ff7b00'));
                    this.bullets.push(new Bullet(p.x, p.y + p.size, 0, 260, true, 'standard', '#ff7b00'));
                    this.bullets.push(new Bullet(p.x, p.y + p.size, 60, 250, true, 'standard', '#ff7b00'));
                } else if (p.type === 'influenza') {
                    this.bullets.push(new Bullet(p.x, p.y + p.size, 0, 240, true, 'standard', '#ff4d4d'));
                } else if (p.type === 'candida') {
                    this.bullets.push(new Bullet(p.x, p.y + p.size, 0, 250, true, 'standard', '#eaf4f4'));
                } else if (p.type === 'cryptococcus') {
                    this.bullets.push(new Bullet(p.x, p.y + p.size, 0, 220, true, 'standard', '#b388ff'));
                } else if (p.type === 'bacteriophage_t4') {
                    this.bullets.push(new Bullet(p.x, p.y + p.size, 0, 280, true, 'standard', '#06d6a0'));
                } else if (p.type === 'haloquadratum') {
                    this.bullets.push(new Bullet(p.x, p.y + p.size, 0, 260, true, 'standard', '#ff0054'));
                } else if (p.type === 'mimivirus') {
                    this.bullets.push(new Bullet(p.x, p.y + p.size, 0, 300, true, 'standard', '#4361ee'));
                } else {
                    if (p.type === 'virus') {
                        this.bullets.push(new Bullet(p.x, p.y + p.size, 0, 240, true, 'standard', '#ff3333'));
                    } else if (p.type === 'bacterium') {
                        this.bullets.push(new Bullet(p.x, p.y + p.size, 0, 320, true, 'standard', '#39ff14'));
                    } else if (p.type === 'spike') {
                        audio.shoot();
                        this.bullets.push(new Bullet(p.x, p.y + p.size, -50, 250, true, 'standard', '#ffaa00'));
                        this.bullets.push(new Bullet(p.x, p.y + p.size, 50, 250, true, 'standard', '#ffaa00'));
                    }
                }
            }
            checkCollisions(dt) {
                // Helper to find minimum distance from point C to line segment A-B
                const distToSegment = (cx, cy, ax, ay, bx, by) => {
                    const dx = bx - ax;
                    const dy = by - ay;
                    const l2 = dx * dx + dy * dy;
                    if (l2 === 0) {
                        const dax = cx - ax;
                        const day = cy - ay;
                        return Math.sqrt(dax * dax + day * day);
                    }
                    let t = ((cx - ax) * dx + (cy - ay) * dy) / l2;
                    t = Math.max(0, Math.min(1, t));
                    const projX = ax + t * dx;
                    const projY = ay + t * dy;
                    const dpx = cx - projX;
                    const dpy = cy - projY;
                    return Math.sqrt(dpx * dpx + dpy * dpy);
                };

                // 1. Player Bullets vs Pathogens
                this.bullets.forEach(b => {
                    if (b.isEnemy) return;

                    const prevX = b.x - b.vx * dt;
                    const prevY = b.y - b.vy * dt;

                    this.pathogens.forEach(p => {
                        if (b.damagedIds.includes(p.id) || p.hp <= 0 || (!p.isSwooping && !p.hasArrived)) return;

                        const dist = distToSegment(p.x, p.y, prevX, prevY, b.x, b.y);
                        if (dist < b.size + p.size) {
                            p.hp--;
                            b.damagedIds.push(p.id);
                            b.pierceCount++;
                            audio.hit();
                            this.spawnSplatterParticles(p.x, p.y, p.color, 4, { gravity: 120, decay: 0.95 });

                            if (p.hp <= 0) {
                                // Pathogen destroyed
                                this.kills++;
                                this.killsForComplement++;
                                const points = (p.type === 'parvovirus' || p.type === 'poliovirus' || p.type === 'mycoplasma' || p.type === 'virus') ? 50 : 
                                               ((p.type === 'e_coli' || p.type === 'influenza' || p.type === 'haloquadratum' || p.type === 'bacterium') ? 100 : 
                                               (p.type === 'mimivirus' ? 500 : 180));
                                this.score += Math.ceil(points * DIFF_CONFIGS[this.selectedDiff].scoreMult);
                                audio.lyse();
                                this.screenShake = Math.max(this.screenShake, 3);
                                this.spawnSplatterParticles(p.x, p.y, p.color, 10, { gravity: 160, decay: 0.94, life: 0.8 });
                                this.checkPowerUpDrop(p.x, p.y);
                                this.checkComplementCharges();
                            }

                            if (b.pierceCount >= b.pierceMax) {
                                b.y = -9999; // destroy bullet
                            }
                        }
                    });

                    // Player Bullets vs Boss Shield Nodes
                    if (this.boss && this.boss.isOverlord && this.boss.phase === 1 && !b.isEnemy) {
                        this.boss.shieldNodes.forEach(node => {
                            if (node.hp <= 0 || b.damagedIds.includes('shield_' + node.index)) return;
                            const dist = distToSegment(node.x, node.y, prevX, prevY, b.x, b.y);
                            if (dist < b.size + node.size) {
                                node.hp--;
                                b.damagedIds.push('shield_' + node.index);
                                b.pierceCount++;
                                audio.hit();
                                this.spawnSplatterParticles(node.x, node.y, '#00f2fe', 6, { gravity: 120, decay: 0.94 });
                                if (node.hp <= 0) {
                                    this.score += 200;
                                    audio.lyse();
                                    this.screenShake = Math.max(this.screenShake, 5);
                                    this.spawnSplatterParticles(node.x, node.y, '#00f2fe', 16, { gravity: 200, decay: 0.92, life: 1.0 });
                                }
                                if (b.pierceCount >= b.pierceMax) {
                                    b.y = -9999;
                                }
                            }
                        });
                    }

                    // Player Bullets vs Boss Body
                    if (this.boss && !b.isEnemy) {
                        const dist = distToSegment(this.boss.x, this.boss.y, prevX, prevY, b.x, b.y);
                        if (dist < b.size + this.boss.size && !b.damagedIds.includes('boss')) {
                            b.damagedIds.push('boss');
                            b.pierceCount++;

                            if (this.boss.isOverlord && this.boss.phase === 1) {
                                // Immune: absorbs bullets, spawning blue shield sparks
                                audio.hit();
                                this.spawnSplatterParticles(b.x, b.y, '#00f2fe', 5, { gravity: 80, decay: 0.95 });
                            } else {
                                this.boss.hp--;
                                audio.hit();
                                const bossColor = this.boss.isOverlord ? '#ff007f' : '#ff00ff';
                                this.spawnSplatterParticles(this.boss.x, this.boss.y, bossColor, 5, { gravity: 150, decay: 0.95 });

                                if (this.boss.hp <= 0) {
                                    const points = this.boss.isOverlord ? 2000 : 1000;
                                    this.score += Math.ceil(points * DIFF_CONFIGS[this.selectedDiff].scoreMult);
                                    // Lyse any remaining minions
                                    this.pathogens.forEach(p => {
                                        this.spawnSplatterParticles(p.x, p.y, p.color, 12, { gravity: 120, decay: 0.95 });
                                    });
                                    this.pathogens = [];
                                    this.boss = null;
                                    audio.lyse();
                                    this.screenShake = Math.max(this.screenShake, 15);
                                }
                            }

                            if (b.pierceCount >= b.pierceMax) {
                                b.y = -9999;
                            }
                        }
                    }
                });

                // Clear dead pathogens
                this.pathogens = this.pathogens.filter(p => p.hp > 0);

                // 2. Complement waves vs Pathogens/Boss
                this.waves.forEach(w => {
                    this.pathogens.forEach(p => {
                        if (w.pathogensHit.includes(p.id) || (!p.isSwooping && !p.hasArrived)) return;
                        
                        const dx = p.x - w.x;
                        const dy = p.y - w.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        
                        if (dist <= w.radius && dist >= Math.max(0, w.radius - 60)) {
                            p.hp -= 10;
                            w.pathogensHit.push(p.id);
                            audio.hit();
                            this.spawnSplatterParticles(p.x, p.y, p.color, 8, { gravity: 120, decay: 0.95 });

                            if (p.hp <= 0) {
                                this.kills++;
                                this.killsForComplement++;
                                this.score += Math.ceil(100 * DIFF_CONFIGS[this.selectedDiff].scoreMult);
                                this.screenShake = Math.max(this.screenShake, 3);
                                this.spawnSplatterParticles(p.x, p.y, p.color, 12, { gravity: 160, decay: 0.94, life: 0.9 });
                                this.checkComplementCharges();
                            }
                        }
                    });

                    // Wave vs Shield Nodes
                    if (this.boss && this.boss.isOverlord && this.boss.phase === 1) {
                        this.boss.shieldNodes.forEach(node => {
                            if (node.hp <= 0 || w.pathogensHit.includes('shield_' + node.index)) return;
                            const dx = node.x - w.x;
                            const dy = node.y - w.y;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist <= w.radius && dist >= Math.max(0, w.radius - 60)) {
                                node.hp -= 10;
                                w.pathogensHit.push('shield_' + node.index);
                                audio.hit();
                                this.spawnSplatterParticles(node.x, node.y, '#00f2fe', 8, { gravity: 150, decay: 0.94 });
                                if (node.hp <= 0) {
                                    this.score += 200;
                                    audio.lyse();
                                    this.screenShake = Math.max(this.screenShake, 5);
                                    this.spawnSplatterParticles(node.x, node.y, '#00f2fe', 16, { gravity: 200, decay: 0.92, life: 1.0 });
                                }
                            }
                        });
                    }

                    if (this.boss && !w.bossHit) {
                        const dx = this.boss.x - w.x;
                        const dy = this.boss.y - w.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist <= w.radius && dist >= Math.max(0, w.radius - 60)) {
                            w.bossHit = true;
                            
                            if (this.boss.isOverlord && this.boss.phase === 1) {
                                // Immune: spawns blue shield sparks
                                this.spawnSplatterParticles(this.boss.x, this.boss.y, '#00f2fe', 10, { gravity: 100, decay: 0.94 });
                            } else {
                                this.boss.hp -= 15;
                                audio.hit();
                                const bossColor = this.boss.isOverlord ? '#ff007f' : '#ff00ff';
                                this.spawnSplatterParticles(this.boss.x, this.boss.y, bossColor, 12, { gravity: 180, decay: 0.94 });

                                if (this.boss.hp <= 0) {
                                    const points = this.boss.isOverlord ? 2000 : 1000;
                                    this.score += Math.ceil(points * DIFF_CONFIGS[this.selectedDiff].scoreMult);
                                    // Lyse any remaining minions
                                    this.pathogens.forEach(p => {
                                        this.spawnSplatterParticles(p.x, p.y, p.color, 12, { gravity: 120, decay: 0.95 });
                                    });
                                    this.pathogens = [];
                                    this.boss = null;
                                    audio.lyse();
                                }
                            }
                        }
                    }
                });

                // Clear dead pathogens after wave hit
                this.pathogens = this.pathogens.filter(p => p.hp > 0);

                // 3. Enemy/Player Bullets vs Barriers
                this.bullets.forEach(b => {
                    if (b.y === 9999 || b.y === -9999) return;

                    const prevX = b.x - b.vx * dt;
                    const prevY = b.y - b.vy * dt;

                    this.barriers.forEach(barrier => {
                        // Group active blocks of this barrier by column index
                        const activeByCol = {};
                        barrier.blocks.forEach(block => {
                            if (block.hp > 0) {
                                if (!activeByCol[block.col]) {
                                    activeByCol[block.col] = [];
                                }
                                activeByCol[block.col].push(block);
                            }
                        });

                        // For each column, find the target block (closest to shooter)
                        const targetBlocks = [];
                        Object.keys(activeByCol).forEach(col => {
                            const blocks = activeByCol[col];
                            if (blocks.length > 0) {
                                if (b.isEnemy) {
                                    // Pathogen bullet (downwards): targets the top-most block (lowest row index)
                                    let target = blocks[0];
                                    blocks.forEach(bk => {
                                        if (bk.row < target.row) target = bk;
                                    });
                                    targetBlocks.push(target);
                                } else {
                                    // Player bullet (upwards): targets the bottom-most block (highest row index)
                                    let target = blocks[0];
                                    blocks.forEach(bk => {
                                        if (bk.row > target.row) target = bk;
                                    });
                                    targetBlocks.push(target);
                                }
                            }
                        });

                        // Check collisions only against target blocks using swept-volume segment check
                        targetBlocks.forEach(block => {
                            if (b.y === 9999 || b.y === -9999) return;

                            const cx = block.x + block.size / 2;
                            const cy = block.y + block.size / 2;
                            const dist = distToSegment(cx, cy, prevX, prevY, b.x, b.y);
                            const collRadius = b.size + block.size / 2;

                            if (dist < collRadius) {
                                block.hp--;
                                b.y = b.isEnemy ? 9999 : -9999; // destroy bullet
                            }
                        });
                    });
                });

                // 4. Enemy Bullets vs Player
                this.bullets.forEach(b => {
                    if (!b.isEnemy) return;

                    const prevX = b.x - b.vx * dt;
                    const prevY = b.y - b.vy * dt;

                    const dist = distToSegment(this.player.x, this.player.y, prevX, prevY, b.x, b.y);
                    if (dist < b.size + this.player.size) {
                        b.y = 9999; // destroy bullet
                        this.damagePlayer();
                    }
                });

                // 5. Enemy body contact vs Player/Barriers
                this.pathogens.forEach(p => {
                    // Check barriers contact
                    this.barriers.forEach(barrier => {
                        barrier.blocks.forEach(block => {
                            if (block.hp <= 0) return;
                            const dx = p.x - (block.x + block.size/2);
                            const dy = p.y - (block.y + block.size/2);
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < p.size + block.size/2) {
                                block.hp = 0; // destroy block instantly
                            }
                        });
                    });

                    // Check player contact
                    const dx = p.x - this.player.x;
                    const dy = p.y - this.player.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < p.size + this.player.size) {
                        this.damagePlayer();
                        p.hp = 0; // Destroy pathogen on impact
                        audio.lyse();
                    }
                });

                // Boss contact vs Player
                if (this.boss) {
                    const dx = this.boss.x - this.player.x;
                    const dy = this.boss.y - this.player.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < this.boss.size + this.player.size) {
                        this.damagePlayer();
                    }
                }

                // 6. Player contact with Power-ups
                this.powerUps.forEach(pu => {
                    const dx = pu.x - this.player.x;
                    const dy = pu.y - this.player.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < pu.size + this.player.size) {
                        pu.y = 9999; // destroy powerup
                        this.collectPowerUp(pu);
                    }
                });
            }

            damagePlayer() {
                if (this.player.invincibilityTimer > 0) return;

                this.player.lives--;
                this.player.invincibilityTimer = 2.0; // 2 seconds invincibility
                this.screenShake = 15;
                this.blinkTimer = 0.55;
                audio.playerHit();

                if (this.player.lives <= 0) {
                    this.state = 'GAME_OVER';
                    audio.gameOver();
                    this.saveLeaderboard();
                }
            }

            collectPowerUp(pu) {
                audio.powerup();
                if (pu.type === 'P') {
                    // Plasma cell (+1 life, auto-applied)
                    if (this.player.lives < this.player.maxLives) {
                        this.player.lives++;
                    }
                    this.spawnSplatterParticles(this.player.x, this.player.y, '#39ff14', 15);
                } else {
                    // Add to inventories
                    this.inventory[pu.type]++;
                }
            }

            checkPowerUpDrop(x, y) {
                if (Math.random() < 0.05) {
                    const rand = Math.random();
                    let type = 'P'; // Default Plasma
                    if (rand < 0.25) type = 'T';
                    else if (rand < 0.50) type = 'M';
                    else if (rand < 0.75) type = 'C';
                    
                    this.powerUps.push(new PowerUp(x, y, type));
                }
            }

            checkStageCompletion() {
                // Check breach conditions: pathogens reach defensive Y level 810
                const breached = this.pathogens.some(p => p.y >= 810);
                if (breached) {
                    this.state = 'GAME_OVER';
                    audio.gameOver();
                    this.saveLeaderboard();
                    return;
                }

                // Stage clear condition
                if (this.pathogens.length === 0 && !this.boss && this.state === 'PLAYING') {
                    this.state = 'STAGE_CLEAR';
                    this.stageClearTimer = 2.0; // 2s clear transition delay
                }
            }

            // --- DRAWINGS ---
            drawPlaying() {
                // 1. Draw organic microscopic background grid cells
                this.ctx.fillStyle = '#020207';
                this.ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                this.drawGridGrid();

                // Draw background drifters under blur filter
                if (this.bgDrifters) {
                    this.ctx.save();
                    this.ctx.filter = 'blur(4px)';
                    this.bgDrifters.forEach(d => {
                        this.ctx.save();
                        this.ctx.globalAlpha = d.opacity;
                        this.ctx.fillStyle = d.color;
                        this.ctx.translate(d.x, d.y);
                        
                        if (d.type === 'rbc') {
                            this.ctx.beginPath();
                            this.ctx.arc(0, 0, d.size, 0, Math.PI * 2);
                            this.ctx.fill();
                            this.ctx.fillStyle = '#020207';
                            this.ctx.beginPath();
                            this.ctx.arc(0, 0, d.size * 0.45, 0, Math.PI * 2);
                            this.ctx.fill();
                        } else if (d.type === 'platelet') {
                            this.ctx.beginPath();
                            const lobes = 6;
                            const step = Math.PI / lobes;
                            const pulse = 1.0 + 0.1 * Math.sin(d.pulsePhase);
                            const rOuter = d.size * pulse;
                            const rInner = d.size * 0.5 * pulse;
                            const iterations = Array.from({ length: lobes * 2 });
                            iterations.forEach((_, stepIdx) => {
                                const currentAngle = stepIdx * step;
                                const r = stepIdx % 2 === 0 ? rOuter : rInner;
                                const px = Math.cos(currentAngle) * r;
                                const py = Math.sin(currentAngle) * r;
                                if (stepIdx === 0) this.ctx.moveTo(px, py);
                                else this.ctx.lineTo(px, py);
                            });
                            this.ctx.closePath();
                            this.ctx.fill();
                        } else if (d.type === 'virus') {
                            const spikes = 8;
                            const spikeAngle = (Math.PI * 2) / spikes;
                            const pulse = 1.0 + 0.1 * Math.sin(d.pulsePhase);
                            const baseRadius = d.size * 0.6 * pulse;
                            
                            this.ctx.beginPath();
                            this.ctx.arc(0, 0, baseRadius, 0, Math.PI * 2);
                            this.ctx.fill();
                            
                            const spikeList = Array.from({ length: spikes });
                            spikeList.forEach((_, spikeIdx) => {
                                const currentAngle = spikeIdx * spikeAngle;
                                const sx = Math.cos(currentAngle) * baseRadius * 1.5;
                                const sy = Math.sin(currentAngle) * baseRadius * 1.5;
                                this.ctx.beginPath();
                                this.ctx.strokeStyle = d.color;
                                this.ctx.lineWidth = d.size * 0.15;
                                this.ctx.moveTo(0, 0);
                                this.ctx.lineTo(sx, sy);
                                this.ctx.stroke();
                                
                                this.ctx.beginPath();
                                this.ctx.arc(sx, sy, d.size * 0.25, 0, Math.PI * 2);
                                this.ctx.fill();
                            });
                        } else if (d.type === 'bacteria') {
                            this.ctx.rotate(d.pulsePhase * 0.2);
                            this.ctx.beginPath();
                            this.ctx.roundRect(-d.size * 1.2, -d.size * 0.5, d.size * 2.4, d.size, d.size * 0.5);
                            this.ctx.fill();
                        } else if (d.type === 'fungi') {
                            this.ctx.beginPath();
                            this.ctx.arc(0, 0, d.size * 0.4, 0, Math.PI * 2);
                            this.ctx.fill();
                            
                            this.ctx.strokeStyle = d.color;
                            this.ctx.lineWidth = d.size * 0.12;
                            const branches = 3;
                            const branchList = Array.from({ length: branches });
                            branchList.forEach((_, branchIdx) => {
                                const baseAngle = (branchIdx * Math.PI * 2) / branches + d.pulsePhase * 0.1;
                                this.ctx.beginPath();
                                this.ctx.moveTo(0, 0);
                                const x1 = Math.cos(baseAngle) * d.size * 0.8;
                                const y1 = Math.sin(baseAngle) * d.size * 0.8;
                                this.ctx.lineTo(x1, y1);
                                
                                const x2a = x1 + Math.cos(baseAngle - 0.4) * d.size * 0.5;
                                const y2a = y1 + Math.sin(baseAngle - 0.4) * d.size * 0.5;
                                this.ctx.lineTo(x2a, y2a);
                                this.ctx.moveTo(x1, y1);
                                const x2b = x1 + Math.cos(baseAngle + 0.4) * d.size * 0.5;
                                const y2b = y1 + Math.sin(baseAngle + 0.4) * d.size * 0.5;
                                this.ctx.lineTo(x2b, y2b);
                                this.ctx.stroke();
                            });
                        }
                        this.ctx.restore();
                    });
                    this.ctx.restore();
                }

                // 2. Draw organic barriers
                this.barriers.forEach(b => b.draw(this.ctx));

                // 3. Draw pathogens
                this.pathogens.forEach(p => p.draw(this.ctx));

                // 4. Draw boss if exists
                if (this.boss) {
                    this.boss.draw(this.ctx);
                    if (this.bossWarningTimer > 0) {
                        this.drawBossWarning();
                    }
                    this.drawBossHpBar();
                }

                // 5. Draw powerups
                this.powerUps.forEach(pu => pu.draw(this.ctx));

                // 6. Draw player
                this.player.draw(this.ctx);

                // 7. Draw bullets
                this.bullets.forEach(b => b.draw(this.ctx));

                // 8. Draw waves
                this.waves.forEach(w => w.draw(this.ctx));

                // 9. Draw particles
                this.particles.forEach(p => p.draw(this.ctx));

                // Draw enraged overlord transition banner
                if (this.boss && this.boss.isOverlord && this.boss.enrageBannerTimer > 0) {
                    this.ctx.save();
                    this.ctx.textAlign = 'center';
                    this.ctx.fillStyle = '#ff007f';
                    this.ctx.shadowBlur = 15;
                    this.ctx.shadowColor = '#ff007f';
                    this.ctx.font = '900 36px Orbitron';
                    this.ctx.fillText('SHIELD COLLAPSED - OVERLORD ENRAGED!', CANVAS_WIDTH / 2, 360);
                    
                    this.ctx.font = '600 16px Outfit';
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.fillText('SPEED INCREASED | RAPID HOMING BULLETS ACTIVATED', CANVAS_WIDTH / 2, 400);
                    this.ctx.restore();
                }

                // Draw life-loss blink overlay
                if (this.blinkTimer > 0) {
                    const ratio = this.blinkTimer / 0.55;
                    const alpha = Math.sin(ratio * Math.PI) * 0.2;
                    this.ctx.save();
                    this.ctx.fillStyle = `rgba(220, 30, 30, ${alpha})`;
                    this.ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                    this.ctx.restore();
                }

                // 10. Draw UI panels
                this.drawHUD();
                this.drawBottomControlPanel();
            }

            drawGridGrid() {
                this.ctx.save();
                
                // Secondary finer grid (50px spacing)
                this.ctx.strokeStyle = 'rgba(0, 242, 254, 0.08)';
                this.ctx.lineWidth = 1;
                this.ctx.setLineDash([2, 24]);
                
                const gridSpacingSecondary = 50;
                const iterationsX2 = Array.from({ length: Math.ceil(CANVAS_WIDTH / gridSpacingSecondary) });
                iterationsX2.forEach((_, i) => {
                    const x = i * gridSpacingSecondary;
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, CANVAS_HEIGHT);
                    this.ctx.stroke();
                });
                const iterationsY2 = Array.from({ length: Math.ceil(CANVAS_HEIGHT / gridSpacingSecondary) });
                iterationsY2.forEach((_, j) => {
                    const y = j * gridSpacingSecondary;
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(CANVAS_WIDTH, y);
                    this.ctx.stroke();
                });

                // Primary grid (100px spacing)
                this.ctx.strokeStyle = 'rgba(0, 242, 254, 0.22)';
                this.ctx.lineWidth = 1;
                this.ctx.setLineDash([3, 15]);

                const gridSpacingPrimary = 100;
                const iterationsX1 = Array.from({ length: Math.ceil(CANVAS_WIDTH / gridSpacingPrimary) });
                iterationsX1.forEach((_, i) => {
                    const x = i * gridSpacingPrimary;
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, CANVAS_HEIGHT);
                    this.ctx.stroke();
                });
                const iterationsY1 = Array.from({ length: Math.ceil(CANVAS_HEIGHT / gridSpacingPrimary) });
                iterationsY1.forEach((_, j) => {
                    const y = j * gridSpacingPrimary;
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(CANVAS_WIDTH, y);
                    this.ctx.stroke();
                });
                
                this.ctx.restore();
            }

            drawBossHpBar() {
                if (!this.boss) return;
                const barWidth = 600;
                const barHeight = 14;
                const bx = (CANVAS_WIDTH - barWidth) / 2;
                const by = 110;

                const isOverlord = !!this.boss.isOverlord;
                const strokeColor = isOverlord ? (this.boss.phase === 1 ? 'rgba(0, 242, 254, 0.6)' : 'rgba(255, 0, 127, 0.6)') : 'rgba(255, 0, 255, 0.4)';
                const fillColor = isOverlord ? (this.boss.phase === 1 ? '#00f2fe' : '#ff007f') : '#ff00ff';
                const labelText = isOverlord 
                    ? `BIOCARRIER OVERLORD HP: ${this.boss.hp} / ${this.boss.maxHp}` 
                    : `MUTAGEN CELL HOSTILE HP: ${this.boss.hp} / ${this.boss.maxHp}`;

                this.ctx.save();
                
                // Draw HP bar frame
                this.ctx.fillStyle = 'rgba(10, 10, 25, 0.8)';
                this.ctx.strokeStyle = strokeColor;
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.roundRect(bx, by, barWidth, barHeight, 4);
                this.ctx.fill();
                this.ctx.stroke();

                // Draw segmented fill in thirds
                const fillRatio = Math.max(0, this.boss.hp / this.boss.maxHp);
                const thirdRatio = 1 / 3;
                
                const fills = Array.from({ length: 3 });
                fills.forEach((_, i) => {
                    const startRatio = i * thirdRatio;
                    if (fillRatio > startRatio) {
                        const currentSegmentFill = Math.min(thirdRatio, fillRatio - startRatio);
                        const segmentW = currentSegmentFill * barWidth;
                        const segmentX = bx + startRatio * barWidth;
                        
                        this.ctx.fillStyle = fillColor;
                        if (fillRatio < 0.34) this.ctx.fillStyle = '#ff3333'; // Low HP warning color
                        
                        this.ctx.beginPath();
                        this.ctx.rect(segmentX + 1, by + 1.5, segmentW - 2, barHeight - 3);
                        this.ctx.fill();
                    }
                });

                // Label
                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = '800 10px Orbitron';
                this.ctx.fillText(labelText, CANVAS_WIDTH / 2, by - 8);

                this.ctx.restore();
            }

             drawLineageSelector() {
                this.clickRegions = [];

                this.drawGridGrid();

                this.ctx.textAlign = 'center';
