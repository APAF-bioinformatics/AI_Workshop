<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immunity Protocol - Pathogen Codex</title>
    <meta name="description" content="An interactive database of biological pathogens, sizing, and game behaviors for the Immunity Protocol project.">
    <!-- Google Fonts: Outfit & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* CSS Custom Properties & Reset */
        :root {
            --bg-dark: #06060c;
            --bg-grid: rgba(0, 243, 255, 0.03);
            --bg-card: rgba(18, 18, 35, 0.65);
            --bg-modal: rgba(12, 12, 24, 0.95);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f2f5;
            --text-secondary: #9aa0a6;
            
            /* Neon Accent Colors */
            --accent-cyan: #00f3ff;
            --accent-magenta: #ff00ff;
            --accent-green: #39ff14;
            --accent-amber: #ffaa00;
            --accent-purple: #7209b7;
            
            /* Taxonomy Theme Colors */
            --color-virus: #ff3333;
            --color-bacteria: #39ff14;
            --color-archaea: #ff00ff;
            --color-fungi: #b388ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(to right, var(--bg-grid) 1px, transparent 1px),
                linear-gradient(to bottom, var(--bg-grid) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* Scrollbar customization */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 10, 20, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 243, 255, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-cyan);
        }

        /* Layout Container */
        .container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* Header Styles */
        header {
            margin-bottom: 2.5rem;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.05rem;
            background: linear-gradient(135deg, #fff 30%, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 1.5rem;
        }

        /* Control Panel (Search, Filters, Sort) */
        .controls {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            min-width: 280px;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: rgba(10, 10, 20, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.25);
        }

        .search-box svg {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            width: 1.1rem;
            height: 1.1rem;
            fill: var(--text-secondary);
            pointer-events: none;
        }

        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.6rem 1.1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .filter-btn.active[data-type="all"] { border-color: var(--text-primary); color: #fff; background: rgba(255,255,255,0.1); }
        .filter-btn.active[data-type="Virus"] { border-color: var(--color-virus); color: var(--color-virus); background: rgba(255, 51, 51, 0.1); }
        .filter-btn.active[data-type="Bacteria"] { border-color: var(--color-bacteria); color: var(--color-bacteria); background: rgba(57, 255, 20, 0.1); }
        .filter-btn.active[data-type="Archaea"] { border-color: var(--color-archaea); color: var(--color-archaea); background: rgba(255, 0, 255, 0.1); }
        .filter-btn.active[data-type="Fungi"] { border-color: var(--color-fungi); color: var(--color-fungi); background: rgba(179, 136, 255, 0.1); }

        .sort-select {
            padding: 0.6rem 1.1rem;
            background: rgba(10, 10, 20, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .sort-select:focus {
            border-color: var(--accent-cyan);
        }

        /* Grid Layout */
        .codex-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        /* Card Styles */
        .pathogen-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .pathogen-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--accent-color, var(--text-secondary));
            opacity: 0.8;
        }

        .pathogen-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-color, var(--accent-cyan));
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(var(--accent-color-rgb, 0, 243, 255), 0.15);
        }

        .canvas-container {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            position: relative;
        }

        .canvas-container canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .pathogen-type {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08rem;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-color, var(--text-secondary));
        }

        .pathogen-name {
            font-size: 1.35rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.25rem;
            color: #fff;
        }

        .pathogen-sci {
            font-size: 0.85rem;
            font-style: italic;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            text-align: center;
        }

        /* Stats Bar inside Card */
        .card-stats {
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 0.85rem;
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04rem;
            margin-bottom: 0.15rem;
        }

        .stat-value {
            font-weight: 700;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Detailed Overlay / Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 1.5rem;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-modal);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 243, 255, 0.08);
            display: flex;
            flex-direction: column;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.2s ease;
            z-index: 10;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 2.5rem;
            display: grid;
            grid-template-columns: 1.2fr 1.8fr;
            gap: 2.5rem;
        }

        @media (max-width: 768px) {
            .modal-body {
                grid-template-columns: 1fr;
                padding: 1.5rem;
                gap: 1.5rem;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
        }

        /* Large Interactive Panel */
        .visualizer-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 1.5rem;
            justify-content: center;
            position: relative;
        }

        .detail-canvas-container {
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.02) 0%, transparent 70%);
        }

        .detail-canvas-container canvas {
            width: 100%;
            height: 100%;
        }

        /* Interactive Buttons */
        .interactive-buttons {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .action-btn {
            flex-grow: 1;
            padding: 0.65rem 0.85rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.04rem;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .action-btn.damage-btn:hover {
            background: rgba(255, 51, 51, 0.15);
            border-color: #ff3333;
            color: #ff3333;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.15);
        }

        .action-btn.lysis-btn:hover {
            background: rgba(255, 0, 255, 0.15);
            border-color: #ff00ff;
            color: #ff00ff;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.15);
        }



        /* Data Details Column */
        .details-column {
            display: flex;
            flex-direction: column;
        }

        .detail-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 1rem;
            margin-bottom: 1.25rem;
        }

        .detail-sci-name {
            font-size: 1rem;
            font-style: italic;
            color: var(--text-secondary);
            margin-top: 0.15rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .detail-stat {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }

        .detail-stat-val {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-top: 0.15rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .threat-stars {
            color: var(--accent-color, var(--accent-cyan));
            letter-spacing: 0.1rem;
        }

        .detail-description {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .game-log-panel {
            background: rgba(10, 10, 20, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .game-log-title {
            color: var(--accent-color, var(--accent-cyan));
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.08rem;
        }

        .game-log-text {
            color: var(--text-primary);
            line-height: 1.5;
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border-color);
            padding: 1.5rem 0;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: auto;
        }

        footer p {
            margin-bottom: 0.25rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>PATHOGEN CODEX</h1>
        <p class="subtitle">Immunity Protocol Interactive Visual Database. Browse single-cell pathogens and viruses, inspect rendering shapes, and simulate gameplay behaviors.</p>
    </header>

    <div class="controls">
        <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="Search pathogen name, shape, size or properties...">
        </div>
        <div class="filter-tabs" id="filterTabs">
            <button class="filter-btn active" data-type="all">All</button>
            <button class="filter-btn" data-type="Virus">Viruses</button>
            <button class="filter-btn" data-type="Bacteria">Bacteria</button>
            <button class="filter-btn" data-type="Archaea">Archaea</button>
            <button class="filter-btn" data-type="Fungi">Fungi</button>
        </div>
        <select class="sort-select" id="sortSelect">
            <option value="default">Default Sort</option>
            <option value="name-asc">Name (A-Z)</option>
            <option value="size-asc">Visual Size (Smallest)</option>
            <option value="size-desc">Visual Size (Largest)</option>
            <option value="hp-desc">Threat (Highest HP)</option>
        </select>
    </div>

    <main class="codex-grid" id="codexGrid">
        <!-- Cards injected dynamically via JS -->
    </main>
</div>

<!-- Modal Overlay -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <button class="close-btn" id="modalClose">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <div class="modal-body" id="modalBody">
            <!-- Details injected dynamically via JS -->
        </div>
    </div>
</div>

<footer>
    <div class="container" style="padding: 0;">
        <p>© 2026 Immunity Protocol Development Team.</p>
        <p>APAF Bioinformatics | pathogen_showcase.html | Approved | 2026-06-14</p>
    </div>
</footer>

<script>
    // --- PATHOGEN DATASET ---
    const PATHOGENS = [
        // --- VIRUSES ---
        {
            id: "parvovirus",
            name: "Parvovirus",
            scientific: "Canine Parvovirus",
            type: "Virus",
            shape: "Icosahedral",
            sizeReal: "18 - 26 nm",
            sizeDraw: 14,
            hp: 1,
            threat: 1,
            color: "#9d4edd",
            colorRgb: "157, 78, 237",
            desc: "One of the smallest known non-enveloped DNA viruses, possessing an extremely compact icosahedral capsid geometry.",
            behavior: "High-frequency micro-vibration. Low health pools (1 HP) makes it susceptible to rapid lysis. In-game, it fires needle-thin purple bullets in fast swarms.",
            draw: (ctx, cx, cy, size, pulse, hitFlash) => {
                ctx.save();
                ctx.translate(cx + Math.sin(pulse * 24) * 1.5, cy + Math.cos(pulse * 24) * 1.5);
                ctx.strokeStyle = hitFlash ? '#ffffff' : '#9d4edd';
                ctx.fillStyle = 'rgba(157, 78, 237, 0.15)';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                Array.from({ length: 6 }).forEach((_, i) => {
                    const angle = (i / 6) * Math.PI * 2 + pulse * 0.1;
                    const px = Math.cos(angle) * size;
                    const py = Math.sin(angle) * size;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = hitFlash ? '#ffffff' : '#c77dff';
                ctx.beginPath();
                ctx.arc(0, 0, size * 0.35, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        },
        {
            id: "poliovirus",
            name: "Poliovirus",
            scientific: "Enterovirus C (Poliovirus)",
            type: "Virus",
            shape: "Icosahedral",
            sizeReal: "30 nm",
            sizeDraw: 16,
            hp: 1,
            threat: 1,
            color: "#ff007f",
            colorRgb: "255, 0, 127",
            desc: "A small, non-enveloped positive-sense single-stranded RNA virus. Captures a clean, symmetrically packed icosahedron.",
            behavior: "Pulsates rapidly with high-frequency expansions and contractions. Moves in quick, sudden horizontal dashes in the grid, firing simple spherical rounds.",
            draw: (ctx, cx, cy, size, pulse, hitFlash) => {
                ctx.save();
                const scale = 1.0 + Math.sin(pulse * 8) * 0.08;
                ctx.translate(cx, cy);
                ctx.scale(scale, scale);
                ctx.strokeStyle = hitFlash ? '#ffffff' : '#ff007f';
                ctx.fillStyle = 'rgba(255, 0, 127, 0.12)';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                Array.from({ length: 12 }).forEach((_, i) => {
                    const angle = (i / 12) * Math.PI * 2;
                    const px = Math.cos(angle) * size;
                    const py = Math.sin(angle) * size;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = hitFlash ? '#ffffff' : 'rgba(255, 0, 127, 0.4)';
                ctx.beginPath();
                Array.from({ length: 6 }).forEach((_, i) => {
                    const angle = (i / 6) * Math.PI * 2 + Math.PI/6;
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(angle) * size, Math.sin(angle) * size);
                });
                ctx.stroke();
                ctx.restore();
            }
        },
        {
            id: "adenovirus",
            name: "Adenovirus",
            scientific: "Human Adenovirus C",
            type: "Virus",
            shape: "Icosahedral with protruding fibers",
            sizeReal: "70 - 90 nm",
            sizeDraw: 19,
            hp: 2,
            threat: 2,
            color: "#00f0ff",
            colorRgb: "0, 240, 255",
            desc: "Medium-sized non-enveloped dsDNA virus containing structural penton bases that extend long, thin protein fibers.",
            behavior: "Fiber spikes rotate slowly clockwise around the central body. Possesses moderate durability (2 HP) and shoots high-velocity cyan plasma rings.",
            draw: (ctx, cx, cy, size, pulse, hitFlash) => {
                ctx.save();
                ctx.translate(cx, cy);
                const rot = pulse * 0.4;
                
                // Draw fibers
                ctx.strokeStyle = hitFlash ? '#ffffff' : 'rgba(0, 240, 255, 0.6)';
                ctx.lineWidth = 2;
                Array.from({ length: 12 }).forEach((_, i) => {
                    const angle = (i / 12) * Math.PI * 2 + rot;
                    const fLen = size * 1.5 + Math.sin(pulse * 6 + i) * 2;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(angle) * fLen, Math.sin(angle) * fLen);
                    ctx.stroke();
                    
                    // Knob tips
                    ctx.beginPath();
                    ctx.arc(Math.cos(angle) * fLen, Math.sin(angle) * fLen, 3, 0, Math.PI * 2);
                    ctx.fillStyle = hitFlash ? '#ffffff' : '#00f0ff';
                    ctx.fill();
                });

                // Core icosahedron
                ctx.strokeStyle = hitFlash ? '#ffffff' : '#00f0ff';
                ctx.fillStyle = 'rgba(0, 240, 255, 0.2)';
                ctx.lineWidth = 2.5;

    // --- PROCEDURAL AUDIO MANAGER (WEB AUDIO) ---
    class WebAudioManager {
        constructor() {
            this.ctx = null;
        }

        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        playClick() {
            this.init();
            if (!this.ctx || this.ctx.state === 'suspended') return;
            
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(150, now + 0.04);
            
            gain.gain.setValueAtTime(0.04, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            
            osc.start();
            osc.stop(now + 0.05);
        }

        playSwell() {
            this.init();
            if (!this.ctx || this.ctx.state === 'suspended') return;

            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.22);

            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.25);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start();
            osc.stop(now + 0.25);
        }

        playExplode() {
            this.init();
            if (!this.ctx || this.ctx.state === 'suspended') return;

            const now = this.ctx.currentTime;
            
            // Rumble low-frequency
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.linearRampToValueAtTime(20, now + 0.4);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(now + 0.45);

            // Noise burst (white noise)
            const bufferSize = this.ctx.sampleRate * 0.35;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            Array.from({ length: bufferSize }).forEach((_, i) => {
                data[i] = Math.random() * 2 - 1;
            });

            const noiseNode = this.ctx.createBufferSource();
            noiseNode.buffer = buffer;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(400, now);

            const noiseGain = this.ctx.createGain();
            noiseGain.gain.setValueAtTime(0.18, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

            noiseNode.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(this.ctx.destination);

            noiseNode.start();
            noiseNode.stop(now + 0.35);
        }


    }

    const audio = new WebAudioManager();

    // --- ANIMATION ENGINE ---
    class AnimationEngine {
        constructor() {
            this.activeDrawers = []; // list of objects: { canvasId, pathogenId, ctx, cx, cy, hitFlash, size }
            this.lastTime = 0;
            this.pulse = 0;
            this.particles = []; // particles for lysis effects
            
            this.loop = this.loop.bind(this);
            requestAnimationFrame(this.loop);
        }

        addDrawer(canvas, pathogen, isLarge = false) {
            const ctx = canvas.getContext('2d');
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const drawScale = isLarge ? 2.5 : 1.0;
            
            // Remove existing duplicate canvas
            this.activeDrawers = this.activeDrawers.filter(d => d.canvas !== canvas);
            
            this.activeDrawers.push({
                canvas,
                ctx,
                cx,
                cy,
                pathogen,
                size: pathogen.sizeDraw * drawScale,
                hitFlash: 0,
                lysed: false
            });
        }

        removeDrawer(canvas) {
            this.activeDrawers = this.activeDrawers.filter(d => d.canvas !== canvas);
        }

        triggerHit(canvas) {
            const drawer = this.activeDrawers.find(d => d.canvas === canvas);
            if (drawer) {
                drawer.hitFlash = 0.12; // seconds flash duration
            }
        }



        triggerLysis(canvas) {
            const drawer = this.activeDrawers.find(d => d.canvas === canvas);
            if (drawer && !drawer.lysed) {
                drawer.lysed = true;
                
                // Spawn particles
                const count = drawer.pathogen.threat * 10 + 20;
                Array.from({ length: count }).forEach(() => {
                    this.particles.push({
                        x: drawer.cx + (Math.random() * 20 - 10),
                        y: drawer.cy + (Math.random() * 20 - 10),
                        vx: (Math.random() * 140 - 70),
                        vy: (Math.random() * 140 - 70),
                        life: 0.8 + Math.random() * 0.4,
                        maxLife: 1.2,
                        color: drawer.pathogen.color,
                        ctx: drawer.ctx,
                        canvas: drawer.canvas
                    });
                });
            }
        }

        restoreLysis(canvas) {
            const drawer = this.activeDrawers.find(d => d.canvas === canvas);
            if (drawer) {
                drawer.lysed = false;
            }
        }

        loop(time) {
            if (!this.lastTime) this.lastTime = time;
            const dt = (time - this.lastTime) / 1000.0;
            this.lastTime = time;
            
            this.pulse += dt;

            // Render active drawers
            this.activeDrawers.forEach(d => {
                const ctx = d.ctx;
                ctx.clearRect(0, 0, d.canvas.width, d.canvas.height);

                if (d.lysed) {
                    // Draw nothing of the base cell, particles will render
                    return;
                }

                // Render cell
                d.pathogen.draw(ctx, d.cx, d.cy, d.size, this.pulse, d.hitFlash > 0);

                // Flash animations timer
                if (d.hitFlash > 0) {
                    d.hitFlash -= dt;
                }


            });

            // Update & Render Particles
            this.particles = this.particles.filter(p => {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vx *= Math.exp(-1.5 * dt); // dampening
                p.vy *= Math.exp(-1.5 * dt);
                p.life -= dt;

                const opacity = p.life / p.maxLife;
                const ctx = p.ctx;
                
                ctx.save();
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.globalAlpha = Math.max(0, opacity);
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                return p.life > 0;
            });

            requestAnimationFrame(this.loop);
        }
    }

    const engine = new AnimationEngine();

    // --- DOM CONTROLLER ---
    const codexGrid = document.getElementById('codexGrid');
    const searchInput = document.getElementById('searchInput');
    const filterTabs = document.getElementById('filterTabs');
    const sortSelect = document.getElementById('sortSelect');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    const modalBody = document.getElementById('modalBody');

    let currentFilter = 'all';
    let currentSearch = '';
    let currentSort = 'default';

    // Renders list of pathogen cards
    function renderCodex() {
        // Clear previous canvas connections to engine
        const canvases = codexGrid.querySelectorAll('canvas');
        canvases.forEach(canvas => engine.removeDrawer(canvas));

        // Filter and sort the array
        let list = PATHOGENS.filter(p => {
            const matchesType = (currentFilter === 'all' || p.type === currentFilter);
            const matchesSearch = (
                p.name.toLowerCase().includes(currentSearch) ||
                p.scientific.toLowerCase().includes(currentSearch) ||
                p.shape.toLowerCase().includes(currentSearch) ||
                p.desc.toLowerCase().includes(currentSearch)
            );
            return matchesType && matchesSearch;
        });

        if (currentSort === 'name-asc') {
            list.sort((a, b) => a.name.localeCompare(b.name));
        } else if (currentSort === 'size-asc') {
            list.sort((a, b) => a.sizeDraw - b.sizeDraw);
        } else if (currentSort === 'size-desc') {
            list.sort((a, b) => b.sizeDraw - a.sizeDraw);
        } else if (currentSort === 'hp-desc') {
            list.sort((a, b) => b.hp - a.hp);
        }

        codexGrid.innerHTML = '';

        if (list.length === 0) {
            codexGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 4rem 0;">No pathogens matched your criteria.</div>`;
            return;
        }

        list.forEach(p => {
            const card = document.createElement('div');
            card.className = 'pathogen-card';
            card.style.setProperty('--accent-color', p.color);
            card.style.setProperty('--accent-color-rgb', p.colorRgb);
            card.setAttribute('data-id', p.id);
            
            card.innerHTML = `
                <div class="canvas-container">
                    <canvas id="canvas-${p.id}" width="160" height="160"></canvas>
                </div>
                <div class="pathogen-type" style="color: ${p.color};">${p.type}</div>
                <div class="pathogen-name">${p.name}</div>
                <div class="pathogen-sci">${p.scientific}</div>
                <div class="card-stats">
                    <div class="stat-item">
                        <span class="stat-label">Visual Size</span>
                        <span class="stat-value">${p.sizeDraw}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">HP</span>
                        <span class="stat-value">${p.hp}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Threat</span>
                        <span class="stat-value text-glow" style="color: ${p.color};">${'★'.repeat(p.threat)}</span>
                    </div>
                </div>
            `;

            card.addEventListener('mouseenter', () => audio.playClick());
            card.addEventListener('click', () => openModal(p));
            codexGrid.appendChild(card);

            // Bind to animation engine
            const canvasNode = document.getElementById(`canvas-${p.id}`);
            engine.addDrawer(canvasNode, p, false);
        });
    }

    // Modal Manager
    function openModal(p) {
        audio.playSwell();
        modalOverlay.classList.add('active');
        
        modalBody.innerHTML = `
            <div class="visualizer-column">
                <div class="detail-canvas-container">
                    <canvas id="detail-canvas" width="280" height="280"></canvas>
                </div>
                <div class="interactive-buttons">
                    <button class="action-btn damage-btn" id="btn-hit">Stimulate Hit</button>
                    <button class="action-btn lysis-btn" id="btn-lysis">Lysis (Burst)</button>
                </div>
            </div>
            <div class="details-column">
                <div class="detail-header">
                    <div class="pathogen-type" style="display: inline-block; color: ${p.color};">${p.type}</div>
                    <h2 style="font-size: 2.2rem; font-weight: 800; color: #fff; margin-top: 0.25rem;">${p.name}</h2>
                    <div class="detail-sci-name">${p.scientific}</div>
                </div>

                <div class="stats-grid">
                    <div class="detail-stat">
                        <div class="stat-label">Real Dimensions</div>
                        <div class="detail-stat-val">${p.sizeReal}</div>
                    </div>
                    <div class="detail-stat">
                        <div class="stat-label">Physical Shape</div>
                        <div class="detail-stat-val">${p.shape}</div>
                    </div>
                    <div class="detail-stat">
                        <div class="stat-label">In-Game Scale / HP</div>
                        <div class="detail-stat-val">${p.sizeDraw} Scale &nbsp;&nbsp;|&nbsp;&nbsp; ${p.hp} HP</div>
                    </div>
                    <div class="detail-stat">
                        <div class="stat-label">Threat Evaluation</div>
                        <div class="detail-stat-val threat-stars" style="color: ${p.color};">${'★'.repeat(p.threat)}</div>
                    </div>
                </div>

                <p class="detail-description">${p.desc}</p>

                <div class="game-log-panel">
                    <div class="game-log-title" style="color: ${p.color};">In-Game Mechanics Log</div>
                    <div class="game-log-text">${p.behavior}</div>
                </div>
            </div>
        `;

        const detailCanvas = document.getElementById('detail-canvas');
        engine.addDrawer(detailCanvas, p, true);

        // Bind interactive elements inside modal
        document.getElementById('btn-hit').addEventListener('click', () => {
            audio.playClick();
            engine.triggerHit(detailCanvas);
        });

        const lysisBtn = document.getElementById('btn-lysis');
        lysisBtn.addEventListener('click', () => {
            if (lysisBtn.disabled) return;
            audio.playExplode();
            engine.triggerLysis(detailCanvas);
            
            // 0.5s Cooldown & Auto-Regenerate
            lysisBtn.disabled = true;
            lysisBtn.textContent = 'Lysing...';
            lysisBtn.style.opacity = '0.5';
            lysisBtn.style.cursor = 'not-allowed';
            
            setTimeout(() => {
                engine.restoreLysis(detailCanvas);
                lysisBtn.disabled = false;
                lysisBtn.textContent = 'Lysis (Burst)';
                lysisBtn.style.opacity = '';
                lysisBtn.style.cursor = '';
            }, 500);
        });
    }

    function closeModal() {
        modalOverlay.classList.remove('active');
        const detailCanvas = document.getElementById('detail-canvas');
        if (detailCanvas) {
            engine.removeDrawer(detailCanvas);
        }
    }

    // --- BIND EVENTS ---
    searchInput.addEventListener('input', (e) => {
        currentSearch = e.target.value.toLowerCase().trim();
        renderCodex();
    });

    filterTabs.addEventListener('click', (e) => {
        if (e.target.classList.contains('filter-btn')) {
            const tabs = filterTabs.querySelectorAll('.filter-btn');
            tabs.forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            
            currentFilter = e.target.getAttribute('data-type');
            renderCodex();
        }
    });

    sortSelect.addEventListener('change', (e) => {
        currentSort = e.target.value;
        renderCodex();
    });

    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
    });

    // Initialize application UI
    renderCodex();
</script>
</body>
</html>
